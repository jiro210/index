                setCfgUrlInput(cfg.url);
                setCfgKeyInput(cfg.key);
                setAuthMessage(null);
            };

            const resolveConflictUseCloud = () => {
                if (conflictRow) applyCloud(conflictRow);
            };

            const resolveConflictUseLocal = () => {
                if (!conflictRow) return;
                cloudRevRef.current = Number(conflictRow.rev) || 1;
                lastSyncedJsonRef.current = null;
                lsSet('jff_synced_user', authUserId);
                lsSet('jff_dirty', '1');
                setConflictRow(null);
                setCloudReady(true);
                setTimeout(() => { if (pushRef.current) pushRef.current('manual'); }, 50);
            };

            const toggleAutoSync = () => {
                const next = !autoSync;
                setAutoSync(next);
                lsSet('jff_auto_sync', next ? '1' : '0');
                showToast(next ? 'Đã bật tự động lưu lên đám mây' : 'Đã tắt tự động, hãy bấm "Lưu ngay" để lưu', 'success');
            };

            // Danh sách tối đa 5 bản đã tải lên
            useEffect(() => {
                if (!sb || !authUserId || !showAccountModal) return;
                let cancelled = false;
                (async () => {
                    setVersionsLoading(true);
                    const { data, error } = await sb
                        .from('jff_backups')
                        .select('id, created_at, kind, summary')
                        .order('created_at', { ascending: false })
                        .limit(MAX_CLOUD_VERSIONS);
                    if (cancelled) return;
                    setVersionsLoading(false);
                    if (error) {
                        setVersionsError(error.code === 'PGRST205' ? 'Chưa có bảng jff_backups trong Supabase. Hãy chạy lại supabase_setup.sql.' : translateSyncError(error));
                        return;
                    }
                    setVersionsError('');
                    setVersions(data || []);
                })();
                return () => { cancelled = true; };
            }, [sb, authUserId, showAccountModal, versionsTick]);

            const handleRestoreVersion = async (v) => {
                if (!sb || !authUserId) return;
                const when = new Date(v.created_at).toLocaleString('vi-VN');
                if (!window.confirm(`Khôi phục bản đã lưu lúc ${when}?\n\nDữ liệu hiện tại trên máy sẽ được thay bằng bản này (vẫn có thể bấm Hoàn tác).`)) return;
                setAuthBusy(true);
                try {
                    const { data: row, error } = await sb.from('jff_backups').select('data').eq('id', v.id).single();
                    if (error) throw error;
                    const cloudWs = row && row.data && Array.isArray(row.data.workspaces) ? row.data.workspaces : null;
                    if (!cloudWs || cloudWs.length === 0) throw new Error('Bản lưu rỗng hoặc sai cấu trúc.');
                    saveSnapshotForUndo('Khôi phục bản đã tải lên');
                    const localById = {};
                    workspacesRef.current.forEach(w => { localById[w.id] = w; });
                    const merged = cloudWs.map(w => {
                        const local = localById[w.id];
                        if (!w.bgImage && local && typeof local.bgImage === 'string' && local.bgImage.indexOf('data:') === 0) {
                            return { ...w, bgImage: local.bgImage };
                        }
                        return w;
                    });
                    setWorkspaces(merged);
                    setActiveWsId(prev => (merged.some(w => w.id === prev) ? prev : merged[0].id));
                    setShowAccountModal(false);
                    showToast(autoSync ? 'Đã khôi phục bản đã chọn, đang lưu lên đám mây' : 'Đã khôi phục bản đã chọn. Bấm "Lưu ngay" nếu muốn ghi lên đám mây', 'success');
                } catch (err) {
                    showToast('Không khôi phục được: ' + translateSyncError(err), 'warning');
                } finally {
                    setAuthBusy(false);
                }
            };

            const handleConflictSignOut = async () => {
                setConflictRow(null);
                if (sb) {
                    try { await sb.auth.signOut(); } catch (e) { /* bỏ qua */ }
                }
            };

            const syncLabel = !window.supabase ? 'Không tải được thư viện Supabase'
                : !sb ? 'Chưa kết nối Supabase'
                : !authUser ? 'Chưa đăng nhập'
                : ({
                    off: 'Chưa đồng bộ',
                    syncing: 'Đang đồng bộ...',
                    pending: autoSync ? 'Có thay đổi, sắp lưu lên đám mây' : 'Có thay đổi chưa lưu lên đám mây',
                    saved: 'Đã lưu lên đám mây',
                    error: 'Lỗi đồng bộ',
                    conflict: 'Cần chọn bản dữ liệu'
                }[syncStatus] || '');

            const cloudIconClass = !sb || !authUser ? 'fa-cloud text-slate-400'
                : syncStatus === 'syncing' ? 'fa-rotate fa-spin text-cyan-300'
                : syncStatus === 'pending' ? 'fa-cloud-arrow-up text-amber-300'
                : syncStatus === 'saved' ? 'fa-cloud text-emerald-400'
                : 'fa-triangle-exclamation text-amber-400';
            const moveFundOrder = (index, direction) => {
                saveSnapshotForUndo('Thay đổi thứ tự quỹ');
                const newFunds = [...funds];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newFunds.length) return;
                const temp = newFunds[index];
                newFunds[index] = newFunds[targetIndex];
                newFunds[targetIndex] = temp;
                setFunds(newFunds);
            };

            const handleUpdateFundConfig = (id, field, value) => {
                saveSnapshotForUndo('Cập nhật cài đặt quỹ');
                setFunds(prev => prev.map(f => f.id === id ? { ...f, [field]: value } : f));
            };

            const handleAddNewFund = () => {
                saveSnapshotForUndo('Thêm quỹ mới');
                const newFund = {
                    id: 'f_' + Date.now(),
                    name: 'Quỹ Mới',
                    bankInfo: 'Thông tin TK',
                    type: 'percent',
                    percent: 10,
                    vndAmount: 100000,
                    color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')
                };
                setFunds(prev => [...prev, newFund]);
                showToast('Đã thêm quỹ mới!');
            };

            const handleDeleteFund = (id) => {
                if (funds.length <= 1) {
                    showToast('Phải giữ lại ít nhất 1 quỹ!', 'warning');
                    return;
                }
                saveSnapshotForUndo('Xóa quỹ');
                setFunds(prev => prev.filter(f => f.id !== id));
                showToast('Đã xóa quỹ!');
            };

            return (
                <div className="max-w-md mx-auto w-full pb-28 pt-4 px-4 min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Header Bar */}
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2.5">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 flex items-center justify-center text-cyan-400 font-bold shadow-lg transition-all active:scale-95"
                                    title="Mở menu quản lý Workspace / Cài đặt"
                                >
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>

                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h1 className="font-black text-base text-white tracking-tight">Jiro Financial</h1>
                                        <span className="text-[10px] bg-cyan-950/90 border border-cyan-800/80 text-cyan-300 font-bold px-2 py-0.2 rounded-full">
                                            {currentWs.name}
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-cyan-400 font-medium">Tự Do Tài Chính</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setShowAccountModal(true)}
                                    className="relative w-9 h-9 rounded-xl bg-slate-900/90 border border-slate-800 hover:border-cyan-500/50 flex items-center justify-center transition-all active:scale-95"
                                    title={syncLabel}
                                >
                                    <i className={`fa-solid ${cloudIconClass} text-sm`}></i>
                                </button>
                                <div className="text-right">
                                <div className="inline-flex flex-col items-end px-2.5 py-1 rounded-xl bg-slate-900/90 border border-slate-800">
                                    <span className="text-xs font-black text-cyan-400 font-mono tracking-wide">
                                        {getTimeStrInTZ(currentTimezone, nowDate)}
                                    </span>
                                    <span className="text-[9px] text-slate-400 font-medium">
                                        {getDateStrInTZ(currentTimezone, nowDate)}
                                    </span>
                                </div>
                            </div>
                            </div>
                        </div>

                        {/* Toast Notification */}
                        {toastMessage && (
                            <div className={`mb-4 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all animate-bounce shadow-xl ${
                                toastMessage.type === 'warning' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                toastMessage.type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                                'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                            }`}>
                                <i className="fa-solid fa-circle-info"></i>
                                <span>{toastMessage.msg}</span>
                            </div>
                        )}

                        {}
                        {activeTab === 'input' && (
                            <div className="space-y-4 animate-fadeIn">
                                {/* Income Card */}
                                <div className="glass-panel p-4 rounded-2xl relative overflow-hidden glow-effect space-y-3">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                    
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-bold text-cyan-300 uppercase tracking-wider">
                                            Nhập Tổng Thu Nhập
                                        </label>
                                        {parsedTotalIncome > 0 && (
                                            <button 
                                                onClick={() => setTotalIncomeInput('')}
                                                className="text-[11px] text-slate-400 hover:text-rose-400"
                                            >
                                                Xóa số tiền
                                            </button>
                                        )}
                                    </div>

                                    <div className="relative flex items-center">
                                        <input 
                                            type="text"
                                            inputMode="numeric"
                                            placeholder="0"
                                            value={totalIncomeInput}
                                            onChange={(e) => {
                                                const rawVal = e.target.value.replace(/[^\d]/g, '');
                                                if (!rawVal) {
                                                    setTotalIncomeInput('');
                                                    return;
                                                }
                                                setTotalIncomeInput(formatVNDPlain(parseInt(rawVal, 10)));
                                            }}
                                            className="w-full bg-slate-900/90 text-2xl font-black text-cyan-400 px-4 py-2.5 rounded-xl border border-cyan-500/30 focus:border-cyan-400 focus:outline-none transition-all placeholder-slate-600"
                                        />
                                        <span className="absolute right-4 text-cyan-500 font-bold text-lg">₫</span>
                                    </div>

                                    <div>
                                        <label className="text-[10px] text-slate-400 font-semibold uppercase block mb-1">
                                            Ghi chú / Nguồn thu (Không bắt buộc)
                                        </label>
                                        <input 
                                            type="text"
                                            placeholder="Lương, Thưởng, Chuyển khoản..."
                                            value={incomeNote}
                                            onChange={(e) => setIncomeNote(e.target.value)}
                                            className="w-full bg-slate-900/80 text-xs text-slate-200 px-3 py-1.5 rounded-lg border border-slate-800 focus:border-cyan-500/50 focus:outline-none"
                                        />
                                    </div>

                                    {parsedTotalIncome > 0 && (
                                        <div className="space-y-1.5 pt-1">
                                            <div className="flex justify-between text-[10px] text-slate-400">
                                                <span>Tỷ lệ phân bổ thực tế</span>
                                                <span>{fmtPct(parsedTotalIncome > 0 ? (planMeta.allocated / parsedTotalIncome) * 100 : 0)}%</span>
                                            </div>
                                            <div className="h-2.5 w-full bg-slate-900 rounded-full overflow-hidden flex">
                                                {calculatedAllocations.map(f => {
                                                    const pct = parsedTotalIncome > 0 ? (f.finalAmount / parsedTotalIncome) * 100 : 0;
                                                    if (pct <= 0) return null;
                                                    return (
                                                        <div 
                                                            key={f.id} 
                                                            style={{ width: `${pct}%`, backgroundColor: f.color }}
                                                            title={`${f.name}: ${pct.toFixed(1)}%`}
                                                            className="h-full transition-all"
                                                        />
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs text-slate-400">
                                        <span>Đang phân bổ cho: <strong className="text-white">{planMeta.selectedCount}/{funds.length} quỹ</strong></span>
                                        {Object.keys(overrides).length > 0 && (
                                            <button 
                                                onClick={() => {
                                                    saveSnapshotForUndo('Xóa tất cả chốt thủ công');
                                                    setOverrides({});
                                                    showToast('Đã xóa tất cả chốt thủ công');
                                                }}
                                                className="text-amber-400 hover:text-amber-300 font-medium text-[11px] underline"
                                            >
                                                Đặt lại tất cả tự động
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {}
                                <div className="space-y-2.5">
                                    <div className="flex justify-between items-center px-1">
                                        <span className="text-xs font-semibold text-slate-400">DANH SÁCH QUỸ</span>
                                        <div className="flex items-center gap-3 text-[11px]">
                                            <button onClick={selectAllFunds} className="text-cyan-400 hover:text-cyan-300 font-semibold">Chọn tất cả</button>
                                            <button onClick={deselectAllFunds} className="text-slate-400 hover:text-slate-200 font-semibold">Bỏ chọn</button>
                                        </div>
                                    </div>
                                    <p className="text-[11px] text-slate-500 px-1 -mt-1">Tích chọn quỹ muốn chia tiền vào · Bấm số tiền để chốt · Bấm STK để copy</p>
                                    {debtBanner}

                                    {parsedTotalIncome > 0 && (
                                        <div className="glass-card rounded-xl p-3 text-[11px] space-y-1.5">
                                            <div className="flex justify-between">
                                                <span className="text-slate-400">Quỹ tiền cố định đã chọn</span>
                                                <span className="font-bold text-slate-200">{formatVND(planMeta.vndTotal)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-slate-400">Còn lại chia theo %</span>
                                                <span className="font-bold text-slate-200">{formatVND(planMeta.remaining)}</span>
                                            </div>
                                            {planMeta.adjust === 'raise' && (
                                                <p className="text-cyan-300 bg-cyan-500/10 border border-cyan-500/20 rounded-lg px-2 py-1.5">
                                                    <i className="fa-solid fa-arrow-up-right-dots mr-1"></i>
                                                    Các quỹ % đã chọn mới chiếm {fmtPct(planMeta.pctSum)}%, nên mỗi quỹ được nâng đều +{fmtPct(planMeta.delta)}% để đủ 100%.
                                                </p>
                                            )}
                                            {planMeta.adjust === 'scale' && (
                                                <p className="text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg px-2 py-1.5">
                                                    <i className="fa-solid fa-triangle-exclamation mr-1"></i>
                                                    Tổng % các quỹ đã chọn là {fmtPct(planMeta.pctSum)}% (hơn 100%), đã tự thu nhỏ theo tỷ lệ về 100%.
                                                </p>
                                            )}
                                            {planMeta.noPercentLeft && (
                                                <p className="text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg px-2 py-1.5">
                                                    <i className="fa-solid fa-circle-exclamation mr-1"></i>
                                                    Còn {formatVND(planMeta.remaining)} chưa có quỹ nào nhận. Hãy tích chọn thêm quỹ theo %.
                                                </p>
                                            )}
                                            {planMeta.overflow && (
                                                <p className="text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-lg px-2 py-1.5">
                                                    <i className="fa-solid fa-circle-exclamation mr-1"></i>
                                                    Tổng quỹ tiền cố định đã chọn vượt quá thu nhập nhập vào.
                                                </p>
                                            )}
                                        </div>
                                    )}

                                    {calculatedAllocations.map((fund, idx) => (
                                        <div
                                            key={fund.id}
                                            className={`glass-card p-3 rounded-xl flex items-center justify-between gap-2.5 hover:border-slate-600 transition-all group relative overflow-hidden ${fund.selected ? '' : 'opacity-50'}`}
                                            style={{ borderLeft: `4px solid ${fund.color}` }}
                                        >
                                            <button
                                                onClick={() => toggleFundSelected(fund.id)}
                                                role="checkbox"
                                                aria-checked={fund.selected}
                                                className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition-all active:scale-90 ${
                                                    fund.selected ? 'bg-cyan-500 border-cyan-400 text-slate-950' : 'border-slate-600 text-transparent hover:border-slate-400'
                                                }`}
                                                title={fund.selected ? 'Bỏ chọn quỹ này' : 'Chọn quỹ này để chia tiền'}
                                            >
                                                <i className="fa-solid fa-check text-[11px]"></i>
                                            </button>

                                            <div className="flex flex-col gap-1 text-slate-500 text-xs">
                                                <button
                                                    onClick={() => moveFundOrder(idx, -1)}
                                                    disabled={idx === 0}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển lên"
                                                >
                                                    <i className="fa-solid fa-chevron-up"></i>
                                                </button>
                                                <button
                                                    onClick={() => moveFundOrder(idx, 1)}
                                                    disabled={idx === funds.length - 1}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển xuống"
                                                >
                                                    <i className="fa-solid fa-chevron-down"></i>
                                                </button>
                                            </div>

                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-slate-100 truncate">{fund.name}</span>
                                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700/50 whitespace-nowrap">
                                                        {fund.type === 'vnd'
                                                            ? `${formatVNDPlain(fund.vndAmount)}đ`
                                                            : (fund.selected && fund.effPercent !== null && Math.abs(fund.effPercent - (Number(fund.percent) || 0)) > 0.05
                                                                ? `${fund.percent}% → ${fmtPct(fund.effPercent)}%`
                                                                : `${fund.percent}%`)}
                                                    </span>
                                                </div>
                                                <button
                                                    onClick={() => handleCopyBankInfo(fund.bankInfo, fund.name)}
                                                    className="text-xs text-slate-400 hover:text-cyan-300 truncate mt-0.5 flex items-center gap-1.5 text-left group-hover:underline"
                                                    title="Bấm để sao chép thông tin tài khoản"
                                                >
                                                    <span>{fund.bankInfo || 'Chưa có STK'}</span>
                                                    <i className="fa-regular fa-copy text-[10px] opacity-60"></i>
                                                </button>
                                                {fund.selected && fund.finalAmount < 0 && (
                                                    <div className="text-[10px] mt-1 text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded px-1.5 py-0.5 inline-block">
                                                        <i className="fa-solid fa-arrow-down mr-1"></i>Rút quỹ · tháng sau cần bù lại
                                                    </div>
                                                )}
                                                {fundDebts[fund.id] && fundDebts[fund.id].debtStart > 0 && (
                                                    <div className={`text-[10px] mt-1 rounded px-1.5 py-0.5 inline-block border ${fundDebts[fund.id].remaining > 0 ? 'text-amber-300 bg-amber-500/10 border-amber-500/20' : 'text-emerald-300 bg-emerald-500/10 border-emerald-500/20'}`}>
                                                        {fundDebts[fund.id].remaining > 0 ? `Cần bù: ${formatVND(fundDebts[fund.id].remaining)}` : 'Đã bù đủ tháng này'}
                                                    </div>
                                                )}
                                            </div>

                                            {fund.selected ? (
                                                <div className="text-right cursor-pointer" onClick={() => openFundOverrideModal(fund, fund.finalAmount)}>
                                                    <div className={`font-extrabold text-sm ${fund.finalAmount < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                                                        {formatVND(fund.finalAmount)}
                                                    </div>
                                                    {fund.isOverridden ? (
                                                        <div className="flex items-center justify-end gap-1 mt-0.5">
                                                            <span className="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-1.5 py-0.2 rounded border border-amber-400/30">
                                                                Đã chốt
                                                            </span>
                                                            <button
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    resetFundOverride(fund.id, fund.name);
                                                                }}
                                                                className="text-[10px] text-slate-400 hover:text-rose-400 p-0.5"
                                                                title="Bỏ chốt"
                                                            >
                                                                <i className="fa-solid fa-xmark"></i>
                                                            </button>
                                                        </div>
                                                    ) : (
                                                        <span className="text-[10px] text-slate-500">Tự động</span>
                                                    )}
                                                </div>
                                            ) : (
                                                <div className="text-right">
                                                    <span className="text-[11px] font-semibold text-slate-500">Không chia</span>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'config' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="flex justify-between items-center mb-1">
                                    <div>
                                        <h2 className="text-base font-bold text-white">Cấu Hình Quỹ ({currentWs.name})</h2>
                                        <p className="text-xs text-slate-400">Tổng tỷ lệ % hiện tại: <strong className={totalPercentSum === 100 ? "text-emerald-400" : "text-amber-400"}>{totalPercentSum}%</strong></p>
                                    </div>
                                    <button 
                                        onClick={handleAddNewFund}
                                        className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-md shadow-cyan-600/30"
                                    >
                                        <i className="fa-solid fa-plus"></i> Thêm Quỹ
                                    </button>
                                </div>

                                {totalPercentSum !== 100 && (
                                    <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>Tổng các quỹ theo % đang là <strong>{totalPercentSum}%</strong> (Khuyến nghị 100%).</span>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {funds.map((f, i) => (
                                        <div key={f.id} className="glass-panel p-3.5 rounded-xl space-y-3">
                                            <div className="flex items-center justify-between gap-2">
                                                <div className="flex items-center gap-2 flex-1">
                                                    <input 
                                                        type="color" 
                                                        value={f.color || '#3b82f6'} 
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'color', e.target.value)}
                                                        className="w-6 h-6 rounded border-0 bg-transparent cursor-pointer"
                                                    />
                                                    <input
