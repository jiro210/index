<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JFF - Jiro Financial Freedom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.7);
        }
        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Date utilities formatted for current timezone
        const getTodayDateStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getFirstDayOfMonthStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            return `${year}-${month}-01`;
        };

        const formatVND = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0 ₫';
            return new Intl.NumberFormat('vi-VN').format(num) + ' ₫';
        };

        const formatVNDPlain = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return new Intl.NumberFormat('vi-VN').format(num);
        };

        const parseVNDInput = (str) => {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^\d-]/g, '');
            return parseInt(cleaned, 10) || 0;
        };

        // Initial default funds list
        const DEFAULT_FUNDS = [
            { id: 'f1', name: 'Trợ', bankInfo: 'MBB 0001', type: 'vnd', percent: 0, vndAmount: 300000, color: '#3b82f6' },
            { id: 'f2', name: 'Ăn uống', bankInfo: 'MBB 0002', type: 'percent', percent: 40, vndAmount: 0, color: '#10b981' },
            { id: 'f3', name: 'Đi chơi', bankInfo: 'VCB 1001', type: 'percent', percent: 30, vndAmount: 0, color: '#8b5cf6' },
            { id: 'f4', name: 'Dự phòng', bankInfo: 'TCB 1002', type: 'percent', percent: 10, vndAmount: 0, color: '#ec4899' },
            { id: 'f5', name: 'Tiết kiệm', bankInfo: 'TCB 1003', type: 'percent', percent: 20, vndAmount: 0, color: '#f59e0b' }
        ];

        function App() {
            // Tabs: 'input' | 'config' | 'history'
            const [activeTab, setActiveTab] = useState('input');

            // Persistent States
            const [funds, setFunds] = useState(() => {
                const saved = localStorage.getItem('jff_funds_v4');
                return saved ? JSON.parse(saved) : DEFAULT_FUNDS;
            });

            const [totalIncomeInput, setTotalIncomeInput] = useState('');
            const [overrides, setOverrides] = useState({}); // { fundId: amount }
            
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('jff_history_v4');
                return saved ? JSON.parse(saved) : [];
            });

            // Undo Stack
            const [undoStack, setUndoStack] = useState([]);

            // History Date Range Filters (Default: First day of current month to today)
            const [startDate, setStartDate] = useState(getFirstDayOfMonthStr());
            const [endDate, setEndDate] = useState(getTodayDateStr());
            const [expandedHistoryId, setExpandedHistoryId] = useState(null);

            // Modal dialog for manual fund override
            const [editingFundOverride, setEditingFundOverride] = useState(null);
            const [overrideInputValue, setOverrideInputValue] = useState('');

            // Notification message state
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 2500);
            };

            // Save funds & history to LocalStorage
            useEffect(() => {
                localStorage.setItem('jff_funds_v4', JSON.stringify(funds));
            }, [funds]);

            useEffect(() => {
                localStorage.setItem('jff_history_v4', JSON.stringify(history));
            }, [history]);

            const saveSnapshotForUndo = (description) => {
                const snapshot = {
                    funds: JSON.parse(JSON.stringify(funds)),
                    history: JSON.parse(JSON.stringify(history)),
                    overrides: { ...overrides },
                    totalIncomeInput,
                    description
                };
                setUndoStack(prev => [...prev.slice(-10), snapshot]); // keep last 10 steps
            };

            const handleUndo = () => {
                if (undoStack.length === 0) return;
                const lastState = undoStack[undoStack.length - 1];
                setUndoStack(prev => prev.slice(0, -1));

                setFunds(lastState.funds);
                setHistory(lastState.history);
                setOverrides(lastState.overrides);
                setTotalIncomeInput(lastState.totalIncomeInput);
                showToast(`Đã hoàn tác: ${lastState.description}`, 'success');
            };

            const parsedTotalIncome = useMemo(() => parseVNDInput(totalIncomeInput), [totalIncomeInput]);

            // Calculation Logic:
            // 1. Fixed VND funds subtract their default base amount from Total Income.
            // 2. Remaining income is distributed among Percent funds based on their configured %.
            // 3. If a fund has an override, totalAllocated becomes the overridden amount, but DOES NOT shift pool calculations for other funds.
            const calculatedAllocations = useMemo(() => {
                const income = parsedTotalIncome;

                // Sum of default fixed VND fund amounts
                let defaultVndSum = 0;
                funds.forEach(f => {
                    if (f.type === 'vnd') {
                        defaultVndSum += (Number(f.vndAmount) || 0);
                    }
                });

                const remainingForPercent = Math.max(0, income - defaultVndSum);

                return funds.map(fund => {
                    let baseAllocated = 0;
                    if (income > 0) {
                        if (fund.type === 'vnd') {
                            baseAllocated = Number(fund.vndAmount) || 0;
                        } else {
                            baseAllocated = Math.round((remainingForPercent * (Number(fund.percent) || 0)) / 100);
                        }
                    }

                    const isOverridden = overrides[fund.id] !== undefined;
                    const finalAmount = isOverridden ? overrides[fund.id] : baseAllocated;

                    return {
                        ...fund,
                        baseAllocated,
                        finalAmount,
                        isOverridden
                    };
                });
            }, [funds, parsedTotalIncome, overrides]);

            const handleIncomeChange = (e) => {
                const rawVal = e.target.value.replace(/[^\d]/g, '');
                if (!rawVal) {
                    setTotalIncomeInput('');
                    return;
                }
                const num = parseInt(rawVal, 10);
                setTotalIncomeInput(formatVNDPlain(num));
            };

            const openFundOverrideModal = (fund, currentFinalAmount) => {
                setEditingFundOverride(fund);
                setOverrideInputValue(formatVNDPlain(currentFinalAmount));
            };

            const applyFundOverride = () => {
                if (!editingFundOverride) return;
                saveSnapshotForUndo('Chốt thủ công quỹ ' + editingFundOverride.name);
                const numVal = parseVNDInput(overrideInputValue);
                setOverrides(prev => ({
                    ...prev,
                    [editingFundOverride.id]: numVal
                }));
                setEditingFundOverride(null);
                showToast(`Đã chốt ${editingFundOverride.name}: ${formatVND(numVal)}`, 'success');
            };

            const resetFundOverride = (fundId, fundName) => {
                saveSnapshotForUndo('Bỏ chốt thủ công ' + fundName);
                setOverrides(prev => {
                    const next = { ...prev };
                    delete next[fundId];
                    return next;
                });
                showToast(`Đã đặt lại tự động cho ${fundName}`);
            };

            const handleRecordAllocation = () => {
                if (parsedTotalIncome <= 0) {
                    showToast('Vui lòng nhập Tổng Thu Nhập > 0', 'warning');
                    return;
                }

                saveSnapshotForUndo('Ghi nhận thu nhập');

                const now = new Date();
                const timeString = now.toTimeString().split(' ')[0];
                const dateStr = getTodayDateStr();

                const record = {
                    id: 'rec_' + Date.now(),
                    date: dateStr,
                    timestamp: `${dateStr} ${timeString}`,
                    totalIncome: parsedTotalIncome,
                    allocations: calculatedAllocations.map(a => ({
                        fundId: a.id,
                        fundName: a.name,
                        bankInfo: a.bankInfo,
                        amount: a.finalAmount
                    }))
                };

                setHistory(prev => [record, ...prev]);
                setOverrides({});
                showToast('Đã lưu lịch sử phân bổ thành công!', 'success');
            };

            const handleDeleteHistoryItem = (recId) => {
                saveSnapshotForUndo('Xóa lịch sử ghi nhận');
                setHistory(prev => prev.filter(item => item.id !== recId));
                showToast('Đã xóa 1 bản ghi lịch sử');
            };

            const filteredHistory = useMemo(() => {
                if (!startDate && !endDate) return history;
                return history.filter(item => {
                    const itemDate = item.date;
                    if (startDate && itemDate < startDate) return false;
                    if (endDate && itemDate > endDate) return false;
                    return true;
                });
            }, [history, startDate, endDate]);

            // Aggregated Totals strictly for EXISTING ACTIVE FUNDS
            const historyAggregatedData = useMemo(() => {
                let grandTotalIncome = 0;
                
                // Initialize map for exact active funds
                const fundTotalsMap = {};
                funds.forEach(f => {
                    fundTotalsMap[f.id] = {
                        id: f.id,
                        name: f.name,
                        bankInfo: f.bankInfo,
                        color: f.color,
                        totalAmount: 0
                    };
                });

                let legacyTotal = 0;

                filteredHistory.forEach(rec => {
                    grandTotalIncome += (Number(rec.totalIncome) || 0);
                    if (Array.isArray(rec.allocations)) {
                        rec.allocations.forEach(alloc => {
                            if (fundTotalsMap[alloc.fundId]) {
                                fundTotalsMap[alloc.fundId].totalAmount += (Number(alloc.amount) || 0);
                            } else {
                                // Try fallback matching by name
                                const matched = funds.find(f => f.name === alloc.fundName);
                                if (matched && fundTotalsMap[matched.id]) {
                                    fundTotalsMap[matched.id].totalAmount += (Number(alloc.amount) || 0);
                                } else {
                                    legacyTotal += (Number(alloc.amount) || 0);
                                }
                            }
                        });
                    }
                });

                const activeFundList = funds.map(f => fundTotalsMap[f.id]);

                // Append legacy total if old funds were deleted
                if (legacyTotal > 0) {
                    activeFundList.push({
                        id: 'legacy_other',
                        name: 'Quỹ cũ/Khác',
                        bankInfo: 'Dữ liệu trước',
                        color: '#6b7280',
                        totalAmount: legacyTotal
                    });
                }

                return {
                    grandTotalIncome,
                    count: filteredHistory.length,
                    activeFundList
                };
            }, [filteredHistory, funds]);

            const moveFundOrder = (index, direction) => {
                saveSnapshotForUndo('Thay đổi thứ tự quỹ');
                const newFunds = [...funds];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newFunds.length) return;
                const temp = newFunds[index];
                newFunds[index] = newFunds[targetIndex];
                newFunds[targetIndex] = temp;
                setFunds(newFunds);
            };

            const handleUpdateFundConfig = (id, field, value) => {
                saveSnapshotForUndo('Cập nhật cài đặt quỹ');
                setFunds(prev => prev.map(f => f.id === id ? { ...f, [field]: value } : f));
            };

            const handleAddNewFund = () => {
                saveSnapshotForUndo('Thêm quỹ mới');
                const newFund = {
                    id: 'f_' + Date.now(),
                    name: 'Quỹ Mới',
                    bankInfo: 'Nguồn khác',
                    type: 'percent',
                    percent: 10,
                    vndAmount: 100000,
                    color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')
                };
                setFunds(prev => [...prev, newFund]);
                showToast('Đã thêm quỹ mới!');
            };

            const handleDeleteFund = (id) => {
                if (funds.length <= 1) {
                    showToast('Phải giữ lại ít nhất 1 quỹ!', 'warning');
                    return;
                }
                saveSnapshotForUndo('Xóa quỹ');
                setFunds(prev => prev.filter(f => f.id !== id));
                showToast('Đã xóa quỹ!');
            };

            return (
                <div className="max-w-md mx-auto w-full pb-24 pt-4 px-4 min-h-screen flex flex-col justify-between">
                    {/* Header */}
                    <div>
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-cyan-500/30">
                                    J
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg text-white tracking-tight">Jiro Financial</h1>
                                    <p className="text-xs text-cyan-400 font-medium">Tự Do Tài Chính</p>
                                </div>
                            </div>
                            
                            {/* Reset Month Quick Filter Notification */}
                            <div className="text-right">
                                <span className="inline-flex items-center gap-1 text-[11px] px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700">
                                    <i className="fa-solid fa-clock text-cyan-400"></i>
                                    {getTodayDateStr()}
                                </span>
                            </div>
                        </div>

                        {/* Toast Notification */}
                        {toastMessage && (
                            <div className={`mb-4 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all animate-bounce shadow-lg ${
                                toastMessage.type === 'warning' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                toastMessage.type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                                'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                            }`}>
                                <i className="fa-solid fa-circle-info"></i>
                                <span>{toastMessage.msg}</span>
                            </div>
                        )}

                        {}
                        {activeTab === 'input' && (
                            <div className="space-y-5 animate-fadeIn">
                                {/* Income Card */}
                                <div className="glass-panel p-5 rounded-2xl relative overflow-hidden glow-effect">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                    <label className="block text-xs font-medium text-cyan-300 mb-1.5 uppercase tracking-wider">
                                        Nhập Tổng Thu Nhập
                                    </label>
                                    <div className="relative flex items-center">
                                        <input 
                                            type="text"
                                            inputMode="numeric"
                                            placeholder="0"
                                            value={totalIncomeInput}
                                            onChange={handleIncomeChange}
                                            className="w-full bg-slate-900/90 text-2xl font-black text-cyan-400 px-4 py-3 rounded-xl border border-cyan-500/30 focus:border-cyan-400 focus:outline-none transition-all placeholder-slate-600"
                                        />
                                        <span className="absolute right-4 text-cyan-500 font-bold text-lg">₫</span>
                                    </div>

                                    <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400">
                                        <span>Phân bổ cho: <strong className="text-white">{funds.length} quỹ</strong></span>
                                        {Object.keys(overrides).length > 0 && (
                                            <button 
                                                onClick={() => {
                                                    saveSnapshotForUndo('Xóa tất cả chốt thủ công');
                                                    setOverrides({});
                                                    showToast('Đã xóa tất cả chốt thủ công');
                                                }}
                                                className="text-amber-400 hover:text-amber-300 font-medium text-[11px] underline"
                                            >
                                                Đặt lại tất cả tự động
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Funds List */}
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center text-xs font-semibold text-slate-400 px-1">
                                        <span>DANH SÁCH QUỸ</span>
                                        <span className="text-[11px] text-slate-500">Chạm để chốt số tiền</span>
                                    </div>

                                    {calculatedAllocations.map((fund, idx) => (
                                        <div 
                                            key={fund.id}
                                            className="glass-card p-3.5 rounded-xl flex items-center justify-between gap-3 hover:border-slate-600 transition-all group relative overflow-hidden"
                                            style={{ borderLeft: `4px solid ${fund.color}` }}
                                        >
                                            {/* Reorder Buttons */}
                                            <div className="flex flex-col gap-1 text-slate-500 text-xs">
                                                <button 
                                                    onClick={() => moveFundOrder(idx, -1)}
                                                    disabled={idx === 0}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển lên"
                                                >
                                                    <i className="fa-solid fa-chevron-up"></i>
                                                </button>
                                                <button 
                                                    onClick={() => moveFundOrder(idx, 1)}
                                                    disabled={idx === funds.length - 1}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển xuống"
                                                >
                                                    <i className="fa-solid fa-chevron-down"></i>
                                                </button>
                                            </div>

                                            {/* Fund Details */}
                                            <div className="flex-1 min-w-0" onClick={() => openFundOverrideModal(fund, fund.finalAmount)}>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-slate-100 truncate">{fund.name}</span>
                                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700/50">
                                                        {fund.type === 'vnd' ? `${formatVNDPlain(fund.vndAmount)}đ` : `${fund.percent}%`}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-400 truncate mt-0.5">{fund.bankInfo}</p>
                                            </div>

                                            {/* Allocated Value & Override Badge */}
                                            <div className="text-right cursor-pointer" onClick={() => openFundOverrideModal(fund, fund.finalAmount)}>
                                                <div className="font-extrabold text-sm text-emerald-400">
                                                    {formatVND(fund.finalAmount)}
                                                </div>
                                                {fund.isOverridden ? (
                                                    <div className="flex items-center justify-end gap-1 mt-0.5">
                                                        <span className="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-1.5 py-0.2 rounded border border-amber-400/30">
                                                            Đã chốt
                                                        </span>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                resetFundOverride(fund.id, fund.name);
                                                            }}
                                                            className="text-[10px] text-slate-400 hover:text-rose-400 p-0.5"
                                                            title="Bỏ chốt"
                                                        >
                                                            <i className="fa-solid fa-xmark"></i>
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <span className="text-[10px] text-slate-500">Tự động</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'config' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="flex justify-between items-center mb-2">
                                    <div>
                                        <h2 className="text-base font-bold text-white">Cấu Hình Quỹ</h2>
                                        <p className="text-xs text-slate-400">Thêm, sửa tỷ lệ hoặc số tiền cố định</p>
                                    </div>
                                    <button 
                                        onClick={handleAddNewFund}
                                        className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-md shadow-cyan-600/30"
                                    >
                                        <i className="fa-solid fa-plus"></i> Thêm Quỹ
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    {funds.map((f, i) => (
                                        <div key={f.id} className="glass-panel p-3.5 rounded-xl space-y-3">
                                            <div className="flex items-center justify-between gap-2">
                                                <div className="flex items-center gap-2 flex-1">
                                                    <input 
                                                        type="color" 
                                                        value={f.color || '#3b82f6'} 
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'color', e.target.value)}
                                                        className="w-6 h-6 rounded border-0 bg-transparent cursor-pointer"
                                                    />
                                                    <input 
                                                        type="text" 
                                                        value={f.name}
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'name', e.target.value)}
                                                        className="bg-slate-900 border border-slate-700 text-white font-bold text-sm px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500"
                                                        placeholder="Tên quỹ"
                                                    />
                                                </div>

                                                <button 
                                                    onClick={() => handleDeleteFund(f.id)}
                                                    className="text-slate-500 hover:text-rose-400 p-1 text-sm"
                                                    title="Xóa quỹ"
                                                >
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2 text-xs">
                                                <div>
                                                    <label className="text-slate-400 text-[10px] block mb-1">Thông tin TK/Mô tả</label>
                                                    <input 
                                                        type="text" 
                                                        value={f.bankInfo}
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'bankInfo', e.target.value)}
                                                        className="bg-slate-900 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500"
                                                        placeholder="VÍ dụ: MBB 0001"
                                                    />
                                                </div>

                                                <div>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <label className="text-slate-400 text-[10px]">Đơn vị tính</label>
                                                        <div className="flex text-[10px] border border-slate-700 rounded overflow-hidden">
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleUpdateFundConfig(f.id, 'type', 'percent')}
                                                                className={`px-1.5 py-0.5 ${f.type === 'percent' ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400'}`}
                                                            >
                                                                %
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleUpdateFundConfig(f.id, 'type', 'vnd')}
                                                                className={`px-1.5 py-0.5 ${f.type === 'vnd' ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400'}`}
                                                            >
                                                                ₫
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {f.type === 'percent' ? (
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="number" 
                                                                value={f.percent}
                                                                onChange={(e) => handleUpdateFundConfig(f.id, 'percent', Number(e.target.value) || 0)}
                                                                className="bg-slate-900 border border-slate-700 text-cyan-400 font-bold text-xs px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500 pr-6"
                                                            />
                                                            <span className="absolute right-2 text-slate-500 text-xs">%</span>
                                                        </div>
                                                    ) : (
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="text" 
                                                                value={formatVNDPlain(f.vndAmount)}
                                                                onChange={(e) => handleUpdateFundConfig(f.id, 'vndAmount', parseVNDInput(e.target.value))}
                                                                className="bg-slate-900 border border-slate-700 text-cyan-400 font-bold text-xs px-2 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500 pr-5"
                                                            />
                                                            <span className="absolute right-1.5 text-slate-500 text-[10px]">₫</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'history' && (
                            <div className="space-y-4 animate-fadeIn">
                                {/* Date Search Filters */}
                                <div className="glass-panel p-4 rounded-xl space-y-3">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[11px] font-semibold text-slate-300 mb-1 block uppercase">Từ ngày</label>
                                            <input 
                                                type="date" 
                                                value={startDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-2.5 py-2 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-semibold text-slate-300 mb-1 block uppercase">Đến ngày</label>
                                            <input 
                                                type="date" 
                                                value={endDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-2.5 py-2 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-1">
                                        <button 
                                            onClick={() => {
                                                // Reset filter to month-to-date
                                                setStartDate(getFirstDayOfMonthStr());
                                                setEndDate(getTodayDateStr());
                                                showToast('Đã chuyển về tra cứu Tháng Hiện Tại');
                                            }}
                                            className="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg flex items-center justify-center gap-1"
                                        >
                                            <i className="fa-solid fa-calendar-day text-cyan-400"></i> Tháng này
                                        </button>
                                        <button 
                                            onClick={() => showToast(`Đã tra cứu ${filteredHistory.length} bản ghi`)}
                                            className="flex-1 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-lg shadow-md shadow-cyan-600/20 flex items-center justify-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-magnifying-glass"></i> Tra Cứu
                                        </button>
                                    </div>
                                </div>

                                {/* Summary Statistics Card */}
                                <div className="glass-panel p-4 rounded-xl border border-cyan-500/20 space-y-3">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">THỐNG KÊ TỔNG HỢP TRONG KHOẢNG THỜI GIAN</p>
                                        <div className="flex items-baseline justify-between mt-1">
                                            <h3 className="text-xl font-black text-cyan-400">
                                                {formatVND(historyAggregatedData.grandTotalIncome)}
                                            </h3>
                                            <span className="text-xs bg-cyan-950/80 border border-cyan-800/50 text-cyan-300 px-2 py-0.5 rounded-full font-medium">
                                                {historyAggregatedData.count} lần ghi nhận
                                            </span>
                                        </div>
                                    </div>

                                    {/* Compact Funds Summary Grid - ONLY ACTIVE CURRENT FUNDS */}
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">TỔNG SỐ TIỀN CHI TIẾT CỦA TỪNG QUỸ:</p>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {historyAggregatedData.activeFundList.map(fund => (
                                                <div 
                                                    key={fund.id} 
                                                    className="bg-slate-900/90 p-2 rounded-lg border border-slate-800/80 text-left min-w-0"
                                                    style={{ borderTop: `2px solid ${fund.color}` }}
                                                >
                                                    <p className="text-[10px] text-slate-400 font-semibold truncate" title={fund.name}>
                                                        {fund.name}
                                                    </p>
                                                    <p className="text-[11px] font-extrabold text-white truncate mt-0.5">
                                                        {formatVND(fund.totalAmount)}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Collapsible Daily History List */}
                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-slate-400 px-1 uppercase">CHI TIẾT CÁC NGÀY GHI NHẬN ({filteredHistory.length})</p>
                                    
                                    {filteredHistory.length === 0 ? (
                                        <div className="text-center py-8 glass-panel rounded-xl text-slate-500 text-xs">
                                            Không có lịch sử phân bổ nào trong khoảng thời gian này.
                                        </div>
                                    ) : (
                                        filteredHistory.map(rec => {
                                            const isExpanded = expandedHistoryId === rec.id;
                                            return (
                                                <div key={rec.id} className="glass-card rounded-xl overflow-hidden border border-slate-800">
                                                    {/* Header Accordion */}
                                                    <div 
                                                        onClick={() => setExpandedHistoryId(isExpanded ? null : rec.id)}
                                                        className="p-3 flex items-center justify-between cursor-pointer hover:bg-slate-800/50 transition-colors"
                                                    >
                                                        <div className="flex items-center gap-2.5 min-w-0">
                                                            <button className="text-slate-400 text-xs p-1">
                                                                <i className={`fa-solid ${isExpanded ? 'fa-chevron-up text-cyan-400' : 'fa-chevron-down'}`}></i>
                                                            </button>
                                                            <div className="min-w-0">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-bold text-xs text-slate-200">{rec.date}</span>
                                                                    <span className="text-[10px] text-slate-500">{rec.timestamp.split(' ')[1] || ''}</span>
                                                                </div>
                                                                <p className="text-xs font-bold text-emerald-400 mt-0.5">
                                                                    Tổng thu: {formatVND(rec.totalIncome)}
                                                                </p>
                                                            </div>
                                                        </div>

                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDeleteHistoryItem(rec.id);
                                                            }}
                                                            className="text-slate-500 hover:text-rose-400 p-2 text-xs"
                                                            title="Xóa bản ghi này"
                                                        >
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    </div>

                                                    {/* Expanded Fund Detail List */}
                                                    {isExpanded && (
                                                        <div className="bg-slate-950/70 p-3 border-t border-slate-800/80 space-y-1.5 animate-fadeIn">
                                                            {rec.allocations.map((alloc, idx) => (
                                                                <div key={idx} className="flex justify-between items-center text-xs py-1 border-b border-slate-800/40 last:border-0">
                                                                    <span className="text-slate-300 font-medium">{alloc.fundName}</span>
                                                                    <span className="text-emerald-400 font-bold">{formatVND(alloc.amount)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {}
                    {editingFundOverride && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-base font-bold text-white">Chốt Tiền Cho Quỹ</h3>
                                        <p className="text-xs text-cyan-400 font-semibold">{editingFundOverride.name}</p>
                                    </div>
                                    <button 
                                        onClick={() => setEditingFundOverride(null)}
                                        className="text-slate-400 hover:text-white text-lg p-1"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div>
                                    <label className="text-[11px] text-slate-300 block mb-1">Nhập Số Tiền Muốn Chốt Cứng</label>
                                    <div className="relative flex items-center">
                                        <input 
                                            type="text" 
                                            inputMode="numeric"
                                            value={overrideInputValue}
                                            onChange={(e) => {
                                                const raw = e.target.value.replace(/[^\d]/g, '');
                                                setOverrideInputValue(raw ? formatVNDPlain(parseInt(raw, 10)) : '');
                                            }}
                                            className="w-full bg-slate-900 border border-slate-700 text-cyan-400 font-black text-lg px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-400"
                                            autoFocus
                                        />
                                        <span className="absolute right-3 text-cyan-500 font-bold text-sm">₫</span>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button 
                                        onClick={() => {
                                            resetFundOverride(editingFundOverride.id, editingFundOverride.name);
                                            setEditingFundOverride(null);
                                        }}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Đặt về Tự Động
                                    </button>
                                    <button 
                                        onClick={applyFundOverride}
                                        className="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl shadow-md shadow-cyan-600/30"
                                    >
                                        Chốt Tiền
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <div className="fixed bottom-3 left-0 right-0 max-w-md mx-auto px-4 z-40">
                        <div className="glass-panel rounded-2xl p-2 flex items-center justify-between border border-slate-700/80 shadow-2xl backdrop-blur-md">
                            {/* Tab Switchers */}
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => setActiveTab('input')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'input' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-calculator"></i> Nhập Liệu
                                </button>
                                
                                <button 
                                    onClick={() => setActiveTab('config')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'config' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-sliders"></i> Cấu Hình
                                </button>

                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'history' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-clock-rotate-left"></i> Lịch Sử
                                </button>
                            </div>

                            {/* Action Buttons: UNDO & RECORD */}
                            <div className="flex items-center gap-1.5 border-l border-slate-800 pl-2">
                                {/* UNDO BUTTON */}
                                <button 
                                    onClick={handleUndo}
                                    disabled={undoStack.length === 0}
                                    className={`p-2.5 rounded-xl text-xs font-medium flex items-center justify-center transition-all ${
                                        undoStack.length > 0 
                                            ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30' 
                                            : 'bg-slate-800/40 text-slate-600 border border-slate-800 opacity-50 cursor-not-allowed'
                                    }`}
                                    title={undoStack.length > 0 ? `Hoàn tác (${undoStack.length})` : 'Không có gì để hoàn tác'}
                                >
                                    <i className="fa-solid fa-rotate-left"></i>
                                </button>

                                {/* SAVE / RECORD BUTTON */}
                                {activeTab === 'input' && (
                                    <button 
                                        onClick={handleRecordAllocation}
                                        className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black flex items-center justify-center shadow-lg shadow-emerald-500/30 transition-all active:scale-95"
                                        title="Lưu ghi nhận thu nhập"
                                    >
                                        <i className="fa-solid fa-plus text-base"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
