                                                onChange={(e) => setBgImage(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 text-slate-300 text-[10px] px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-slate-800">
                                        <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider block">
                                            <i className="fa-solid fa-cloud mr-1"></i> Tài Khoản & Đồng Bộ
                                        </label>
                                        <button
                                            onClick={() => {
                                                setIsDrawerOpen(false);
                                                setShowAccountModal(true);
                                            }}
                                            className="w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-xl font-medium text-xs flex items-center justify-center gap-1.5 border border-slate-700 shadow-md truncate"
                                        >
                                            <i className={`fa-solid ${authUser ? 'fa-user-check' : 'fa-right-to-bracket'}`}></i>
                                            <span className="truncate">{authUser ? authUser.email : 'Đăng nhập / Kết nối Supabase'}</span>
                                        </button>
                                        <p className="text-[10px] text-slate-500">{syncLabel}</p>
                                    </div>
                                    <div className="space-y-2 pt-2 border-t border-slate-800">
                                        <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider block">
                                            <i className="fa-solid fa-database mr-1"></i> Sao Lưu & Khôi Phục
                                        </label>
                                        <button 
                                            onClick={() => {
                                                setIsDrawerOpen(false);
                                                handleOpenBackupModal();
                                            }}
                                            className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-xl font-medium text-xs flex items-center justify-center gap-1.5 border border-slate-700 shadow-md"
                                        >
                                            <i className="fa-solid fa-file-export"></i> Nhập / Xuất File JSON (Backup)
                                        </button>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 text-center text-[10px] text-slate-500">
                                    JFF v7.0 • Tự lưu + Đồng bộ Supabase
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* MODAL: Fund Override */}
                    {editingFundOverride && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-lock text-amber-400"></i> Chốt Số Tiền Quỹ: {editingFundOverride.name}
                                    </h3>
                                    <button onClick={() => setEditingFundOverride(null)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-400 block mb-1">Nhập số tiền muốn chốt cố định (₫). Số âm = rút tiền khỏi quỹ</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            inputMode="text"
                                            value={overrideInputValue}
                                            onChange={(e) => setOverrideInputValue(sanitizeSignedInput(e.target.value))}
                                            className={`flex-1 min-w-0 bg-slate-900 border border-slate-700 font-extrabold text-lg px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500 ${overrideInputValue.indexOf('-') === 0 ? 'text-rose-400' : 'text-emerald-400'}`}
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setOverrideInputValue(v => (v.indexOf('-') === 0 ? v.slice(1) : (v === '0' || v === '' ? '-' : '-' + v)))}
                                            className="px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold active:scale-95"
                                            title="Đổi dấu âm/dương"
                                        >
                                            +/−
                                        </button>
                                    </div>
                                    {overrideInputValue.indexOf('-') === 0 && (
                                        <p className="text-[11px] text-rose-300 mt-1.5 leading-relaxed">
                                            <i className="fa-solid fa-circle-info mr-1"></i>Số âm nghĩa là quỹ này bị rút tiền. Tháng sau app sẽ nhắc bạn bù lại.
                                        </p>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => resetFundOverride(editingFundOverride.id, editingFundOverride.name)}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Đặt lại tự động
                                    </button>
                                    <button 
                                        onClick={applyFundOverride}
                                        className="flex-1 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30"
                                    >
                                        Chốt số tiền
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Tài khoản & Đồng bộ */}
                    {showAccountModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-cloud text-cyan-400"></i> Tài Khoản & Đồng Bộ
                                        </h3>
                                        <p className="text-xs text-slate-400">Dữ liệu tự lưu lên Supabase, không cần xuất file</p>
                                    </div>
                                    <button
                                        onClick={() => { setShowAccountModal(false); setAuthMessage(null); }}
                                        className="text-slate-400 hover:text-white text-lg p-1"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                {authMessage && (
                                    <div className={`px-3 py-2 rounded-xl text-xs font-medium border ${
                                        authMessage.type === 'success'
                                            ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
                                            : 'bg-amber-500/15 text-amber-300 border-amber-500/30'
                                    }`}>
                                        {authMessage.text}
                                    </div>
                                )}

                                {!window.supabase ? (
                                    <div className="px-3 py-2.5 rounded-xl text-xs bg-amber-500/15 text-amber-300 border border-amber-500/30">
                                        Không tải được thư viện Supabase (có thể đang offline hoặc bị chặn mạng). App vẫn chạy bình thường và lưu trên máy. Hãy tải lại trang khi có mạng.
                                    </div>
                                ) : sbKeyForbidden ? (
                                    <div className="space-y-3">
                                        <div className="px-3 py-2.5 rounded-xl text-xs bg-rose-500/15 text-rose-300 border border-rose-500/30">
                                            Khóa đang cấu hình là khóa BÍ MẬT (service_role / secret) nên app từ chối dùng. Hãy xóa và nhập anon public key hoặc publishable key.
                                        </div>
                                        <button
                                            onClick={handleResetSbConfig}
                                            className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700"
                                        >
                                            Xóa cấu hình và nhập lại
                                        </button>
                                    </div>
                                ) : !sb ? (
                                    <div className="space-y-3">
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            Lấy 2 thông tin này trong Supabase → <strong>Project Settings → API</strong>. Chỉ dùng khóa <strong>anon public</strong> (hoặc publishable). Tuyệt đối không dán khóa service_role / secret.
                                        </p>
                                        <div>
                                            <label className="text-[11px] text-slate-400 block mb-1">Project URL</label>
                                            <input
                                                type="url"
                                                value={cfgUrlInput}
                                                onChange={(e) => setCfgUrlInput(e.target.value)}
                                                placeholder="https://xxxx.supabase.co"
                                                autoCapitalize="off"
                                                autoCorrect="off"
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-slate-400 block mb-1">Anon public key</label>
                                            <input
                                                type="text"
                                                value={cfgKeyInput}
                                                onChange={(e) => setCfgKeyInput(e.target.value)}
                                                placeholder="eyJ... hoặc sb_publishable_..."
                                                autoCapitalize="off"
                                                autoCorrect="off"
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500 font-mono"
                                            />
                                        </div>
                                        <button
                                            onClick={handleSaveSbConfig}
                                            className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30"
                                        >
                                            Lưu cấu hình
                                        </button>
                                    </div>
                                ) : !authUser ? (
                                    <form onSubmit={handleAuthSubmit} className="space-y-3">
                                        <div className="flex text-xs border border-slate-700 rounded-xl overflow-hidden">
                                            <button
                                                type="button"
                                                onClick={() => { setAuthMode('login'); setAuthMessage(null); }}
                                                className={`flex-1 py-2 font-bold ${authMode === 'login' ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-slate-400'}`}
                                            >
                                                Đăng nhập
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => { setAuthMode('signup'); setAuthMessage(null); }}
                                                className={`flex-1 py-2 font-bold ${authMode === 'signup' ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-slate-400'}`}
                                            >
                                                Tạo tài khoản
                                            </button>
                                        </div>
                                                                                <div>
                                            <label className="text-[11px] text-slate-400 block mb-1">Email</label>
                                            <input
                                                type="email"
                                                value={authEmail}
                                                onChange={(e) => setAuthEmail(e.target.value)}
                                                autoComplete="email"
                                                placeholder="ban@email.com"
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-slate-400 block mb-1">Mật khẩu</label>
                                            <input
                                                type="password"
                                                value={authPassword}
                                                onChange={(e) => setAuthPassword(e.target.value)}
                                                autoComplete={authMode === 'login' ? 'current-password' : 'new-password'}
                                                placeholder="Tối thiểu 6 ký tự"
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            disabled={authBusy}
                                            className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 disabled:opacity-50 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2"
                                        >
                                            {authBusy && <i className="fa-solid fa-spinner fa-spin"></i>}
                                            {authMode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản'}
                                        </button>
                                        <p className="text-[10px] text-slate-500 text-center">
                                            Tài khoản JFF tách riêng hoàn toàn với web portfolio. Chưa đăng nhập vẫn dùng bình thường, dữ liệu lưu trên máy này.
                                        </p>
                                        <button
                                            type="button"
                                            onClick={handleResetSbConfig}
                                            className="w-full text-[10px] text-slate-500 hover:text-slate-300 underline"
                                        >
                                            Đổi cấu hình Supabase
                                        </button>
                                    </form>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-3 space-y-1">
                                            <p className="text-[10px] text-slate-400 uppercase font-semibold">Đang đăng nhập</p>
                                            <p className="text-sm font-bold text-white truncate">{authUser.email}</p>
                                            <p className={`text-xs font-semibold flex items-center gap-1.5 ${
                                                syncStatus === 'saved' ? 'text-emerald-400'
                                                : syncStatus === 'error' || syncStatus === 'conflict' ? 'text-amber-400'
                                                : 'text-cyan-300'
                                            }`}>
                                                <i className={`fa-solid ${cloudIconClass.split(' ').filter(c => c.indexOf('text-') !== 0).join(' ')}`}></i>
                                                {syncLabel}
                                            </p>
                                            {syncError && <p className="text-[11px] text-amber-300 leading-relaxed">{syncError}</p>}
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                onClick={() => { if (pushRef.current) pushRef.current('manual'); }}
                                                disabled={authBusy || !cloudReady}
                                                className="py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-cyan-300 text-xs font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                            >
                                                <i className="fa-solid fa-cloud-arrow-up"></i> Lưu ngay
                                            </button>
                                            <button
                                                onClick={handlePullNow}
                                                disabled={authBusy}
                                                className="py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-emerald-300 text-xs font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                            >
                                                <i className="fa-solid fa-cloud-arrow-down"></i> Tải bản mới nhất
                                            </button>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={toggleAutoSync}
                                            role="checkbox"
                                            aria-checked={autoSync}
                                            className="w-full flex items-start gap-2.5 text-left bg-slate-900/80 border border-slate-800 rounded-xl p-3"
                                        >
                                            <span className={`mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 ${autoSync ? 'bg-cyan-500 border-cyan-400 text-slate-950' : 'border-slate-600 text-transparent'}`}>
                                                <i className="fa-solid fa-check text-[10px]"></i>
                                            </span>
                                            <span className="min-w-0">
                                                <span className="block text-xs font-bold text-slate-100">Tự động lưu lên đám mây</span>
                                                <span className="block text-[10px] text-slate-400 leading-relaxed">
                                                    {autoSync ? 'Mỗi khi có thay đổi, app tự lưu sau khoảng 1,5 giây.' : 'Đang tắt: chỉ lưu khi bạn bấm "Lưu ngay".'}
                                                </span>
                                            </span>
                                        </button>

                                        <div className="space-y-1.5">
                                            <div className="flex items-center justify-between">
                                                <p className="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Các bản đã tải lên</p>
                                                <span className="text-[10px] text-slate-500">tối đa {MAX_CLOUD_VERSIONS} bản</span>
                                            </div>
                                            {versionsLoading && versions.length === 0 && (
                                                <p className="text-[11px] text-slate-500 py-2 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i>Đang tải danh sách...</p>
                                            )}
                                            {versionsError && <p className="text-[11px] text-amber-300 leading-relaxed">{versionsError}</p>}
                                            {!versionsLoading && !versionsError && versions.length === 0 && (
                                                <p className="text-[11px] text-slate-500 py-2 text-center bg-slate-900/60 rounded-xl border border-slate-800">Chưa có bản nào. Bấm "Lưu ngay" để tạo bản đầu tiên.</p>
                                            )}
                                            {versions.map((v, i) => {
                                                const sm = v.summary || {};
                                                return (
                                                    <div key={v.id} className="flex items-center justify-between gap-2 bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2">
                                                        <div className="min-w-0">
                                                            <p className="text-xs font-bold text-slate-100 truncate">
                                                                {new Date(v.created_at).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                                                {i === 0 && <span className="ml-1.5 text-[9px] font-bold text-emerald-300 bg-emerald-500/15 border border-emerald-500/30 rounded px-1 py-0.5">Mới nhất</span>}
                                                            </p>
                                                            <p className="text-[10px] text-slate-500 truncate">
                                                                {v.kind === 'manual' ? 'Lưu thủ công' : 'Tự động lưu'} · {sm.workspaces || 0} workspace · {sm.records || 0} lần ghi nhận
                                                            </p>
                                                        </div>
                                                        <button
                                                            onClick={() => handleRestoreVersion(v)}
                                                            disabled={authBusy}
                                                            className="shrink-0 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-emerald-300 text-[11px] font-bold rounded-lg border border-slate-700"
                                                        >
                                                            Khôi phục
                                                        </button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <button
                                            onClick={handleSignOut}
                                            disabled={authBusy}
                                            className="w-full py-2.5 bg-rose-500/15 hover:bg-rose-500/25 disabled:opacity-40 text-rose-300 text-xs font-bold rounded-xl border border-rose-500/30 flex items-center justify-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-right-from-bracket"></i> Đăng xuất
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: Xung đột dữ liệu máy / đám mây */}
                    {conflictRow && (
                        <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-amber-500/40 space-y-4 animate-scaleUp max-h-[90vh] overflow-y-auto">
                                <div>
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-code-compare text-amber-400"></i> Dữ liệu 2 nơi đang khác nhau
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-1">Chọn bản muốn giữ. Bản còn lại sẽ bị ghi đè.</p>
                                </div>

                                {(() => {
                                    const cloudSum = summarizeWorkspaces(conflictRow.data && conflictRow.data.workspaces);
                                    const localSum = summarizeWorkspaces(workspaces);
                                    return (
                                        <div className="grid grid-cols-2 gap-2 text-[11px]">
                                            <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 space-y-0.5">
                                                <p className="font-bold text-emerald-300"><i className="fa-solid fa-cloud mr-1"></i> Đám mây</p>
                                                <p className="text-slate-300">{cloudSum.workspaces} workspace</p>
                                                <p className="text-slate-300">{cloudSum.records} lần ghi nhận</p>
                                                <p className="text-slate-500">Mới nhất: {cloudSum.last || '—'}</p>
                                            </div>
                                            <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 space-y-0.5">
                                                <p className="font-bold text-cyan-300"><i className="fa-solid fa-mobile-screen mr-1"></i> Máy này</p>
                                                <p className="text-slate-300">{localSum.workspaces} workspace</p>
                                                <p className="text-slate-300">{localSum.records} lần ghi nhận</p>
                                                <p className="text-slate-500">Mới nhất: {localSum.last || '—'}</p>
                                            </div>
                                        </div>
                                    );
                                })()}

                                <div className="space-y-2">
                                    <button
                                        onClick={resolveConflictUseCloud}
                                        className="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30"
                                    >
                                        Dùng dữ liệu đám mây
                                    </button>
                                    <button
                                        onClick={resolveConflictUseLocal}
                                        className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30"
                                    >
                                        Dùng dữ liệu máy này (ghi đè đám mây)
                                    </button>
                                    <button
                                        onClick={handleConflictSignOut}
                                        className="w-full py-2 text-[11px] text-slate-400 hover:text-slate-200 underline"
                                    >
                                        Chưa quyết định, đăng xuất
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* MODAL: Create New Workspace */}
                    {showNewWsModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-folder-plus text-cyan-400"></i> Tạo Workspace Mới
                                    </h3>
                                    <button onClick={() => setShowNewWsModal(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-400 block mb-1">Tên Workspace (Ví dụ: Kinh Doanh, Gia Đình...)</label>
                                    <input 
                                        type="text"
                                        value={newWsNameInput}
                                        onChange={(e) => setNewWsNameInput(e.target.value)}
                                        placeholder="Nhập tên..."
                                        className="w-full bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setShowNewWsModal(false)}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Hủy
                                    </button>
                                    <button 
                                        onClick={handleCreateWorkspace}
                                        className="flex-1 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30"
                                    >
                                        Tạo Workspace
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Data Backup & Restore */}
                    {showBackupModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-md rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-file-code text-cyan-400"></i> Quản Lý Dữ Liệu JSON
                                        </h3>
                                        <p className="text-xs text-slate-400">Tải xuống file sao lưu hoặc chọn file JSON từ thiết bị để khôi phục</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowBackupModal(false)}
                                        className="text-slate-400 hover:text-white text-lg p-1"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-2.5">
                                    <button 
                                        onClick={handleDownloadJsonFile}
                                        className="py-3 px-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2 transition-all active:scale-95"
                                    >
                                        <i className="fa-solid fa-download text-sm"></i>
                                        <span>Tải Xuống JSON</span>
                                    </button>

                                    <label className="py-3 px-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95 text-center">
                                        <i className="fa-solid fa-file-arrow-up text-sm"></i>
                                        <span>Nhập JSON từ File</span>
                                        <input 
                                            type="file"
                                            accept=".json,application/json"
                                            onChange={handleJsonFileUpload}
                                            className="hidden"
                                        />
                                    </label>
                                </div>

                                <div className="relative my-2">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-800"></div></div>
                                    <div className="relative flex justify-center text-[10px] uppercase"><span className="bg-slate-900 px-2 text-slate-500 font-semibold">Hoặc tùy chỉnh dạng văn bản</span></div>
                                </div>

                                <div>
                                    <textarea 
                                        rows="6"
                                        value={jsonBackupText}
                                        onChange={(e) => setJsonBackupText(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 text-slate-300 text-xs p-3 rounded-xl focus:outline-none focus:border-cyan-500 font-mono"
                                        placeholder="Dán chuỗi dữ liệu JSON vào đây..."
                                    />
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            if (copyToClipboard(jsonBackupText)) {
                                                showToast('Đã sao chép chuỗi JSON!', 'success');
                                            }
                                        }}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-regular fa-copy"></i> Sao Chép
                                    </button>
                                    <button 
                                        onClick={handleImportDataFromText}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-check"></i> Áp Dụng Chuỗi Text
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Full-screen Image Adjuster & Cropper Modal */}
                    {imageToAdjust && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col justify-between p-4 animate-fadeIn">
                            <div className="flex justify-between items-center pt-2">
                                <div>
                                    <h3 className="text-sm font-bold text-white">Căn Chỉnh Hình Nền</h3>
                                    <p className="text-[10px] text-slate-400">Kéo để di chuyển, dùng thanh trượt để phóng to/thu nhỏ</p>
                                </div>
                                <button 
                                    onClick={() => setImageToAdjust(null)} 
                                    className="text-slate-400 hover:text-white p-2"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                            </div>

                            <div 
                                ref={cropContainerRef}
                                className="relative w-full max-w-xs mx-auto h-[420px] bg-slate-900 rounded-2xl border-2 border-dashed border-cyan-500/50 overflow-hidden cursor-move touch-none flex items-center justify-center my-auto shadow-2xl"
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                onTouchStart={handleTouchStart}
                                onTouchMove={handleTouchMove}
                                onTouchEnd={handleTouchEnd}
                            >
                                <div 
                                    className="absolute inset-0 flex items-center justify-center pointer-events-none"
                                    style={{
                                        transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`,
                                        transition: isDragging ? 'none' : 'transform 0.05s ease-out'
                                    }}
                                >
                                    <img 
                                        src={imageToAdjust} 
                                        alt="Adjust preview" 
                                        className="max-w-none max-h-none object-contain select-none pointer-events-none"
                                        style={{ width: '100%', height: '100%' }}
                                    />
                                </div>

                                <div className="absolute inset-0 border-[3px] border-cyan-400/30 pointer-events-none rounded-2xl"></div>
                            </div>

                            <div className="space-y-4 max-w-xs mx-auto w-full pb-4">
                                <div className="flex items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                                    <i className="fa-solid fa-magnifying-glass-minus text-slate-400 text-xs"></i>
                                    <input 
                                        type="range" 
                                        min="0.5" 
                                        max="3" 
                                        step="0.05"
                                        value={zoom}
                                        onChange={(e) => setZoom(parseFloat(e.target.value))}
                                        className="w-full accent-cyan-500"
                                    />
                                    <i className="fa-solid fa-magnifying-glass-plus text-slate-400 text-xs"></i>
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setImageToAdjust(null)}
                                        className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Hủy bỏ
                                    </button>
                                    <button 
                                        onClick={applyCroppedImage}
                                        className="flex-1 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-check"></i> Áp dụng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <div className="fixed bottom-3 left-0 right-0 max-w-md mx-auto px-4 z-40">
                        <div className="glass-panel rounded-2xl p-2 flex items-center justify-between border border-slate-700/80 shadow-2xl backdrop-blur-md">
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => setActiveTab('input')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'input' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-calculator"></i> Nhập Liệu
                                </button>
                                
                                <button 
                                    onClick={() => setActiveTab('config')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'config' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-sliders"></i> Cấu Hình
                                </button>

                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'history' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-clock-rotate-left"></i> Lịch Sử
                                </button>
                            </div>

                            <div className="flex items-center gap-1 border-l border-slate-800 pl-2">
                                <button 
                                    onClick={handleUndo}
                                    disabled={undoStack.length === 0}
                                    className={`p-2.5 rounded-xl text-xs font-medium flex items-center justify-center transition-all relative ${
                                        undoStack.length > 0 
                                            ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30' 
                                            : 'bg-slate-800/40 text-slate-600 border border-slate-800 opacity-40 cursor-not-allowed'
                                    }`}
                                    title={undoStack.length > 0 ? `Hoàn tác (${undoStack.length}/${MAX_UNDO_STEPS})` : 'Không có gì để hoàn tác'}
                                >
                                    <i className="fa-solid fa-rotate-left"></i>
                                    {undoStack.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-amber-500 text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                                            {undoStack.length}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleRedo}
                                    disabled={redoStack.length === 0}
                                    className={`p-2.5 rounded-xl text-xs font-medium flex items-center justify-center transition-all relative ${
                                        redoStack.length > 0 
                                            ? 'bg-blue-500/20 text-blue-300 border border-blue-500/40 hover:bg-blue-500/30' 
                                            : 'bg-slate-800/40 text-slate-600 border border-slate-800 opacity-40 cursor-not-allowed'
                                    }`}
                                    title={redoStack.length > 0 ? `Khôi phục/Làm lại (${redoStack.length}/${MAX_UNDO_STEPS})` : 'Không có thao tác nào để khôi phục'}
                                >
                                    <i className="fa-solid fa-rotate-right"></i>
                                    {redoStack.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-blue-500 text-white font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                                            {redoStack.length}
                                        </span>
                                    )}
                                </button>

                                {activeTab === 'input' && (
                                    <button 
                                        onClick={handleRecordAllocation}
                                        className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black flex items-center justify-center shadow-lg shadow-emerald-500/30 transition-all active:scale-95 ml-0.5"
                                        title="Lưu ghi nhận thu nhập vào lịch sử"
                                    >
                                        <i className="fa-solid fa-plus text-base"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
