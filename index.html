                                        <div className="flex justify-between items-center">
                                            <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider">
                                                <i className="fa-solid fa-layer-group mr-1"></i> Workspace
                                            </label>
                                            <button 
                                                onClick={() => setShowNewWsModal(true)}
                                                className="text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-300 px-2 py-0.5 rounded border border-slate-700 font-semibold"
                                            >
                                                + Tạo mới
                                            </button>
                                        </div>

                                        <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                            {workspaces.map(ws => (
                                                <div 
                                                    key={ws.id}
                                                    onClick={() => {
                                                        setActiveWsId(ws.id);
                                                        showToast(`Đã chuyển sang: ${ws.name}`);
                                                    }}
                                                    className={`p-2.5 rounded-xl text-xs flex items-center justify-between cursor-pointer border transition-all ${
                                                        ws.id === activeWsId 
                                                            ? 'bg-cyan-950/80 border-cyan-500/50 text-cyan-300 font-bold' 
                                                            : 'bg-slate-950/50 border-slate-800/80 text-slate-300 hover:bg-slate-800/50'
                                                    }`}
                                                >
                                                    <span className="truncate">{ws.name}</span>
                                                    {workspaces.length > 1 && (
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDeleteWorkspace(ws.id);
                                                            }}
                                                            className="text-slate-500 hover:text-rose-400 p-1"
                                                            title="Xóa Workspace"
                                                        >
                                                            <i className="fa-solid fa-trash-can text-[10px]"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-slate-800">
                                        <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider block">
                                            <i className="fa-solid fa-globe mr-1"></i> Chọn Múi Giờ (Timezone)
                                        </label>
                                        <select 
                                            value={currentTimezone}
                                            onChange={(e) => setTimezone(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs px-2.5 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                        >
                                            {TIMEZONE_OPTIONS.map(opt => (
                                                <option key={opt.zone} value={opt.zone}>
                                                    {opt.label}
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-slate-800">
                                        <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider block">
                                            <i className="fa-solid fa-image mr-1"></i> Đổi Hình Nền (Background)
                                        </label>
                                        
                                        <label className="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-cyan-600/30 transition-all active:scale-95">
                                            <i className="fa-solid fa-images text-sm"></i>
                                            <span>Chọn Ảnh Từ Gallery / Máy</span>
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                onChange={handleFileSelect}
                                                className="hidden" 
                                            />
                                        </label>

                                        <div className="grid grid-cols-2 gap-1.5 pt-1">
                                            {BG_PRESETS.map((bg, idx) => (
                                                <button 
                                                    key={idx}
                                                    onClick={() => setBgImage(bg.url)}
                                                    className={`px-2 py-1.5 rounded-lg text-[10px] font-semibold border text-left truncate transition-all ${
                                                        currentBgImage === bg.url 
                                                            ? 'bg-cyan-600 text-white border-cyan-400' 
                                                            : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                                                    }`}
                                                >
                                                    {bg.name}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="pt-1">
                                            <input 
                                                type="text"
                                                placeholder="Hoặc dán URL ảnh tùy chỉnh..."
                                                value={currentBgImage}
                                                onChange={(e) => setBgImage(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 text-slate-300 text-[10px] px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-2 pt-2 border-t border-slate-800">
                                        <label className="text-[11px] font-extrabold text-cyan-400 uppercase tracking-wider block">
                                            <i className="fa-solid fa-database mr-1"></i> Sao Lưu & Khôi Phục
                                        </label>
                                        <button 
                                            onClick={() => {
                                                setIsDrawerOpen(false);
                                                handleOpenBackupModal();
                                            }}
                                            className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-xl font-medium text-xs flex items-center justify-center gap-1.5 border border-slate-700 shadow-md"
                                        >
                                            <i className="fa-solid fa-file-export"></i> Nhập / Xuất File JSON (Backup)
                                        </button>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-slate-800 text-center text-[10px] text-slate-500">
                                    JFF v6.2 • Auto Save Enabled
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* MODAL: Fund Override */}
                    {editingFundOverride && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-lock text-amber-400"></i> Chốt Số Tiền Quỹ: {editingFundOverride.name}
                                    </h3>
                                    <button onClick={() => setEditingFundOverride(null)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-400 block mb-1">Nhập số tiền muốn chốt cố định (₫)</label>
                                    <input 
                                        type="text"
                                        value={overrideInputValue}
                                        onChange={(e) => setOverrideInputValue(formatVNDPlain(parseVNDInput(e.target.value)))}
                                        className="w-full bg-slate-900 border border-slate-700 text-emerald-400 font-extrabold text-lg px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => resetFundOverride(editingFundOverride.id, editingFundOverride.name)}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Đặt lại tự động
                                    </button>
                                    <button 
                                        onClick={applyFundOverride}
                                        className="flex-1 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30"
                                    >
                                        Chốt số tiền
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Create New Workspace */}
                    {showNewWsModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-sm rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-folder-plus text-cyan-400"></i> Tạo Workspace Mới
                                    </h3>
                                    <button onClick={() => setShowNewWsModal(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div>
                                    <label className="text-[11px] text-slate-400 block mb-1">Tên Workspace (Ví dụ: Kinh Doanh, Gia Đình...)</label>
                                    <input 
                                        type="text"
                                        value={newWsNameInput}
                                        onChange={(e) => setNewWsNameInput(e.target.value)}
                                        placeholder="Nhập tên..."
                                        className="w-full bg-slate-900 border border-slate-700 text-white text-sm px-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setShowNewWsModal(false)}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Hủy
                                    </button>
                                    <button 
                                        onClick={handleCreateWorkspace}
                                        className="flex-1 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30"
                                    >
                                        Tạo Workspace
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Data Backup & Restore */}
                    {showBackupModal && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel w-full max-w-md rounded-2xl p-5 border border-cyan-500/30 space-y-4 animate-scaleUp">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-file-code text-cyan-400"></i> Quản Lý Dữ Liệu JSON
                                        </h3>
                                        <p className="text-xs text-slate-400">Tải xuống file sao lưu hoặc chọn file JSON từ thiết bị để khôi phục</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowBackupModal(false)}
                                        className="text-slate-400 hover:text-white text-lg p-1"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-2.5">
                                    <button 
                                        onClick={handleDownloadJsonFile}
                                        className="py-3 px-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2 transition-all active:scale-95"
                                    >
                                        <i className="fa-solid fa-download text-sm"></i>
                                        <span>Tải Xuống JSON</span>
                                    </button>

                                    <label className="py-3 px-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95 text-center">
                                        <i className="fa-solid fa-file-arrow-up text-sm"></i>
                                        <span>Nhập JSON từ File</span>
                                        <input 
                                            type="file"
                                            accept=".json,application/json"
                                            onChange={handleJsonFileUpload}
                                            className="hidden"
                                        />
                                    </label>
                                </div>

                                <div className="relative my-2">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-800"></div></div>
                                    <div className="relative flex justify-center text-[10px] uppercase"><span className="bg-slate-900 px-2 text-slate-500 font-semibold">Hoặc tùy chỉnh dạng văn bản</span></div>
                                </div>

                                <div>
                                    <textarea 
                                        rows="6"
                                        value={jsonBackupText}
                                        onChange={(e) => setJsonBackupText(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 text-slate-300 text-xs p-3 rounded-xl focus:outline-none focus:border-cyan-500 font-mono"
                                        placeholder="Dán chuỗi dữ liệu JSON vào đây..."
                                    />
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            if (copyToClipboard(jsonBackupText)) {
                                                showToast('Đã sao chép chuỗi JSON!', 'success');
                                            }
                                        }}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-regular fa-copy"></i> Sao Chép
                                    </button>
                                    <button 
                                        onClick={handleImportDataFromText}
                                        className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-check"></i> Áp Dụng Chuỗi Text
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Full-screen Image Adjuster & Cropper Modal */}
                    {imageToAdjust && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex flex-col justify-between p-4 animate-fadeIn">
                            <div className="flex justify-between items-center pt-2">
                                <div>
                                    <h3 className="text-sm font-bold text-white">Căn Chỉnh Hình Nền</h3>
                                    <p className="text-[10px] text-slate-400">Kéo để di chuyển, dùng thanh trượt để phóng to/thu nhỏ</p>
                                </div>
                                <button 
                                    onClick={() => setImageToAdjust(null)} 
                                    className="text-slate-400 hover:text-white p-2"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                            </div>

                            <div 
                                ref={cropContainerRef}
                                className="relative w-full max-w-xs mx-auto h-[420px] bg-slate-900 rounded-2xl border-2 border-dashed border-cyan-500/50 overflow-hidden cursor-move touch-none flex items-center justify-center my-auto shadow-2xl"
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUp}
                                onMouseLeave={handleMouseUp}
                                onTouchStart={handleTouchStart}
                                onTouchMove={handleTouchMove}
                                onTouchEnd={handleTouchEnd}
                            >
                                <div 
                                    className="absolute inset-0 flex items-center justify-center pointer-events-none"
                                    style={{
                                        transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`,
                                        transition: isDragging ? 'none' : 'transform 0.05s ease-out'
                                    }}
                                >
                                    <img 
                                        src={imageToAdjust} 
                                        alt="Adjust preview" 
                                        className="max-w-none max-h-none object-contain select-none pointer-events-none"
                                        style={{ width: '100%', height: '100%' }}
                                    />
                                </div>

                                <div className="absolute inset-0 border-[3px] border-cyan-400/30 pointer-events-none rounded-2xl"></div>
                            </div>

                            <div className="space-y-4 max-w-xs mx-auto w-full pb-4">
                                <div className="flex items-center gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                                    <i className="fa-solid fa-magnifying-glass-minus text-slate-400 text-xs"></i>
                                    <input 
                                        type="range" 
                                        min="0.5" 
                                        max="3" 
                                        step="0.05"
                                        value={zoom}
                                        onChange={(e) => setZoom(parseFloat(e.target.value))}
                                        className="w-full accent-cyan-500"
                                    />
                                    <i className="fa-solid fa-magnifying-glass-plus text-slate-400 text-xs"></i>
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setImageToAdjust(null)}
                                        className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700"
                                    >
                                        Hủy bỏ
                                    </button>
                                    <button 
                                        onClick={applyCroppedImage}
                                        className="flex-1 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-check"></i> Áp dụng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <div className="fixed bottom-3 left-0 right-0 max-w-md mx-auto px-4 z-40">
                        <div className="glass-panel rounded-2xl p-2 flex items-center justify-between border border-slate-700/80 shadow-2xl backdrop-blur-md">
                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => setActiveTab('input')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'input' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-calculator"></i> Nhập Liệu
                                </button>
                                
                                <button 
                                    onClick={() => setActiveTab('config')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'config' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-sliders"></i> Cấu Hình
                                </button>

                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        activeTab === 'history' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-600/40' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-clock-rotate-left"></i> Lịch Sử
                                </button>
                            </div>

                            <div className="flex items-center gap-1 border-l border-slate-800 pl-2">
                                <button 
                                    onClick={handleUndo}
                                    disabled={undoStack.length === 0}
                                    className={`p-2.5 rounded-xl text-xs font-medium flex items-center justify-center transition-all relative ${
                                        undoStack.length > 0 
                                            ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30' 
                                            : 'bg-slate-800/40 text-slate-600 border border-slate-800 opacity-40 cursor-not-allowed'
                                    }`}
                                    title={undoStack.length > 0 ? `Hoàn tác (${undoStack.length}/10)` : 'Không có gì để hoàn tác'}
                                >
                                    <i className="fa-solid fa-rotate-left"></i>
                                    {undoStack.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-amber-500 text-black font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                                            {undoStack.length}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={handleRedo}
                                    disabled={redoStack.length === 0}
                                    className={`p-2.5 rounded-xl text-xs font-medium flex items-center justify-center transition-all relative ${
                                        redoStack.length > 0 
                                            ? 'bg-blue-500/20 text-blue-300 border border-blue-500/40 hover:bg-blue-500/30' 
                                            : 'bg-slate-800/40 text-slate-600 border border-slate-800 opacity-40 cursor-not-allowed'
                                    }`}
                                    title={redoStack.length > 0 ? `Khôi phục/Làm lại (${redoStack.length}/10)` : 'Không có thao tác nào để khôi phục'}
                                >
                                    <i className="fa-solid fa-rotate-right"></i>
                                    {redoStack.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-blue-500 text-white font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                                            {redoStack.length}
                                        </span>
                                    )}
                                </button>

                                {activeTab === 'input' && (
                                    <button 
                                        onClick={handleRecordAllocation}
                                        className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black flex items-center justify-center shadow-lg shadow-emerald-500/30 transition-all active:scale-95 ml-0.5"
                                        title="Lưu ghi nhận thu nhập vào lịch sử"
                                    >
                                        <i className="fa-solid fa-plus text-base"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
