<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF - Jiro Financial Freedom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; transition: all 0.3s ease; margin: 0; padding: 0; }
        
        /* Chế độ điện thoại: Khung tỷ lệ dọc (gần 18:9) */
        .phone-view { 
            max-width: 400px; 
            margin: 20px auto; 
            border: 12px solid #1e293b; 
            border-radius: 40px; 
            height: 850px; 
            position: relative; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden; /* Quan trọng để hình nền bị cắt theo viền bo tròn */
        }
        
        /* Khu vực cuộn nội dung bên trong điện thoại */
        .phone-scroll-area {
            height: 100%;
            overflow-y: auto;
        }
        .phone-scroll-area::-webkit-scrollbar { width: 0px; }
        
        [data-lucide] { width: 1.25rem; height: 1.25rem; }
        .settings-overlay { backdrop-filter: blur(4px); }
        
        /* CSS cho hình nền ứng dụng tự động Crop (Cover) theo tỷ lệ màn hình */
        .app-bg-wrapper {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Nếu ở PC thì cố định ảnh khi cuộn */
            background-attachment: fixed; 
        }
        .phone-view .app-bg-wrapper {
            /* Nếu ở Phone thì ảnh trượt theo khung phone */
            background-attachment: local; 
        }

        .bg-overlay {
            /* Lớp phủ màu trắng đục 85% để vẫn thấy ảnh nhưng không làm khó đọc chữ */
            background-color: rgba(248, 250, 252, 0.85); 
            backdrop-filter: blur(4px);
            min-height: 100%;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const FUNDS = [
            { id: 'FFA', name: 'Quỹ tự do tài chính' },
            { id: 'LTSS', name: 'Quỹ tiết kiệm' },
            { id: 'EDU', name: 'Quỹ giáo dục' },
            { id: 'NEC', name: 'Quỹ nhu cầu thiết yếu' },
            { id: 'PLAY', name: 'Quỹ hưởng thụ' },
            { id: 'GIVE', name: 'Quỹ cho đi' },
        ];

        function App() {
            // State giao diện
            const [viewMode, setViewMode] = useState('desktop'); 
            const [showSettings, setShowSettings] = useState(false);
            const [activeTab, setActiveTab] = useState('daily'); // 'daily' (Nhập liệu) | 'history' (Lịch sử)
            const [historySubTab, setHistorySubTab] = useState('day'); // 'day' (Theo ngày) | 'month' (Theo tháng)
            const [expandedDate, setExpandedDate] = useState(null);
            
            // State hệ thống
            const [gmtOffset, setGmtOffset] = useState(() => Number(localStorage.getItem('jars_gmt')) || 7);
            const [currentTime, setCurrentTime] = useState('');
            const [bgImage, setBgImage] = useState(() => localStorage.getItem('jff_bg') || null);
            
            const fileInputRef = useRef(null);
            const bgInputRef = useRef(null);

            // Dữ liệu tài chính
            const [fundData, setFundData] = useState(() => {
                const saved = localStorage.getItem('jars_finance_data');
                return saved ? JSON.parse(saved) : {};
            });

            // Lấy ngày theo GMT đã chọn
            const getFormattedDate = (offsetDays = 0) => {
                const d = new Date();
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const targetTime = new Date(utc + (3600000 * gmtOffset));
                targetTime.setDate(targetTime.getDate() + offsetDays);
                return targetTime.toISOString().split('T')[0];
            };

            const [todayStr, setTodayStr] = useState(getFormattedDate(0));
            const [yesterdayStr, setYesterdayStr] = useState(getFormattedDate(-1));

            useEffect(() => {
                localStorage.setItem('jars_finance_data', JSON.stringify(fundData));
                localStorage.setItem('jars_gmt', gmtOffset);
            }, [fundData, gmtOffset]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                const timer = setInterval(() => {
                    const d = new Date();
                    const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                    const target = new Date(utc + (3600000 * gmtOffset));
                    setCurrentTime(target.toLocaleTimeString('vi-VN', { hour12: false }));
                    setTodayStr(getFormattedDate(0));
                    setYesterdayStr(getFormattedDate(-1));
                }, 1000);
                return () => clearInterval(timer);
            }, [gmtOffset, activeTab]);

            // --- XỬ LÝ DỮ LIỆU LỊCH SỬ THEO THÁNG ---
            const monthlyData = useMemo(() => {
                const grouped = {};
                Object.keys(fundData).forEach(date => {
                    // Cắt lấy YYYY-MM (VD: từ 2023-10-25 -> 2023-10)
                    const monthKey = date.substring(0, 7); 
                    
                    if (!grouped[monthKey]) {
                        grouped[monthKey] = { total: 0, funds: {} };
                        FUNDS.forEach(f => grouped[monthKey].funds[f.id] = 0);
                    }
                    
                    FUNDS.forEach(f => {
                        const amount = fundData[date][f.id]?.amount || 0;
                        grouped[monthKey].funds[f.id] += amount;
                        grouped[monthKey].total += amount;
                    });
                });
                return grouped;
            }, [fundData]);


            // --- XỬ LÝ BACKGROUND & BACKUP ---
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Str = event.target.result;
                    setBgImage(base64Str);
                    localStorage.setItem('jff_bg', base64Str);
                };
                reader.readAsDataURL(file);
            };

            const removeBg = () => {
                setBgImage(null);
                localStorage.removeItem('jff_bg');
            };

            const exportData = () => {
                const dataStr = JSON.stringify(fundData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `backup_jff_gmt${gmtOffset}_${todayStr}.json`;
                link.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setFundData(json);
                        alert("Khôi phục dữ liệu thành công!");
                    } catch (err) {
                        alert("File không hợp lệ!");
                    }
                };
                reader.readAsText(file);
            };

            const handleAmountChange = (date, fundId, rawValue) => {
                const numericValue = rawValue.replace(/\./g, '');
                if (numericValue === '' || /^\d+$/.test(numericValue)) {
                    const value = numericValue === '' ? 0 : parseInt(numericValue, 10);
                    setFundData(prev => ({
                        ...prev,
                        [date]: { ...prev[date], [fundId]: { ...prev[date]?.[fundId], amount: value } }
                    }));
                }
            };

            const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
            const formatInput = (val) => val ? val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
            
            // Format tháng hiển thị (VD: 2023-10 -> Tháng 10, 2023)
            const formatMonthDisplay = (monthStr) => {
                const [year, month] = monthStr.split('-');
                return `Tháng ${month}, ${year}`;
            };

            return (
                <div className="min-h-screen bg-slate-100 transition-all">
                    
                    {/* Thanh trượt: ẨN TRÊN ĐIỆN THOẠI, chỉ hiện trên máy tính */}
                    <div className="hidden md:flex fixed bottom-6 right-6 z-50 items-center bg-white p-2 rounded-2xl shadow-2xl border border-slate-200">
                        <span className="text-[10px] font-bold mr-2 text-slate-400">GIAO DIỆN PC</span>
                        <div 
                            onClick={() => setViewMode(viewMode === 'desktop' ? 'mobile' : 'desktop')}
                            className="w-12 h-6 bg-slate-200 rounded-full relative cursor-pointer p-1"
                        >
                            <div className={`w-4 h-4 bg-blue-600 rounded-full transition-all ${viewMode === 'mobile' ? 'translate-x-6' : 'translate-x-0'}`}></div>
                        </div>
                    </div>

                    {/* Vùng chứa ứng dụng - Xử lý Background Cover tại đây */}
                    <div className={viewMode === 'mobile' ? 'phone-view bg-slate-50' : 'w-full min-h-screen bg-slate-50'}>
                        
                        <div className={`app-bg-wrapper ${viewMode === 'mobile' ? 'phone-scroll-area' : 'w-full min-h-screen'}`}
                             style={bgImage ? { backgroundImage: `url(${bgImage})` } : {}}
                        >
                            {/* Lớp phủ màu để nền trong suốt */}
                            <div className={`pb-20 relative ${bgImage ? 'bg-overlay' : 'bg-slate-50'}`}>
                                
                                {/* Header */}
                                <header className={`${bgImage ? 'bg-white/90 backdrop-blur-md' : 'bg-white'} border-b sticky top-0 z-20 p-4 flex justify-between items-center shadow-sm`}>
                                    <div className="flex items-center space-x-2">
                                        <div className="bg-blue-600 p-1.5 rounded-lg text-white">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                                        </div>
                                        <h1 className="font-black text-slate-800 text-sm tracking-tighter uppercase">JFF</h1>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <div className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md border border-blue-100 shadow-inner">
                                            GMT{gmtOffset > 0 ? `+${gmtOffset}` : gmtOffset} | {currentTime}
                                        </div>
                                        <button onClick={() => setShowSettings(true)} className="text-slate-500 hover:text-blue-600 transition-colors p-1.5 bg-slate-100 rounded-full">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                    </div>
                                </header>

                                {/* Main Content */}
                                <main className="p-4 max-w-4xl mx-auto relative z-10">
                                    <div className="flex bg-slate-200/60 backdrop-blur-sm p-1 rounded-xl mb-6 w-fit shadow-inner">
                                        <button onClick={() => {setActiveTab('daily'); setExpandedDate(null);}} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'daily' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-800'}`}>NHẬP LIỆU</button>
                                        <button onClick={() => {setActiveTab('history'); setExpandedDate(null);}} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'history' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-800'}`}>LỊCH SỬ</button>
                                    </div>

                                    {activeTab === 'daily' ? (
                                        // TAB NHẬP LIỆU HẰNG NGÀY
                                        <div className="space-y-3">
                                            {FUNDS.map(fund => (
                                                <div key={fund.id} className={`${bgImage ? 'bg-white/80 backdrop-blur-md' : 'bg-white'} p-4 rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md`}>
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="text-xs font-black text-slate-500 uppercase tracking-widest">{fund.name}</span>
                                                        <span className="text-[10px] text-slate-400 italic">Hôm qua: {formatCurrency(fundData[yesterdayStr]?.[fund.id]?.amount)}</span>
                                                    </div>
                                                    <input 
                                                        type="text" 
                                                        className="w-full text-2xl font-black text-blue-700 bg-transparent outline-none placeholder:text-slate-300"
                                                        placeholder="0"
                                                        value={formatInput(fundData[todayStr]?.[fund.id]?.amount)}
                                                        onChange={(e) => handleAmountChange(todayStr, fund.id, e.target.value)}
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        // TAB LỊCH SỬ (Chứa sub-tab Ngày/Tháng)
                                        <div className="space-y-4">
                                            
                                            {/* Sub-tabs cho Lịch sử */}
                                            <div className="flex space-x-2 border-b border-slate-300/50 pb-2">
                                                <button 
                                                    onClick={() => {setHistorySubTab('day'); setExpandedDate(null);}}
                                                    className={`px-3 py-1 text-xs font-bold rounded-md transition-colors ${historySubTab === 'day' ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-200/50'}`}
                                                >
                                                    Theo Ngày
                                                </button>
                                                <button 
                                                    onClick={() => {setHistorySubTab('month'); setExpandedDate(null);}}
                                                    className={`px-3 py-1 text-xs font-bold rounded-md transition-colors ${historySubTab === 'month' ? 'bg-blue-100 text-blue-700' : 'text-slate-500 hover:bg-slate-200/50'}`}
                                                >
                                                    Theo Tháng / Năm
                                                </button>
                                            </div>

                                            {/* Nội dung danh sách Lịch sử */}
                                            <div className="space-y-2">
                                                {historySubTab === 'day' ? (
                                                    // HIỂN THỊ THEO NGÀY
                                                    Object.keys(fundData).sort().reverse().map(date => {
                                                        const isExp = expandedDate === date;
                                                        const total = Object.values(fundData[date]).reduce((s, a) => s + (a.amount || 0), 0);
                                                        
                                                        // Không hiển thị ngày trống (tổng = 0) nếu muốn (hiện tại vẫn hiển thị tất cả)
                                                        if(total === 0 && date !== todayStr) return null;

                                                        return (
                                                            <div key={date} className={`${bgImage ? 'bg-white/90 backdrop-blur-md' : 'bg-white'} rounded-xl border border-slate-200 overflow-hidden shadow-sm`}>
                                                                <button onClick={() => setExpandedDate(isExp ? null : date)} className="w-full p-4 flex justify-between items-center hover:bg-slate-50/50 transition-colors">
                                                                    <span className="font-bold text-slate-700 text-sm">{date} {date === todayStr ? '(Hôm nay)' : ''}</span>
                                                                    <span className="text-emerald-600 font-black text-sm">{formatCurrency(total)}</span>
                                                                </button>
                                                                {isExp && (
                                                                    <div className="px-4 pb-4 grid grid-cols-2 gap-3 border-t pt-4 bg-slate-50/50">
                                                                        {FUNDS.map(f => (
                                                                            <div key={f.id} className="text-[10px]">
                                                                                <p className="text-slate-400 font-bold uppercase mb-0.5">{f.id}</p>
                                                                                <p className="font-black text-slate-700">{formatCurrency(fundData[date]?.[f.id]?.amount)}</p>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    })
                                                ) : (
                                                    // HIỂN THỊ THEO THÁNG NĂM
                                                    Object.keys(monthlyData).sort().reverse().map(monthKey => {
                                                        const isExp = expandedDate === monthKey;
                                                        const monthData = monthlyData[monthKey];
                                                        
                                                        if(monthData.total === 0) return null;

                                                        return (
                                                            <div key={monthKey} className={`${bgImage ? 'bg-white/90 backdrop-blur-md' : 'bg-white'} rounded-xl border-2 border-blue-100 overflow-hidden shadow-sm`}>
                                                                <button onClick={() => setExpandedDate(isExp ? null : monthKey)} className="w-full p-4 flex justify-between items-center hover:bg-blue-50/50 transition-colors">
                                                                    <div className="flex flex-col items-start">
                                                                        <span className="font-black text-blue-800 text-sm uppercase">{formatMonthDisplay(monthKey)}</span>
                                                                        <span className="text-[10px] text-slate-400 font-bold">Tổng kết tháng</span>
                                                                    </div>
                                                                    <span className="text-blue-600 font-black text-base">{formatCurrency(monthData.total)}</span>
                                                                </button>
                                                                {isExp && (
                                                                    <div className="px-4 pb-4 grid grid-cols-2 gap-4 border-t border-blue-100 pt-4 bg-blue-50/30">
                                                                        {FUNDS.map(f => (
                                                                            <div key={f.id} className="text-[11px] bg-white p-2 rounded-lg border border-slate-100 shadow-sm">
                                                                                <p className="text-slate-400 font-bold uppercase mb-1 flex items-center gap-1">
                                                                                    <span className="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block"></span>
                                                                                    {f.id}
                                                                                </p>
                                                                                <p className="font-black text-slate-700 text-xs">{formatCurrency(monthData.funds[f.id])}</p>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )
                                                    })
                                                )}
                                                
                                                {Object.keys(fundData).length === 0 && (
                                                    <div className="text-center p-8 text-slate-400 text-sm font-bold">
                                                        Chưa có dữ liệu lịch sử.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </main>
                            </div>
                        </div>
                    </div>

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 settings-overlay bg-slate-900/40">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <h2 className="font-black text-slate-800 uppercase tracking-tighter">Cài đặt hệ thống</h2>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-red-500 transition-colors bg-white p-1 rounded-full shadow-sm border border-slate-200">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                            <line x1="18" y1="6" x2="6" y2="18"></line>
                                            <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div className="p-6 space-y-6 max-h-[75vh] overflow-y-auto">
                                    
                                    {/* Đổi hình nền */}
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-3">Giao diện (Background)</label>
                                        <button onClick={() => bgInputRef.current.click()} className="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition-all shadow-md">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                            <span>CHỌN HÌNH NỀN TỪ MÁY</span>
                                        </button>
                                        <input type="file" ref={bgInputRef} onChange={handleBgUpload} className="hidden" accept="image/*" />
                                        
                                        {bgImage && (
                                            <button onClick={removeBg} className="mt-3 text-[11px] text-red-500 font-bold w-full text-center hover:bg-red-50 p-2 rounded-lg transition-colors">
                                                Xóa hình nền hiện tại
                                            </button>
                                        )}
                                    </div>

                                    {/* Múi giờ */}
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Múi giờ hệ thống (GMT)</label>
                                        <select 
                                            value={gmtOffset} 
                                            onChange={(e) => setGmtOffset(Number(e.target.value))}
                                            className="w-full p-3 bg-slate-100 rounded-xl font-bold text-slate-700 outline-none border-2 border-transparent focus:border-blue-500 cursor-pointer"
                                        >
                                            {Array.from({length: 25}, (_, i) => i - 12).map(v => (
                                                <option key={v} value={v}>GMT {v >= 0 ? `+${v}` : v}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Backup */}
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Sao lưu dữ liệu</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={exportData} className="flex items-center justify-center space-x-2 bg-blue-600 text-white p-3 rounded-xl font-bold text-xs hover:bg-blue-700 transition-all shadow-sm">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                                <span>XUẤT FILE</span>
                                            </button>
                                            <button onClick={() => fileInputRef.current.click()} className="flex items-center justify-center space-x-2 bg-slate-800 text-white p-3 rounded-xl font-bold text-xs hover:bg-black transition-all shadow-sm">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                                <span>NHẬP FILE</span>
                                            </button>
                                            <input type="file" ref={fileInputRef} onChange={importData} className="hidden" accept=".json" />
                                        </div>
                                    </div>

                                    {/* App Info */}
                                    <div className="pt-4 border-t border-slate-200">
                                        <h3 className="text-[10px] font-black text-slate-400 uppercase mb-3">Thông tin App</h3>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs text-slate-600 space-y-3">
                                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                <span className="font-bold">App name:</span> 
                                                <span className="font-black text-slate-800 text-right">Jiro financial freedom</span>
                                            </div>
                                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                                                <span className="font-bold">Author:</span> 
                                                <span className="font-black text-slate-800">Jiro</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold">Version:</span> 
                                                <span className="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md font-black">3.6</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
