<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF - Jiro Financial Freedom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- CropperJS CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Default initial 6 jars profile
        const DEFAULT_PROFILES = [
            {
                id: 'default-6-jars',
                name: 'Giao Diện 1 (6 Quỹ Mặc Định)',
                funds: [
                    { id: '1', name: 'Nhu cầu thiết yếu (NEC)', percent: 55, color: '#ef4444', desc: 'Ăn uống, thuê nhà, điện nước, chi phí sinh hoạt thiết yếu' },
                    { id: '2', name: 'Tự do tài chính (FFA)', percent: 10, color: '#3b82f6', desc: 'Đầu tư sinh lời, tạo dòng tiền thụ động, tài sản tích lũy' },
                    { id: '3', name: 'Tiết kiệm dài hạn (LTSS)', percent: 10, color: '#10b981', desc: 'Mua xe, mua nhà, mục tiêu lớn & quỹ dự phòng khẩn cấp' },
                    { id: '4', name: 'Học tập & Phát triển (EDU)', percent: 10, color: '#f59e0b', desc: 'Sách vở, khóa học, hội thảo, nâng cao giá trị bản thân' },
                    { id: '5', name: 'Hưởng thụ (PLAY)', percent: 10, color: '#ec4899', desc: 'Du lịch, mua sắm, giải trí, thưởng cho bản thân' },
                    { id: '6', name: 'Cho đi (GIVE)', percent: 5, color: '#8b5cf6', desc: 'Từ thiện, giúp đỡ người thân, quà tặng người yêu thương' }
                ]
            }
        ];

        // Theme Presets
        const COLOR_PRESETS = [
            { name: 'Xanh Lam', hex: '#3b82f6' },
            { name: 'Xanh Lục', hex: '#10b981' },
            { name: 'Tím Huyền Bí', hex: '#8b5cf6' },
            { name: 'Hồng Rạng Rỡ', hex: '#ec4899' },
            { name: 'Cam Năng Lượng', hex: '#f97316' },
            { name: 'Đỏ Đam Mê', hex: '#ef4444' },
            { name: 'Vàng Hoàng Kim', hex: '#eab308' },
            { name: 'Xanh Cổ Vịt', hex: '#06b6d4' }
        ];

        // Money format helper
        const formatVND = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return '0 ₫';
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        };

        // Date String Helper
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getTimeString = () => {
            const today = new Date();
            return today.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        };

        function App() {
            // Persistent States with localStorage
            const [profiles, setProfiles] = useState(() => {
                const saved = localStorage.getItem('jff_profiles_v2');
                return saved ? JSON.parse(saved) : DEFAULT_PROFILES;
            });

            const [activeProfileId, setActiveProfileId] = useState(() => {
                const saved = localStorage.getItem('jff_active_profile_id_v2');
                return saved || DEFAULT_PROFILES[0].id;
            });

            const [historyData, setHistoryData] = useState(() => {
                const saved = localStorage.getItem('jff_history_v2');
                return saved ? JSON.parse(saved) : [];
            });

            const [themeColor, setThemeColor] = useState(() => {
                return localStorage.getItem('jff_theme_color_v2') || '#3b82f6';
            });

            const [glassOpacity, setGlassOpacity] = useState(() => {
                return Number(localStorage.getItem('jff_glass_opacity_v2')) || 25;
            });

            const [glassBlur, setGlassBlur] = useState(() => {
                return Number(localStorage.getItem('jff_glass_blur_v2')) || 12;
            });

            const [bgImage, setBgImage] = useState(() => {
                return localStorage.getItem('jff_bg_image_v2') || '';
            });

            // Navigation & Modal States
            const [activeTab, setActiveTab] = useState('input'); // 'input', 'config', 'history', 'rules'
            const [incomeInput, setIncomeInput] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [showNewProfileModal, setShowNewProfileModal] = useState(false);
            const [showSwitchProfileModal, setShowSwitchProfileModal] = useState(false);
            const [showColorPickerModal, setShowColorPickerModal] = useState(false);
            const [tempCustomColor, setTempCustomColor] = useState('#3b82f6');
            const [newProfileName, setNewProfileName] = useState('');
            const [toast, setToast] = useState(null);

            // History Date Filter States
            const [fromDate, setFromDate] = useState('');
            const [toDate, setToDate] = useState('');

            // Image Cropper Tool States
            const [tempImage, setTempImage] = useState(null);
            const [cropAspectRatio, setCropAspectRatio] = useState(NaN); // Free form
            const imageRef = useRef(null);
            const cropperRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('jff_profiles_v2', JSON.stringify(profiles));
            }, [profiles]);

            useEffect(() => {
                localStorage.setItem('jff_active_profile_id_v2', activeProfileId);
            }, [activeProfileId]);

            useEffect(() => {
                localStorage.setItem('jff_history_v2', JSON.stringify(historyData));
            }, [historyData]);

            useEffect(() => {
                localStorage.setItem('jff_theme_color_v2', themeColor);
            }, [themeColor]);

            useEffect(() => {
                localStorage.setItem('jff_glass_opacity_v2', glassOpacity.toString());
            }, [glassOpacity]);

            useEffect(() => {
                localStorage.setItem('jff_glass_blur_v2', glassBlur.toString());
            }, [glassBlur]);

            useEffect(() => {
                localStorage.setItem('jff_bg_image_v2', bgImage);
            }, [bgImage]);

            // Toast Auto Hide
            const showToast = (message) => {
                setToast(message);
                setTimeout(() => {
                    setToast(null);
                }, 3000);
            };

            // Active Profile Computed Lookup
            const activeProfile = useMemo(() => {
                return profiles.find(p => p.id === activeProfileId) || profiles[0] || DEFAULT_PROFILES[0];
            }, [profiles, activeProfileId]);

            // Total percent of funds in active profile
            const totalPercent = useMemo(() => {
                if (!activeProfile || !activeProfile.funds) return 0;
                return activeProfile.funds.reduce((sum, f) => sum + (Number(f.percent) || 0), 0);
            }, [activeProfile]);

            // Filtered history by date range
            const filteredHistory = useMemo(() => {
                return historyData.filter(record => {
                    if (fromDate && record.date < fromDate) return false;
                    if (toDate && record.date > toDate) return false;
                    return true;
                });
            }, [historyData, fromDate, toDate]);

            // Aggregated totals for filtered history
            const historyTotals = useMemo(() => {
                let grandTotal = 0;
                const fundTotals = {};

                filteredHistory.forEach(record => {
                    grandTotal += (Number(record.totalIncome) || 0);
                    if (record.allocations && Array.isArray(record.allocations)) {
                        record.allocations.forEach(alloc => {
                            const name = alloc.fundName || 'Khác';
                            fundTotals[name] = (fundTotals[name] || 0) + (Number(alloc.amount) || 0);
                        });
                    }
                });

                return { grandTotal, fundTotals };
            }, [filteredHistory]);

            useEffect(() => {
                if (tempImage && imageRef.current) {
                    if (cropperRef.current) {
                        cropperRef.current.destroy();
                    }
                    cropperRef.current = new Cropper(imageRef.current, {
                        aspectRatio: cropAspectRatio,
                        viewMode: 1,
                        background: false,
                        autoCropArea: 0.9,
                        responsive: true,
                    });
                }
                return () => {
                    if (cropperRef.current) {
                        cropperRef.current.destroy();
                        cropperRef.current = null;
                    }
                };
            }, [tempImage, cropAspectRatio]);

            // Action Handlers
            const handleAddIncome = (amount) => {
                const current = Number(incomeInput) || 0;
                setIncomeInput((current + amount).toString());
            };

            const handleSaveAllocation = () => {
                const income = Number(incomeInput);
                if (!income || income <= 0) {
                    showToast('Vui lòng nhập số tiền thu nhập hợp lệ!');
                    return;
                }

                const allocations = activeProfile.funds.map(f => ({
                    fundName: f.name,
                    percent: f.percent,
                    amount: Math.round((income * (f.percent || 0)) / 100)
                }));

                const newRecord = {
                    id: Date.now().toString(),
                    date: getTodayString(),
                    time: getTimeString(),
                    totalIncome: income,
                    profileId: activeProfile.id,
                    profileName: activeProfile.name,
                    allocations: allocations
                };

                setHistoryData([newRecord, ...historyData]);
                setIncomeInput('');
                showToast(`Đã lưu phân bổ ${formatVND(income)} thành công!`);
            };

            const handleDeleteHistory = (id) => {
                setHistoryData(historyData.filter(h => h.id !== id));
                showToast('Đã xóa bản ghi lịch sử');
            };

            const handleCreateProfile = () => {
                if (!newProfileName.trim()) {
                    showToast('Vui lòng nhập tên giao diện!');
                    return;
                }
                const newProf = {
                    id: 'profile-' + Date.now(),
                    name: newProfileName.trim(),
                    funds: [
                        { id: Date.now().toString(), name: 'Quỹ Chi Tiêu Chính', percent: 100, color: themeColor, desc: 'Tự do tùy chỉnh các quỹ' }
                    ]
                };
                setProfiles([...profiles, newProf]);
                setActiveProfileId(newProf.id);
                setNewProfileName('');
                setShowNewProfileModal(false);
                showToast(`Đã tạo và chuyển sang: ${newProf.name}`);
            };

            const handleUpdateFund = (fundId, field, value) => {
                const updatedFunds = activeProfile.funds.map(f => {
                    if (f.id === fundId) {
                        return { ...f, [field]: value };
                    }
                    return f;
                });
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
            };

            const handleAddFundToProfile = () => {
                const newFund = {
                    id: Date.now().toString(),
                    name: `Quỹ mới ${activeProfile.funds.length + 1}`,
                    percent: 0,
                    color: COLOR_PRESETS[activeProfile.funds.length % COLOR_PRESETS.length].hex,
                    desc: 'Mô tả mục tiêu cho quỹ này'
                };
                const updatedFunds = [...activeProfile.funds, newFund];
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
                showToast('Đã thêm ô quỹ mới');
            };

            const handleDeleteFundFromProfile = (fundId) => {
                if (activeProfile.funds.length <= 1) {
                    showToast('Giao diện phải có ít nhất 1 ô quỹ!');
                    return;
                }
                const updatedFunds = activeProfile.funds.filter(f => f.id !== fundId);
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
                showToast('Đã xóa ô quỹ');
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        setTempImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleApplyCrop = () => {
                if (cropperRef.current) {
                    const croppedCanvas = cropperRef.current.getCroppedCanvas({
                        maxWidth: 1920,
                        maxHeight: 1080,
                    });
                    if (croppedCanvas) {
                        const croppedDataUrl = croppedCanvas.toDataURL('image/jpeg', 0.85);
                        setBgImage(croppedDataUrl);
                        setTempImage(null);
                        showToast('Đã áp dụng ảnh nền thành công!');
                    }
                }
            };

            const handleExportData = () => {
                const data = { profiles, historyData, themeColor, glassOpacity, glassBlur };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `JFF_Financial_Backup_${getTodayString()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Đã tải xuống tệp sao lưu dữ liệu!');
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.profiles) setProfiles(imported.profiles);
                        if (imported.historyData) setHistoryData(imported.historyData);
                        if (imported.themeColor) setThemeColor(imported.themeColor);
                        if (imported.glassOpacity) setGlassOpacity(imported.glassOpacity);
                        if (imported.glassBlur) setGlassBlur(imported.glassBlur);
                        showToast('Đã khôi phục dữ liệu thành công!');
                    } catch (err) {
                        showToast('Tệp sao lưu không đúng định dạng!');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div 
                    className="min-h-screen relative pb-28 text-slate-100"
                    style={{
                        backgroundImage: bgImage ? `url(${bgImage})` : 'none',
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundAttachment: 'fixed',
                    }}
                >
                    {/* Dynamic Glassmorphism CSS Injector */}
                    <style>{`
                        .glass-card {
                            background-color: rgba(15, 23, 42, ${glassOpacity / 100});
                            backdrop-filter: blur(${glassBlur}px);
                            -webkit-backdrop-filter: blur(${glassBlur}px);
                            border: 1px solid rgba(255, 255, 255, 0.12);
                        }
                    `}</style>

                    {/* Dark overlay for background image readability */}
                    {bgImage && <div className="fixed inset-0 bg-slate-950/50 pointer-events-none z-0" />}

                    {/* App Header */}
                    <header className="relative z-10 sticky top-0 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-4 py-3 shadow-lg">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div 
                                    className="w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl shadow-lg transition-transform hover:scale-105"
                                    style={{ backgroundColor: themeColor }}
                                >
                                    J
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-base tracking-wide text-white flex items-center gap-2">
                                        JFF <span className="text-xs px-2 py-0.5 rounded-full bg-white/10 border border-white/10 font-medium text-slate-300">Tự Do Tài Chính</span>
                                    </h1>
                                    <p className="text-[11px] text-slate-400 truncate max-w-[200px] sm:max-w-xs">{activeProfile.name}</p>
                                </div>
                            </div>

                            <button
                                onClick={() => setShowSettings(true)}
                                className="p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white transition-all active:scale-95 shadow-md"
                                title="Cài Đặt Giao Diện & Dữ Liệu"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </header>

                    {/* Navigation Tabs Bar */}
                    <main className="relative z-10 max-w-5xl mx-auto px-4 mt-4 space-y-5">
                        <div className="flex bg-slate-900/80 p-1.5 rounded-2xl border border-white/10 shadow-lg backdrop-blur-md overflow-x-auto">
                            <button
                                onClick={() => setActiveTab('input')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center space-x-1.5 ${
                                    activeTab === 'input' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'input' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>💵 Nhập Liệu</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('config')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center space-x-1.5 ${
                                    activeTab === 'config' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'config' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>⚙️ Cấu Hình Quỹ</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('history')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center space-x-1.5 ${
                                    activeTab === 'history' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'history' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>📜 Lịch Sử</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('rules')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center space-x-1.5 ${
                                    activeTab === 'rules' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'rules' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>💡 Quy Tắc</span>
                            </button>
                        </div>

                        {/* TAB 1: INPUT & ALLOCATION CALCULATOR */}
                        {activeTab === 'input' && (
                            <div className="space-y-6">
                                {/* Income Input Card */}
                                <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="font-extrabold text-base text-white flex items-center gap-2">
                                            Nhập Số Tiền Thu Nhập Mới
                                        </h2>
                                        <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/10 text-slate-300 border border-white/10">
                                            {activeProfile.name}
                                        </span>
                                    </div>

                                    <div className="relative">
                                        <input
                                            type="number"
                                            value={incomeInput}
                                            onChange={(e) => setIncomeInput(e.target.value)}
                                            placeholder="VD: 10000000 (10 triệu)..."
                                            className="w-full bg-slate-900/90 text-white font-extrabold text-lg sm:text-2xl px-4 py-3.5 rounded-2xl border border-white/15 focus:outline-none focus:border-blue-500 transition-all placeholder:text-slate-500"
                                        />
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 bg-white/5 px-2.5 py-1 rounded-lg border border-white/10">
                                            VND
                                        </div>
                                    </div>

                                    {/* Quick Increment Buttons */}
                                    <div className="flex flex-wrap gap-2 pt-1">
                                        {[100000, 500000, 1000000, 5000000, 10000000, 50000000].map(amt => (
                                            <button
                                                key={amt}
                                                onClick={() => handleAddIncome(amt)}
                                                className="py-1.5 px-3 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 text-xs font-bold text-slate-300 transition-all active:scale-95"
                                            >
                                                +{amt >= 1000000 ? `${amt / 1000000}M` : `${amt / 1000}K`}
                                            </button>
                                        ))}
                                        {incomeInput && (
                                            <button
                                                onClick={() => setIncomeInput('')}
                                                className="py-1.5 px-3 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs font-bold transition-all"
                                            >
                                                Xóa nhập
                                            </button>
                                        )}
                                    </div>

                                    <button
                                        onClick={handleSaveAllocation}
                                        className="w-full py-3.5 rounded-2xl text-white font-extrabold text-sm uppercase tracking-wider shadow-xl transition-all duration-200 hover:brightness-110 active:scale-[0.99]"
                                        style={{ backgroundColor: themeColor }}
                                    >
                                        💾 Lưu Phân Bổ Vào Lịch Sử
                                    </button>
                                </div>

                                {/* Fund Allocation Cards Grid */}
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <h3 className="font-extrabold text-sm uppercase text-slate-300 tracking-wider">
                                            Phân Bổ Thu Nhập Theo % Ô Quỹ
                                        </h3>
                                        <span className={`text-xs font-bold ${totalPercent === 100 ? 'text-emerald-400' : 'text-amber-400'}`}>
                                            Tổng: {totalPercent}%
                                        </span>
                                    </div>

                                    {/* Uncluttered 1 column mobile / 2 columns PC layout */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        {activeProfile.funds.map((fund) => {
                                            const income = Number(incomeInput) || 0;
                                            const allocatedAmount = Math.round((income * (fund.percent || 0)) / 100);

                                            return (
                                                <div 
                                                    key={fund.id} 
                                                    className="glass-card rounded-2xl p-4 transition-all hover:border-white/25 relative overflow-hidden flex flex-col justify-between"
                                                    style={{ borderLeft: `5px solid ${fund.color || themeColor}` }}
                                                >
                                                    <div className="space-y-1">
                                                        <div className="flex justify-between items-start gap-2">
                                                            <h4 className="font-extrabold text-base text-white truncate">{fund.name}</h4>
                                                            <span className="text-xs font-black px-2.5 py-1 rounded-lg bg-white/10 text-slate-200 shrink-0">
                                                                {fund.percent}%
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-slate-400 line-clamp-2">{fund.desc}</p>
                                                    </div>

                                                    <div className="pt-3 mt-3 border-t border-white/10 flex justify-between items-baseline">
                                                        <span className="text-xs text-slate-400 font-medium">Số tiền nhận:</span>
                                                        <span className="text-lg font-black text-emerald-400">
                                                            {formatVND(allocatedAmount)}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: FUND CONFIGURATION */}
                        {activeTab === 'config' && (
                            <div className="space-y-6">
                                <div className="glass-card rounded-3xl p-5 shadow-2xl space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                        <div>
                                            <h2 className="font-extrabold text-base text-white">Cấu Hình Ô Quỹ & Tỷ Lệ %</h2>
                                            <p className="text-xs text-slate-400">Tùy chỉnh tên, mô tả và số % của từng ô quỹ cho giao diện hiện tại</p>
                                        </div>
                                        <div className={`px-3 py-1 rounded-xl font-bold text-xs border ${
                                            totalPercent === 100 ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                                        }`}>
                                            Tổng tỷ lệ: {totalPercent} / 100%
                                        </div>
                                    </div>

                                    {totalPercent !== 100 && (
                                        <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-xs text-amber-300 font-medium">
                                            ⚠️ Cảnh báo: Tổng phần trăm các quỹ hiện tại là <strong>{totalPercent}%</strong>. Hãy điều chỉnh để tổng đúng <strong>100%</strong> nhé!
                                        </div>
                                    )}

                                    <div className="space-y-3 pt-2">
                                        {activeProfile.funds.map((fund, index) => (
                                            <div key={fund.id} className="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-3">
                                                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                                                    <div className="sm:col-span-6">
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tên ô quỹ #{index + 1}</label>
                                                        <input
                                                            type="text"
                                                            value={fund.name}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'name', e.target.value)}
                                                            className="w-full bg-slate-950 text-white font-bold text-xs px-3 py-2 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-3">
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tỷ lệ (%)</label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            max="100"
                                                            value={fund.percent}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'percent', Number(e.target.value))}
                                                            className="w-full bg-slate-950 text-white font-black text-xs px-3 py-2 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-3 flex items-center space-x-2 pt-4 sm:pt-0">
                                                        <input
                                                            type="color"
                                                            value={fund.color || themeColor}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'color', e.target.value)}
                                                            className="w-9 h-9 rounded-xl bg-slate-950 border border-white/10 cursor-pointer p-0.5"
                                                            title="Đổi màu viền ô quỹ"
                                                        />
                                                        <button
                                                            onClick={() => handleDeleteFundFromProfile(fund.id)}
                                                            className="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl border border-red-500/20 transition-all"
                                                            title="Xóa ô quỹ này"
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                                        </button>
                                                    </div>
                                                </div>
                                                <div>
                                                    <input
                                                        type="text"
                                                        value={fund.desc || ''}
                                                        placeholder="Mô tả ngắn gọn về quỹ này..."
                                                        onChange={(e) => handleUpdateFund(fund.id, 'desc', e.target.value)}
                                                        className="w-full bg-slate-950/60 text-slate-300 text-xs px-3 py-1.5 rounded-xl border border-white/5 focus:outline-none"
                                                    />
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <button
                                        onClick={handleAddFundToProfile}
                                        className="w-full py-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-dashed border-white/20 text-slate-200 font-bold text-xs uppercase transition-all flex items-center justify-center space-x-2"
                                    >
                                        <span>+ Thêm Ô Quỹ Mới</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: HISTORY & DATE RANGE SEARCH */}
                        {activeTab === 'history' && (
                            <div className="space-y-6">
                                {/* Search & Filter controls */}
                                <div className="glass-card rounded-3xl p-5 shadow-2xl space-y-4">
                                    <div>
                                        <h2 className="font-extrabold text-base text-white">Lịch Sử Phân Bổ Tài Chính</h2>
                                        <p className="text-xs text-slate-400">Tra cứu chi tiết và tổng hợp số tiền theo khoảng thời gian</p>
                                    </div>

                                    {/* Date Range Selection Inputs */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2 border-t border-white/10 items-end">
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-300 uppercase block mb-1">Từ ngày</label>
                                            <input
                                                type="date"
                                                value={fromDate}
                                                onChange={(e) => setFromDate(e.target.value)}
                                                className="w-full bg-slate-900/90 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-300 uppercase block mb-1">Đến ngày</label>
                                            <input
                                                type="date"
                                                value={toDate}
                                                onChange={(e) => setToDate(e.target.value)}
                                                className="w-full bg-slate-900/90 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        {(fromDate || toDate) && (
                                            <div className="flex items-center">
                                                <button 
                                                    onClick={() => { setFromDate(''); setToDate(''); }}
                                                    className="py-2.5 px-4 text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl border border-red-500/20 transition-all w-full sm:w-auto"
                                                >
                                                    ✕ Xóa bộ lọc ngày
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Aggregated Summary Box for Selected Date Range */}
                                {filteredHistory.length > 0 && (
                                    <div className="glass-card rounded-3xl p-5 shadow-xl space-y-4 border border-blue-500/20 bg-blue-950/20">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-white/10 pb-3 gap-2">
                                            <div>
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Thống kê tổng hợp trong khoảng thời gian</span>
                                                <h3 className="font-extrabold text-lg text-white">
                                                    Tổng Thu Nhập Tất Cả Các Quỹ: <span className="text-emerald-400 font-black">{formatVND(historyTotals.grandTotal)}</span>
                                                </h3>
                                            </div>
                                            <span className="text-xs font-bold px-3 py-1 rounded-xl bg-white/10 text-slate-300 border border-white/10">
                                                {filteredHistory.length} lần ghi nhận
                                            </span>
                                        </div>

                                        <div>
                                            <h4 className="text-xs font-bold text-slate-300 uppercase mb-2">Tổng số tiền chi tiết của từng quỹ:</h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                                                {Object.entries(historyTotals.fundTotals).map(([fundName, totalAmount]) => (
                                                    <div key={fundName} className="bg-slate-900/90 p-3 rounded-2xl border border-white/10 space-y-1 shadow-md">
                                                        <span className="text-[11px] font-bold text-slate-400 truncate block">{fundName}</span>
                                                        <span className="text-sm font-black block" style={{ color: themeColor }}>
                                                            {formatVND(totalAmount)}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* History Records List */}
                                {historyData.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-12 text-center text-slate-400 space-y-3">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="mx-auto text-slate-500"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        <p className="font-bold text-sm">Chưa có lịch sử phân bổ nào được lưu</p>
                                        <p className="text-xs text-slate-500">Hãy nhập số tiền ở tab Nhập Liệu và bấm "Lưu Phân Bổ" nhé!</p>
                                    </div>
                                ) : filteredHistory.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-8 text-center text-slate-400 space-y-2">
                                        <p className="font-bold text-sm">Không tìm thấy bản ghi nào trong khoảng thời gian này</p>
                                        <button onClick={() => { setFromDate(''); setToDate(''); }} className="text-xs font-bold text-blue-400 underline">
                                            Hiển thị tất cả lịch sử
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {filteredHistory.map((record) => (
                                            <div key={record.id} className="glass-card rounded-3xl p-5 shadow-xl space-y-4">
                                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-white/10 pb-3 gap-2">
                                                    <div>
                                                        <span className="text-xs font-bold text-slate-400">{record.date} ({record.time})</span>
                                                        <h3 className="font-extrabold text-base text-white">
                                                            Tổng thu nhập: <span className="text-emerald-400">{formatVND(record.totalIncome)}</span>
                                                        </h3>
                                                    </div>
                                                    <div className="flex items-center space-x-3">
                                                        <span className="px-3 py-1 rounded-xl text-xs font-bold bg-white/10 text-slate-300 border border-white/10">
                                                            {record.profileName}
                                                        </span>
                                                        <button
                                                            onClick={() => handleDeleteHistory(record.id)}
                                                            className="text-red-400 hover:text-red-300 p-1"
                                                            title="Xóa bản ghi"
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                                                    {record.allocations.map((alloc, idx) => (
                                                        <div key={idx} className="bg-slate-900/60 p-2.5 rounded-2xl border border-white/5 space-y-1">
                                                            <span className="text-[10px] font-bold text-slate-400 truncate block">{alloc.fundName} ({alloc.percent}%)</span>
                                                            <span className="text-xs font-black text-white block">{formatVND(alloc.amount)}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 4: RULES & PRINCIPLES */}
                        {activeTab === 'rules' && (
                            <div className="glass-card rounded-3xl p-6 shadow-2xl space-y-5">
                                <h2 className="font-extrabold text-lg text-white">Quy Tắc Quản Lý Tài Chính Tự Do JFF</h2>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    Phương pháp quản lý tài chính theo quy tắc các hũ quỹ giúp bạn cân bằng giữa cuộc sống hiện tại và mục tiêu tự do tài chính dài hạn trong tương lai.
                                </p>
                                
                                <div className="space-y-4 pt-2">
                                    <div className="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2">
                                        <h3 className="font-bold text-sm text-blue-400">1. Kỷ luật nhất quán</h3>
                                        <p className="text-xs text-slate-300">Ngay khi nhận được bất kỳ nguồn thu nhập nào (lương, thưởng, kinh doanh), hãy chia ngay lập tức theo đúng tỷ lệ % các quỹ.</p>
                                    </div>
                                    <div className="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2">
                                        <h3 className="font-bold text-sm text-emerald-400">2. Quỹ tự do tài chính (FFA) là "Con gà đẻ trứng vàng"</h3>
                                        <p className="text-xs text-slate-300">Tuyệt đối không dùng quỹ FFA cho các mục đích chi tiêu sinh hoạt. Quỹ này chỉ dùng để đầu tư sinh lời và tích lũy tài sản.</p>
                                    </div>
                                    <div className="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2">
                                        <h3 className="font-bold text-sm text-pink-400">3. Hưởng thụ không tội lỗi (PLAY)</h3>
                                        <p className="text-xs text-slate-300">Quỹ PLAY giúp tinh thần bạn luôn thoải mái. Hãy tiêu hết tiền quỹ PLAY mỗi tháng hoặc mỗi quý cho các hoạt động nâng cao chất lượng sống.</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FLOATING ACTION BUTTONS AT BOTTOM RIGHT */}
                    <div className="fixed bottom-5 right-5 z-40 flex items-center space-x-3">
                        {/* Switch Profile Button */}
                        <button
                            onClick={() => setShowSwitchProfileModal(true)}
                            className="px-4 py-3 rounded-2xl bg-slate-900/90 text-white font-extrabold text-xs border border-white/20 shadow-2xl backdrop-blur-md hover:bg-slate-800 transition-all active:scale-95 flex items-center space-x-2"
                        >
                            <span>🔄 Switch</span>
                        </button>

                        {/* Add New Profile Floating '+' Button */}
                        <button
                            onClick={() => setShowNewProfileModal(true)}
                            className="w-12 h-12 rounded-2xl text-white font-black text-2xl shadow-2xl transition-all duration-200 hover:scale-110 active:scale-95 flex items-center justify-center border border-white/20"
                            style={{ backgroundColor: themeColor }}
                            title="Tạo Giao Diện Quỹ Mới"
                        >
                            +
                        </button>
                    </div>

                    {/* TOAST NOTIFICATION BANNER */}
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-slate-900/95 text-white px-5 py-3 rounded-2xl border border-white/20 shadow-2xl backdrop-blur-md text-xs font-extrabold animate-bounce">
                            {toast}
                        </div>
                    )}

                    {/* MODAL 1: SETTINGS & THEME CUSTOMIZATION */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-md shadow-2xl border border-white/10 space-y-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Cài Đặt Giao Diện & Dữ Liệu</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>

                                {/* Theme Presets */}
                                <div className="space-y-3">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Màu Sắc Chủ Đạo (Theme Color)</label>
                                    <div className="flex flex-wrap items-center gap-2">
                                        {COLOR_PRESETS.map((preset) => (
                                            <button
                                                key={preset.hex}
                                                onClick={() => setThemeColor(preset.hex)}
                                                className={`w-8 h-8 rounded-full border-2 transition-all ${
                                                    themeColor === preset.hex ? 'border-white scale-110 shadow-lg' : 'border-transparent hover:scale-110 hover:border-white/50'
                                                }`}
                                                style={{ backgroundColor: preset.hex }}
                                                title={preset.name}
                                            />
                                        ))}

                                        {/* Custom Color Wheel Button */}
                                        <button
                                            onClick={() => {
                                                setTempCustomColor(themeColor);
                                                setShowColorPickerModal(true);
                                            }}
                                            className="px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-white/20 font-bold text-xs flex items-center space-x-1.5 transition-all shadow-md active:scale-95"
                                        >
                                            <span>🎨 Custom</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Glass Opacity Slider */}
                                <div className="space-y-2">
                                    <div className="flex justify-between text-xs font-bold">
                                        <span className="text-slate-300">Độ Trong Suốt Card (Glass Opacity)</span>
                                        <span className="text-white font-mono">{glassOpacity}%</span>
                                    </div>
                                    <input
                                        type="range"
                                        min="10"
                                        max="90"
                                        value={glassOpacity}
                                        onChange={(e) => setGlassOpacity(Number(e.target.value))}
                                        className="w-full accent-blue-500 cursor-pointer"
                                    />
                                </div>

                                {/* Glass Blur Slider */}
                                <div className="space-y-2">
                                    <div className="flex justify-between text-xs font-bold">
                                        <span className="text-slate-300">Độ Mờ Hậu Cảnh (Glass Blur)</span>
                                        <span className="text-white font-mono">{glassBlur}px</span>
                                    </div>
                                    <input
                                        type="range"
                                        min="0"
                                        max="30"
                                        value={glassBlur}
                                        onChange={(e) => setGlassBlur(Number(e.target.value))}
                                        className="w-full accent-blue-500 cursor-pointer"
                                    />
                                </div>

                                {/* Custom Background Image */}
                                <div className="space-y-3 pt-2 border-t border-white/10">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Ảnh Nền Tùy Chỉnh</label>
                                    <div className="flex items-center space-x-3">
                                        <label className="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs cursor-pointer border border-white/10 text-center transition-all">
                                            <span>🖼️ Chọn ảnh & Crop</span>
                                            <input type="file" accept="image/*" onChange={handleImageSelect} className="hidden" />
                                        </label>
                                        {bgImage && (
                                            <button
                                                onClick={() => { setBgImage(''); showToast('Đã xóa ảnh nền'); }}
                                                className="py-2.5 px-3 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-xl font-bold text-xs border border-red-500/30 transition-all"
                                            >
                                                Xóa nền
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Data Backup & Restore */}
                                <div className="space-y-3 pt-2 border-t border-white/10">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Sao Lưu & Khôi Phục Dữ Liệu</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={handleExportData}
                                            className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs border border-white/10 transition-all"
                                        >
                                            📥 Tải Tệp Sao Lưu
                                        </button>
                                        <label className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-bold text-xs border border-white/10 text-center cursor-pointer transition-all">
                                            <span>📤 Nhập Dữ Liệu</span>
                                            <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: NEW PROFILE CREATION */}
                    {showNewProfileModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-4">
                                <h3 className="font-extrabold text-white text-base">Tạo Giao Diện Phân Bổ Mới</h3>
                                <p className="text-xs text-slate-400">Nhập tên cho giao diện tài chính mới của bạn (VD: Giao diện kinh doanh, Giao diện tiêu dùng...)</p>
                                
                                <input
                                    type="text"
                                    value={newProfileName}
                                    onChange={(e) => setNewProfileName(e.target.value)}
                                    placeholder="Tên giao diện..."
                                    className="w-full bg-slate-950 text-white font-bold text-sm px-4 py-3 rounded-2xl border border-white/15 focus:outline-none focus:border-blue-500"
                                />

                                <div className="flex space-x-3 pt-2">
                                    <button
                                        onClick={() => setShowNewProfileModal(false)}
                                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold text-xs uppercase"
                                    >
                                        Hủy
                                    </button>
                                    <button
                                        onClick={handleCreateProfile}
                                        className="flex-1 py-3 text-white rounded-2xl font-black text-xs uppercase shadow-lg transition-all hover:brightness-110 active:scale-95"
                                        style={{ backgroundColor: themeColor }}
                                    >
                                        Tạo Mới
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 3: SWITCH PROFILE */}
                    {showSwitchProfileModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-md shadow-2xl border border-white/10 space-y-4 max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                    <h3 className="font-extrabold text-white text-base">Danh Sách Giao Diện Phân Bổ</h3>
                                    <button onClick={() => setShowSwitchProfileModal(false)} className="text-slate-400 hover:text-white p-1">
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    {profiles.map((prof) => (
                                        <div
                                            key={prof.id}
                                            onClick={() => {
                                                setActiveProfileId(prof.id);
                                                setShowSwitchProfileModal(false);
                                                showToast(`Đã chuyển sang: ${prof.name}`);
                                            }}
                                            className={`p-4 rounded-2xl border transition-all cursor-pointer flex justify-between items-center ${
                                                activeProfileId === prof.id
                                                    ? 'border-blue-500 bg-blue-500/10'
                                                    : 'border-white/10 bg-slate-950/60 hover:border-white/30'
                                            }`}
                                        >
                                            <div>
                                                <h4 className="font-extrabold text-sm text-white">{prof.name}</h4>
                                                <p className="text-[11px] text-slate-400">{prof.funds.length} ô quỹ phân bổ</p>
                                            </div>
                                            {activeProfileId === prof.id && (
                                                <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-blue-500 text-white">Đang dùng</span>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: INTERACTIVE IMAGE CROPPER TOOL */}
                    {tempImage && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-3 bg-black/90 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-5 w-full max-w-2xl shadow-2xl border border-white/10 space-y-4 max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-center pb-2 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-sm sm:text-base">Chỉnh Sửa & Cắt Ảnh Nền</h3>
                                    <button onClick={() => setTempImage(null)} className="text-slate-400 hover:text-white p-1">
                                        ✕
                                    </button>
                                </div>

                                <div className="flex-1 min-h-[250px] max-h-[50vh] bg-slate-950 rounded-2xl overflow-hidden flex items-center justify-center">
                                    <img ref={imageRef} src={tempImage} alt="Crop preview" className="max-w-full max-h-full block" />
                                </div>

                                {/* Crop ratio selector */}
                                <div className="flex flex-wrap gap-2 justify-center pt-2">
                                    {[
                                        { label: 'Tự Do', ratio: NaN },
                                        { label: '9:16 (Điện thoại)', ratio: 9 / 16 },
                                        { label: '1:1 (Vuông)', ratio: 1 },
                                        { label: '16:9 (Ngang)', ratio: 16 / 9 },
                                    ].map((item, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setCropAspectRatio(item.ratio)}
                                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-slate-200 transition-all"
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex space-x-3 pt-2 border-t border-white/10">
                                    <button
                                        onClick={() => setTempImage(null)}
                                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold text-xs uppercase"
                                    >
                                        Hủy
                                    </button>
                                    <button
                                        onClick={handleApplyCrop}
                                        className="flex-1 py-3 text-white rounded-2xl font-black text-xs uppercase shadow-lg transition-all hover:brightness-110 active:scale-95"
                                        style={{ backgroundColor: themeColor }}
                                    >
                                        Áp Dụng (OK)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 5: CUSTOM COLOR WHEEL PICKER */}
                    {showColorPickerModal && (
                        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-5">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Chọn Màu Tùy Chỉnh</h3>
                                    <button onClick={() => setShowColorPickerModal(false)} className="text-slate-400 hover:text-white p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>

                                <div className="flex flex-col items-center space-y-4 py-2">
                                    <div 
                                        className="w-20 h-20 rounded-2xl border-4 border-white/20 shadow-xl flex items-center justify-center transition-all"
                                        style={{ backgroundColor: tempCustomColor }}
                                    >
                                        <span className="text-xs font-black px-2 py-1 rounded bg-black/40 text-white font-mono">{tempCustomColor}</span>
                                    </div>
                                    
                                    <div className="w-full space-y-2">
                                        <label className="text-xs font-bold text-slate-300 block text-center">Bảng Chọn Màu (Color Wheel)</label>
                                        <input
                                            type="color"
                                            value={tempCustomColor}
                                            onChange={(e) => setTempCustomColor(e.target.value)}
                                            className="w-full h-12 rounded-2xl bg-slate-950 border border-white/15 cursor-pointer p-1"
                                        />
                                    </div>
                                </div>

                                <div className="flex space-x-3 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowColorPickerModal(false)}
                                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold text-xs uppercase"
                                    >
                                        Hủy
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setThemeColor(tempCustomColor);
                                            setShowColorPickerModal(false);
                                            showToast("Đã đổi màu chủ đạo thành công!");
                                        }}
                                        className="flex-1 py-3 text-white rounded-2xl font-black text-xs uppercase shadow-lg transition-all hover:brightness-110 active:scale-95 font-bold"
                                        style={{ backgroundColor: tempCustomColor }}
                                    >
                                        OK
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
