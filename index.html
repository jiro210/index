<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF - Jiro Financial Freedom</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cropper.js for image editing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --theme-color: #3b82f6;
            --glass-opacity: 0.85;
            --glass-blur: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(15, 23, 42, var(--glass-opacity)) !important;
            backdrop-filter: blur(var(--glass-blur)) !important;
            -webkit-backdrop-filter: blur(var(--glass-blur)) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Cropper Customization */
        .cropper-bg { background-image: none !important; background-color: #020617 !important; }
        .cropper-view-box { outline: 2px solid var(--theme-color) !important; }
        .cropper-line, .cropper-point { background-color: var(--theme-color) !important; }
    </style>
</head>
<body class="min-h-screen selection:bg-blue-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Default 6-Jar Profile Template
        const DEFAULT_PROFILES = [
            {
                id: 'p1',
                name: 'Giao diện 1 (6 Quỹ Mặc Định)',
                isDefault: true,
                funds: [
                    { id: 'f1', name: 'Nhu cầu thiết yếu (NEC)', percent: 55, color: '#3b82f6', desc: 'Ăn uống, thuê nhà, hóa đơn, sinh hoạt hàng ngày' },
                    { id: 'f2', name: 'Tự do tài chính (FFA)', percent: 10, color: '#10b981', desc: 'Đầu tư, tích sản, tạo nguồn thu nhập thụ động' },
                    { id: 'f3', name: 'Tiết kiệm dài hạn (LTSS)', percent: 10, color: '#6366f1', desc: 'Mua xe, mua nhà, quỹ khẩn cấp, mục tiêu lớn' },
                    { id: 'f4', name: 'Học tập & Phát triển (EDU)', percent: 10, color: '#f59e0b', desc: 'Sách, khóa học, nâng cao kiến thức bản thân' },
                    { id: 'f5', name: 'Hưởng thụ (PLAY)', percent: 10, color: '#ec4899', desc: 'Giải trí, du lịch, mua sắm bản thân' },
                    { id: 'f6', name: 'Cho đi (GIV)', percent: 5, color: '#14b8a6', desc: 'Từ thiện, giúp đỡ người thân, quà tặng' }
                ]
            }
        ];

        // Theme Color Presets
        const COLOR_PRESETS = [
            { name: 'Xanh Lam', hex: '#3b82f6' },
            { name: 'Xanh Ngọc', hex: '#10b981' },
            { name: 'Tím Huyền Bí', hex: '#8b5cf6' },
            { name: 'Hồng Ánh Kim', hex: '#ec4899' },
            { name: 'Cam Hổ Phách', hex: '#f59e0b' },
            { name: 'Đỏ Đô', hex: '#ef4444' }
        ];

        function App() {
            // App Core States
            const [profiles, setProfiles] = useState(() => {
                const saved = localStorage.getItem('jff_profiles');
                return saved ? JSON.parse(saved) : DEFAULT_PROFILES;
            });

            const [activeProfileId, setActiveProfileId] = useState(() => {
                return localStorage.getItem('jff_active_profile') || 'p1';
            });

            const [incomeInput, setIncomeInput] = useState('');
            const [historyData, setHistoryData] = useState(() => {
                const saved = localStorage.getItem('jff_history');
                return saved ? JSON.parse(saved) : [];
            });

            // Styling States
            const [themeColor, setThemeColor] = useState(() => localStorage.getItem('jff_theme_color') || '#3b82f6');
            const [glassOpacity, setGlassOpacity] = useState(() => Number(localStorage.getItem('jff_opacity')) || 85);
            const [glassBlur, setGlassBlur] = useState(() => Number(localStorage.getItem('jff_blur')) || 16);
            const [bgImage, setBgImage] = useState(() => localStorage.getItem('jff_bg') || null);

            // Modals & UI Controls
            const [activeTab, setActiveTab] = useState('calc'); // calc | config | history | rules
            const [showSettings, setShowSettings] = useState(false);
            const [showNewProfileModal, setShowNewProfileModal] = useState(false);
            const [showSwitchProfileModal, setShowSwitchProfileModal] = useState(false);
            const [newProfileName, setNewProfileName] = useState('');
            const [toast, setToast] = useState(null);
            const [filterDate, setFilterDate] = useState('');

            // Image Cropper States
            const [tempImage, setTempImage] = useState(null);
            const [aspectRatio, setAspectRatio] = useState(9 / 16);
            const cropImageRef = useRef(null);
            const cropperInstanceRef = useRef(null);
            const bgInputRef = useRef(null);

            // Show Toast Message Helper
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3200);
            };

            // Save state updates to LocalStorage
            useEffect(() => {
                localStorage.setItem('jff_profiles', JSON.stringify(profiles));
            }, [profiles]);

            useEffect(() => {
                localStorage.setItem('jff_active_profile', activeProfileId);
            }, [activeProfileId]);

            useEffect(() => {
                localStorage.setItem('jff_history', JSON.stringify(historyData));
            }, [historyData]);

            useEffect(() => {
                localStorage.setItem('jff_theme_color', themeColor);
                document.documentElement.style.setProperty('--theme-color', themeColor);
            }, [themeColor]);

            useEffect(() => {
                localStorage.setItem('jff_opacity', glassOpacity);
                document.documentElement.style.setProperty('--glass-opacity', glassOpacity / 100);
            }, [glassOpacity]);

            useEffect(() => {
                localStorage.setItem('jff_blur', glassBlur);
                document.documentElement.style.setProperty('--glass-blur', `${glassBlur}px`);
            }, [glassBlur]);

            // Initialize Cropper Instance on Temp Image Load
            useEffect(() => {
                let cropper = null;
                if (tempImage && cropImageRef.current && window.Cropper) {
                    cropper = new window.Cropper(cropImageRef.current, {
                        aspectRatio: isNaN(aspectRatio) ? NaN : aspectRatio,
                        viewMode: 1,
                        autoCropArea: 0.9,
                        responsive: true,
                        background: true,
                        zoomable: true,
                        scalable: true,
                        rotatable: true,
                        movable: true,
                    });
                    cropperInstanceRef.current = cropper;
                }
                return () => {
                    if (cropper) {
                        cropper.destroy();
                        cropperInstanceRef.current = null;
                    }
                };
            }, [tempImage, aspectRatio]);

            // Active Profile object lookup
            const activeProfile = useMemo(() => {
                return profiles.find(p => p.id === activeProfileId) || profiles[0] || DEFAULT_PROFILES[0];
            }, [profiles, activeProfileId]);

            // Total percent of active profile funds
            const totalProfilePercent = useMemo(() => {
                if (!activeProfile || !activeProfile.funds) return 0;
                return activeProfile.funds.reduce((sum, f) => sum + (Number(f.percent) || 0), 0);
            }, [activeProfile]);

            // Handle Cropper Image Selection
            const handleImageSelect = (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        setTempImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            const handleApplyCrop = () => {
                if (cropperInstanceRef.current) {
                    const canvas = cropperInstanceRef.current.getCroppedCanvas({
                        maxWidth: 1920,
                        maxHeight: 1920,
                        fillColor: '#020617',
                        imageSmoothingEnabled: true,
                        imageSmoothingQuality: 'high',
                    });
                    if (canvas) {
                        const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        setBgImage(croppedDataUrl);
                        localStorage.setItem('jff_bg', croppedDataUrl);
                        setTempImage(null);
                        showToast("Đã áp dụng ảnh nền thành công!");
                    }
                }
            };

            // Profile Creation
            const handleCreateProfile = (e) => {
                e.preventDefault();
                if (!newProfileName.trim()) {
                    showToast("Vui lòng nhập tên giao diện!", "error");
                    return;
                }
                const newId = 'profile_' + Date.now();
                const newProf = {
                    id: newId,
                    name: newProfileName.trim(),
                    isDefault: false,
                    funds: [
                        { id: 'f_' + Date.now(), name: 'Quỹ Chi Tiêu Chính', percent: 100, color: themeColor, desc: 'Tự do tùy chỉnh phần trăm và tên ô quỹ' }
                    ]
                };
                setProfiles(prev => [...prev, newProf]);
                setActiveProfileId(newId);
                setNewProfileName('');
                setShowNewProfileModal(false);
                setActiveTab('config');
                showToast(`Đã tạo thành công giao diện "${newProf.name}"!`);
            };

            // Fund Config Operations
            const handleUpdateFund = (fundId, field, value) => {
                setProfiles(prev => prev.map(p => {
                    if (p.id !== activeProfile.id) return p;
                    return {
                        ...p,
                        funds: p.funds.map(f => f.id === fundId ? { ...f, [field]: value } : f)
                    };
                }));
            };

            const handleAddFund = () => {
                if (totalProfilePercent >= 100) {
                    showToast("Tổng % của các quỹ đã đạt 100%. Hãy hạ % các quỹ khác trước khi thêm!", "error");
                }
                const newFund = {
                    id: 'f_' + Date.now(),
                    name: `Quỹ Mới ${activeProfile.funds.length + 1}`,
                    percent: 0,
                    color: '#3b82f6',
                    desc: 'Mô tả mục đích của quỹ tài chính này'
                };
                setProfiles(prev => prev.map(p => {
                    if (p.id !== activeProfile.id) return p;
                    return { ...p, funds: [...p.funds, newFund] };
                }));
                showToast("Đã thêm một ô quỹ mới!");
            };

            const handleDeleteFund = (fundId) => {
                if (activeProfile.funds.length <= 1) {
                    showToast("Mỗi giao diện phải có ít nhất 1 ô quỹ!", "error");
                    return;
                }
                setProfiles(prev => prev.map(p => {
                    if (p.id !== activeProfile.id) return p;
                    return { ...p, funds: p.funds.filter(f => f.id !== fundId) };
                }));
                showToast("Đã xóa ô quỹ!");
            };

            // Save Income Allocation to History
            const handleSaveHistory = () => {
                const numericIncome = Number(incomeInput);
                if (!numericIncome || numericIncome <= 0) {
                    showToast("Vui lòng nhập số tiền thu nhập hợp lệ!", "error");
                    return;
                }
                if (totalProfilePercent > 100) {
                    showToast("Tổng % quỹ vượt quá 100%. Vui lòng điều chỉnh lại ở tab Cấu Hình Quỹ!", "error");
                    return;
                }

                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                const timeStr = today.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

                const fundAllocations = activeProfile.funds.map(f => ({
                    fundName: f.name,
                    percent: f.percent,
                    amount: Math.round(numericIncome * (f.percent / 100))
                }));

                const newRecord = {
                    id: 'hist_' + Date.now(),
                    date: dateStr,
                    time: timeStr,
                    totalIncome: numericIncome,
                    profileName: activeProfile.name,
                    allocations: fundAllocations
                };

                setHistoryData(prev => [newRecord, ...prev]);
                showToast(`Đã lưu phân bổ ${formatVND(numericIncome)} vào Lịch sử!`);
            };

            // Delete History Record
            const handleDeleteHistory = (id) => {
                setHistoryData(prev => prev.filter(h => h.id !== id));
                showToast("Đã xóa bản ghi lịch sử!");
            };

            // Backup & Restore
            const handleExportData = () => {
                const data = {
                    profiles,
                    activeProfileId,
                    historyData,
                    themeColor,
                    glassOpacity,
                    glassBlur,
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `JFF_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Đã xuất file sao lưu dữ liệu thành công!");
            };

            const handleImportData = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.profiles) setProfiles(parsed.profiles);
                        if (parsed.activeProfileId) setActiveProfileId(parsed.activeProfileId);
                        if (parsed.historyData) setHistoryData(parsed.historyData);
                        if (parsed.themeColor) setThemeColor(parsed.themeColor);
                        if (parsed.glassOpacity) setGlassOpacity(parsed.glassOpacity);
                        if (parsed.glassBlur) setGlassBlur(parsed.glassBlur);
                        showToast("Đã khôi phục dữ liệu sao lưu thành công!");
                    } catch (err) {
                        showToast("File sao lưu không hợp lệ!", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Formatting Helper
            const formatVND = (val) => {
                const num = Number(val) || 0;
                return num.toLocaleString('vi-VN') + ' ₫';
            };

            return (
                <div 
                    className="min-h-screen bg-cover bg-center bg-fixed transition-all duration-500 relative flex flex-col"
                    style={{
                        backgroundImage: bgImage ? `url(${bgImage})` : 'none',
                    }}
                >
                    {/* Dark Overlay for Wallpaper readability */}
                    <div className="absolute inset-0 bg-slate-950/70 backdrop-brightness-75 pointer-events-none z-0"></div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-5 right-5 z-[120] animate-in slide-in-from-top duration-300">
                            <div className={`px-4 py-3 rounded-2xl shadow-2xl border flex items-center space-x-3 backdrop-blur-xl ${
                                toast.type === 'error' 
                                ? 'bg-red-900/90 border-red-500/50 text-white' 
                                : 'bg-slate-900/95 border-blue-500/50 text-white'
                            }`}>
                                <div className={`w-2.5 h-2.5 rounded-full ${toast.type === 'error' ? 'bg-red-400' : 'bg-blue-400'} animate-ping`}></div>
                                <span className="text-xs font-bold">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Main Content Container */}
                    <div className="relative z-10 flex-1 flex flex-col max-w-6xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-8">
                        
                        {/* Header Navbar */}
                        <header className="glass-card rounded-3xl p-4 sm:p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-2xl">
                            <div className="flex items-center space-x-3">
                                <div 
                                    className="w-12 h-12 rounded-2xl flex items-center justify-center font-black text-white text-xl shadow-lg transform hover:rotate-6 transition-transform"
                                    style={{ backgroundColor: themeColor }}
                                >
                                    JFF
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg sm:text-xl text-white tracking-tight flex items-center gap-2">
                                        Jiro Financial Freedom
                                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/10 text-slate-300 font-semibold border border-white/10">v2.5</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Giao diện đang dùng: <span className="font-bold text-slate-200">{activeProfile.name}</span></p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className="p-3 bg-white/5 hover:bg-white/10 text-slate-200 hover:text-white rounded-2xl border border-white/10 transition-all flex items-center space-x-2 text-xs font-bold"
                                    title="Tùy chỉnh giao diện & màu sắc"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <span className="hidden sm:inline">Cài Đặt</span>
                                </button>
                            </div>
                        </header>

                        {/* Navigation Tabs */}
                        <div className="flex bg-slate-900/80 p-1.5 rounded-2xl border border-white/10 mb-6 backdrop-blur-md overflow-x-auto scrollbar-none">
                            <button
                                onClick={() => setActiveTab('calc')}
                                className={`flex-1 min-w-[120px] py-2.5 px-4 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center space-x-2 ${
                                    activeTab === 'calc' ? 'bg-white/15 text-white shadow-lg border border-white/10' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                                <span>Nhập Liệu</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('config')}
                                className={`flex-1 min-w-[120px] py-2.5 px-4 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center space-x-2 ${
                                    activeTab === 'config' ? 'bg-white/15 text-white shadow-lg border border-white/10' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                <span>Cấu Hình Quỹ</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('history')}
                                className={`flex-1 min-w-[120px] py-2.5 px-4 rounded-xl text-xs font-black uppercase tracking-wider transition-all flex items-center justify-center space-x-2 ${
                                    activeTab === 'history' ? 'bg-white/15 text-white shadow-lg border border-white/10' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                                <span>Lịch Sử</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('rules')}

                                    <h3 className="font-extrabold text-white text-base">Chọn Giao Diện Đang Dùng</h3>
                                    <button onClick={() => setShowSwitchProfileModal(false)} className="text-slate-400 hover:text-white p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>

                                <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                                    {profiles.map((p) => (
                                        <div
                                            key={p.id}
                                            onClick={() => {
                                                setActiveProfileId(p.id);
                                                setShowSwitchProfileModal(false);
                                                showToast(`Đã chuyển sang: ${p.name}`);
                                            }}
                                            className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${
                                                activeProfileId === p.id 
                                                ? 'bg-blue-600/20 border-blue-500 text-white' 
                                                : 'bg-slate-950/60 border-white/10 text-slate-300 hover:bg-slate-800'
                                            }`}
                                        >
                                            <div>
                                                <h4 className="font-bold text-sm">{p.name}</h4>
                                                <span className="text-[10px] text-slate-400">{p.funds.length} Ô Quỹ</span>
                                            </div>
                                            {activeProfileId === p.id && (
                                                <span className="w-2.5 h-2.5 rounded-full bg-blue-400"></span>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 3: SETTINGS (THEME, OPACITY, BLUR, BACKUP) */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-white/10 space-y-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base uppercase tracking-wider">Cài Đặt Giao Diện & Dữ Liệu</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>

                                {/* Theme Presets */}
                                <div className="space-y-3">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Màu Sắc Chủ Đạo (Theme Color)</label>
                                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                        {COLOR_PRESETS.map((preset) => (
                                            <button
                                                key={preset.hex}
                                                onClick={() => setThemeColor(preset.hex)}
                                                className={`p-2 rounded-2xl border text-[10px] font-bold flex flex-col items-center space-y-1 transition-all ${
                                                    themeColor === preset.hex ? 'border-white ring-2 ring-white/50' : 'border-white/10 hover:border-white/30'
                                                }`}
                                            >
                                                <span className="w-5 h-5 rounded-full shadow-sm" style={{ backgroundColor: preset.hex }}></span>
                                                <span className="text-slate-300 truncate w-full text-center">{preset.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Opacity & Blur Sliders */}
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                                            <span>Độ Trong Suốt Ô Quỹ (Glass Opacity)</span>
                                            <span>{glassOpacity}%</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="30"
                                            max="100"
                                            value={glassOpacity}
                                            onChange={(e) => setGlassOpacity(Number(e.target.value))}
                                            className="w-full accent-blue-500 bg-slate-800 rounded-lg cursor-pointer"
                                        />
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                                            <span>Độ Mờ Nhòe (Glass Blur)</span>
                                            <span>{glassBlur}px</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="0"
                                            max="30"
                                            value={glassBlur}
                                            onChange={(e) => setGlassBlur(Number(e.target.value))}
                                            className="w-full accent-blue-500 bg-slate-800 rounded-lg cursor-pointer"
                                        />
                                    </div>
                                </div>

                                {/* Wallpaper Selection */}
                                <div className="space-y-3 pt-2 border-t border-white/10">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Ảnh Nền Giao Diện</label>
                                    <div className="flex items-center space-x-3">
                                        <input
                                            type="file"
                                            ref={bgInputRef}
                                            accept="image/*"
                                            onChange={handleImageSelect}
                                            className="hidden"
                                        />
                                        <button
                                            onClick={() => bgInputRef.current && bgInputRef.current.click()}
                                            className="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-bold text-xs border border-white/10"
                                        >
                                            🖼️ Tải Ảnh & Cắt Ảnh
                                        </button>
                                        {bgImage && (
                                            <button
                                                onClick={() => {
                                                    setBgImage(null);
                                                    localStorage.removeItem('jff_bg');
                                                    showToast("Đã xóa ảnh nền!");
                                                }}
                                                className="text-xs text-red-400 hover:underline font-bold"
                                            >
                                                Xóa Ảnh
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Backup & Sync Data */}
                                <div className="space-y-3 pt-2 border-t border-white/10">
                                    <label className="text-xs font-bold text-slate-300 uppercase block">Sao Lưu & Đám Mây (Cloud Sync)</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={handleExportData}
                                            className="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-bold text-xs border border-white/10"
                                        >
                                            📥 Xuất File Backup (.json)
                                        </button>
                                        <label className="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-2xl font-bold text-xs border border-white/10 text-center cursor-pointer block">
                                            📤 Nhập File Backup
                                            <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: INTERACTIVE IMAGE CROPPER TOOL */}
                    {tempImage && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-3 bg-black/90 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-slate-900 rounded-3xl p-5 w-full max-w-lg shadow-2xl border border-white/10 flex flex-col max-h-[92vh]">
                                <div className="flex justify-between items-center mb-3 pb-2 border-b border-white/10">
                                    <div>
                                        <h3 className="font-extrabold text-white text-sm">Cắt & Điều Chỉnh Ảnh Nền</h3>
                                        <p className="text-[10px] text-slate-400">Di chuyển, phóng to hoặc xoay khung cắt</p>
                                    </div>
                                    <button onClick={() => setTempImage(null)} className="text-slate-400 hover:text-white p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>

                                <div className="relative w-full flex-1 min-h-[260px] max-h-[380px] bg-black rounded-2xl overflow-hidden mb-3 border border-white/10 flex items-center justify-center">
                                    <img ref={cropImageRef} src={tempImage} alt="Crop target" className="max-w-full block" />
                                </div>

                                <div className="space-y-3">
                                    <div className="flex justify-center space-x-1 bg-slate-800 p-1.5 rounded-xl border border-white/10">
                                        <button 
                                            onClick={() => setAspectRatio(9 / 16)} 
                                            className={`px-3 py-1 rounded-lg text-[10px] font-bold ${aspectRatio === 9/16 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            9:16
                                        </button>
                                        <button 
                                            onClick={() => setAspectRatio(1)} 
                                            className={`px-3 py-1 rounded-lg text-[10px] font-bold ${aspectRatio === 1 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            1:1
                                        </button>
                                        <button 
                                            onClick={() => setAspectRatio(16 / 9)} 
                                            className={`px-3 py-1 rounded-lg text-[10px] font-bold ${aspectRatio === 16/9 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            16:9
                                        </button>
                                        <button 
                                            onClick={() => setAspectRatio(NaN)} 
                                            className={`px-3 py-1 rounded-lg text-[10px] font-bold ${isNaN(aspectRatio) ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                                        >
                                            Tự Do
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <button 
                                            onClick={() => setTempImage(null)} 
                                            className="py-3 bg-slate-800 text-slate-300 rounded-2xl font-bold text-xs uppercase"
                                        >
                                            Hủy
                                        </button>
                                        <button 
                                            onClick={handleApplyCrop} 
                                            className="py-3 bg-blue-600 text-white rounded-2xl font-black text-xs uppercase shadow-lg"
                                        >
                                            Áp Dụng (OK)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Mount React Root
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
