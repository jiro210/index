                                    </div>

                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 flex justify-between">
                                            <span>Độ Mờ (Blur)</span>
                                            <span>{glassBlur}px</span>
                                        </label>
                                        <input type="range" min="0" max="30" value={glassBlur} onChange={(e) => setGlassBlur(Number(e.target.value))} className="w-full accent-blue-500" />
                                    </div>

                                    <div className="pt-2 border-t border-white/10">
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Hình Nền</label>
                                        <div className="flex space-x-2">
                                            <label className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10 text-center text-xs font-bold cursor-pointer transition-all">
                                                Tải ảnh lên
                                                <input type="file" accept="image/*" onChange={handleImageSelect} className="hidden" />
                                            </label>
                                            {bgImage && (
                                                <button onClick={() => { setBgImage(''); showToast('Đã xóa hình nền'); }} className="px-3 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold hover:bg-red-500/20 transition-all">Xóa</button>
                                            )}
                                        </div>
                                    </div>

                                    <div className="pt-2 border-t border-white/10">
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Dữ Liệu</label>
                                        <div className="flex space-x-2">
                                            <button onClick={handleExportData} className="flex-1 py-2 rounded-xl bg-blue-500/20 text-blue-400 border border-blue-500/30 text-xs font-bold hover:bg-blue-500/30">Xuất Backup</button>
                                            <label className="flex-1 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-center text-xs font-bold cursor-pointer hover:bg-emerald-500/30">
                                                Nhập Backup
                                                <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CUSTOM COLOR PICKER */}
                    {showColorPickerModal && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-4">
                                <h3 className="font-extrabold text-white text-base">Tùy Chọn Màu Tự Do</h3>
                                <div className="flex justify-center py-4">
                                    <input type="color" value={tempCustomColor} onChange={(e) => setTempCustomColor(e.target.value)} className="w-24 h-24 rounded-full border-4 border-white/20 bg-slate-950 p-1 cursor-pointer" />
                                </div>
                                <div className="flex space-x-3 pt-2">
                                    <button onClick={() => { setShowColorPickerModal(false); setShowSettings(true); }} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Hủy</button>
                                    <button onClick={() => { setThemeColor(tempCustomColor); setShowColorPickerModal(false); setShowSettings(true); }} className="flex-1 py-2.5 rounded-xl bg-blue-500 text-white font-extrabold text-xs">Lưu Màu Này</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CHUYỂN / XÓA GIAO DIỆN */}
                    {showSwitchProfileModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-4 max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Chọn Giao Diện</h3>
                                    <button onClick={() => setShowSwitchProfileModal(false)} className="text-slate-400 hover:text-white p-1 font-bold">✕</button>
                                </div>
                                <div className="space-y-2">
                                    {profiles.map(p => (
                                        <div key={p.id} className={`flex items-center justify-between p-3 rounded-2xl border ${activeProfileId === p.id ? 'bg-blue-500/20 border-blue-500/50' : 'bg-slate-800/50 border-white/5 hover:border-white/20'}`}>
                                            <div className="flex-1 cursor-pointer" onClick={() => { setActiveProfileId(p.id); setShowSwitchProfileModal(false); }}>
                                                <h4 className={`font-bold text-sm ${activeProfileId === p.id ? 'text-blue-400' : 'text-slate-200'}`}>{p.name}</h4>
                                                <p className="text-[10px] text-slate-400">{p.funds.length} ô quỹ</p>
                                            </div>
                                            {profiles.length > 1 && (
                                                <button onClick={() => setProfileToDelete(p)} className="p-2 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition-all" title="Xóa giao diện">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM DELETE PROFILE */}
                    {profileToDelete && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-red-500/30 space-y-4">
                                <h3 className="font-extrabold text-red-400 text-base">Xác Nhận Xóa Giao Diện</h3>
                                <p className="text-xs text-slate-300">Bạn có muốn xóa giao diện <strong>{profileToDelete.name}</strong> không? Thao tác sẽ không thể hoàn tác.</p>
                                <div className="flex space-x-3 pt-2">
                                    <button onClick={() => setProfileToDelete(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Huỷ</button>
                                    <button onClick={() => { 
                                        const remaining = profiles.filter(p => p.id !== profileToDelete.id);
                                        setProfiles(remaining); 
                                        if (activeProfileId === profileToDelete.id && remaining.length > 0) {
                                            setActiveProfileId(remaining[0].id);
                                        }
                                        setProfileToDelete(null); 
                                        showToast(`Đã xóa: ${profileToDelete.name}`); 
                                    }} className="flex-1 py-2.5 rounded-xl bg-red-500 text-white font-extrabold text-xs">Ok</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: TẠO GIAO DIỆN MỚI */}
                    {showNewProfileModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-4">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Tạo Giao Diện Mới</h3>
                                    <button onClick={() => setShowNewProfileModal(false)} className="text-slate-400 hover:text-white p-1 font-bold">✕</button>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase">Tên Giao Diện</label>
                                    <input
                                        type="text"
                                        value={newProfileName}
                                        onChange={(e) => setNewProfileName(e.target.value)}
                                        className="w-full bg-slate-950 text-white font-bold text-sm px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                        placeholder=""
                                        autoFocus
                                    />
                                </div>
                                <button onClick={handleCreateProfile} className="w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-extrabold text-sm shadow-lg transition-all">Tạo Mới & Chuyển Ngay</button>
                            </div>
                        </div>
                    )}

                    {/* IMAGE CROPPER MODAL */}
                    {tempImage && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/95">
                            <div className="w-full max-w-4xl h-[80vh] flex flex-col bg-slate-900 rounded-3xl border border-white/10 overflow-hidden">
                                <div className="p-4 border-b border-white/10 flex justify-between items-center">
                                    <h3 className="font-extrabold text-white text-sm">Cắt Hình Nền</h3>
                                    <div className="flex space-x-2">
                                        <button onClick={() => setCropAspectRatio(NaN)} className="px-2 py-1 bg-white/10 rounded text-[10px] text-white">Tự Do</button>
                                        <button onClick={() => setCropAspectRatio(16/9)} className="px-2 py-1 bg-white/10 rounded text-[10px] text-white">16:9 PC</button>
                                        <button onClick={() => setCropAspectRatio(9/16)} className="px-2 py-1 bg-white/10 rounded text-[10px] text-white">9:16 Mobile</button>
                                    </div>
                                </div>
                                <div className="flex-1 bg-black relative">
                                    <img ref={imageRef} src={tempImage} alt="Crop preview" className="max-w-full block" />
                                </div>
                                <div className="p-4 border-t border-white/10 flex justify-end space-x-3">
                                    <button onClick={() => setTempImage(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Hủy</button>
                                    <button onClick={handleApplyCrop} className="px-4 py-2 rounded-xl bg-blue-500 text-white font-bold text-xs shadow-lg">Áp Dụng Hình Nền</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
