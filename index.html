<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JFF - Jiro Financial Freedom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.4s ease-in-out;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.7);
        }
        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(17, 24, 39, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scaleUp {
            animation: scaleUp 0.18s ease-out forwards;
        }
        /* Drawer slide animation */
        @keyframes slideInLeft {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .animate-slideInLeft {
            animation: slideInLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white">
    <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-[2px] pointer-events-none z-0"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // Timezone presets list
        const TIMEZONE_OPTIONS = [
            { label: 'Việt Nam (GMT+7)', zone: 'Asia/Ho_Chi_Minh' },
            { label: 'UTC / Quốc Tế (GMT+0)', zone: 'UTC' },
            { label: 'Nhật Bản / Hàn Quốc (GMT+9)', zone: 'Asia/Tokyo' },
            { label: 'Singapore / Trung Quốc (GMT+8)', zone: 'Asia/Singapore' },
            { label: 'Anh - London (GMT+0/+1)', zone: 'Europe/London' },
            { label: 'Mỹ - New York (GMT-5/-4)', zone: 'America/New_York' },
            { label: 'Mỹ - Los Angeles (GMT-8/-7)', zone: 'America/Los_Angeles' },
            { label: 'Úc - Sydney (GMT+10/+11)', zone: 'Australia/Sydney' }
        ];

        // Background presets
        const BG_PRESETS = [
            { name: 'Mặc định (Tối)', url: '' },
            { name: 'Cyber City', url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Galaxy Stars', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Abstract Blue', url: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Minimal Dark Mesh', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80' }
        ];

        // Default initial funds
        const DEFAULT_FUNDS = [
            { id: 'f1', name: 'Trợ', bankInfo: 'MBB 0001', type: 'vnd', percent: 0, vndAmount: 300000, color: '#3b82f6' },
            { id: 'f2', name: 'Ăn uống', bankInfo: 'MBB 0002', type: 'percent', percent: 40, vndAmount: 0, color: '#10b981' },
            { id: 'f3', name: 'Đi chơi', bankInfo: 'VCB 1001', type: 'percent', percent: 30, vndAmount: 0, color: '#8b5cf6' },
            { id: 'f4', name: 'Dự phòng', bankInfo: 'TCB 1002', type: 'percent', percent: 10, vndAmount: 0, color: '#ec4899' },
            { id: 'f5', name: 'Tiết kiệm', bankInfo: 'TCB 1003', type: 'percent', percent: 20, vndAmount: 0, color: '#f59e0b' }
        ];

        const DEFAULT_WORKSPACES = [
            {
                id: 'ws_default',
                name: 'Cá Nhân',
                funds: DEFAULT_FUNDS,
                history: [],
                bgImage: '',
                timezone: 'Asia/Ho_Chi_Minh'
            }
        ];

        // Format date according to timezone
        const getDateStrInTZ = (tz, dateObj = new Date()) => {
            try {
                const formatter = new Intl.DateTimeFormat('en-CA', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                return formatter.format(dateObj); // YYYY-MM-DD
            } catch (e) {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }
        };

        const getFirstDayOfMonthStrInTZ = (tz) => {
            const dateStr = getDateStrInTZ(tz);
            const parts = dateStr.split('-');
            return `${parts[0]}-${parts[1]}-01`;
        };

        const getTimeStrInTZ = (tz, dateObj = new Date()) => {
            try {
                return new Intl.DateTimeFormat('vi-VN', {
                    timeZone: tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(dateObj);
            } catch (e) {
                return new Date().toLocaleTimeString('vi-VN');
            }
        };

        const formatVND = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0 ₫';
            return new Intl.NumberFormat('vi-VN').format(num) + ' ₫';
        };

        const formatVNDPlain = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return new Intl.NumberFormat('vi-VN').format(num);
        };

        const parseVNDInput = (str) => {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^\d-]/g, '');
            return parseInt(cleaned, 10) || 0;
        };

        const copyToClipboard = (text) => {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            } catch (err) {
                console.error('Copy failed', err);
                return false;
            }
        };

        function App() {
            // Navigation tab: 'input' | 'config' | 'history'
            const [activeTab, setActiveTab] = useState('input');

            // Workspaces & Active Workspace state with local persistence
            const [workspaces, setWorkspaces] = useState(() => {
                const saved = localStorage.getItem('jff_workspaces_v6');
                return saved ? JSON.parse(saved) : DEFAULT_WORKSPACES;
            });

            const [activeWsId, setActiveWsId] = useState(() => {
                const saved = localStorage.getItem('jff_active_ws_v6');
                return saved || 'ws_default';
            });

            // Get current workspace object
            const currentWs = useMemo(() => {
                return workspaces.find(w => w.id === activeWsId) || workspaces[0] || DEFAULT_WORKSPACES[0];
            }, [workspaces, activeWsId]);

            // Real-time clock tick state
            const [nowDate, setNowDate] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setNowDate(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Drawer Sidebar Open state
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);

            // Image Cropper & Adjuster State
            const [imageToAdjust, setImageToAdjust] = useState(null);
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [imgNaturalSize, setImgNaturalSize] = useState({ w: 0, h: 0 });
            const cropContainerRef = useRef(null);

            // Workspace funds & history shorthands
            const funds = currentWs.funds || DEFAULT_FUNDS;
            const history = currentWs.history || [];
            const currentTimezone = currentWs.timezone || 'Asia/Ho_Chi_Minh';
            const currentBgImage = currentWs.bgImage || '';

            // Draft Input & Overrides with persistent local storage
            const [totalIncomeInput, setTotalIncomeInput] = useState(() => {
                return localStorage.getItem('jff_draft_income_v6') || '';
            });

            const [incomeNote, setIncomeNote] = useState('');

            const [overrides, setOverrides] = useState(() => {
                try {
                    const saved = localStorage.getItem('jff_draft_overrides_v6');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            // Save draft input & overrides to local storage whenever changed
            useEffect(() => {
                localStorage.setItem('jff_draft_income_v6', totalIncomeInput);
            }, [totalIncomeInput]);

            useEffect(() => {
                localStorage.setItem('jff_draft_overrides_v6', JSON.stringify(overrides));
            }, [overrides]);

            // Check new day reset logic
            useEffect(() => {
                const todayStr = getDateStrInTZ(currentTimezone, nowDate);
                const lastActiveDate = localStorage.getItem('jff_last_date_v6');

                if (lastActiveDate && lastActiveDate !== todayStr) {
                    setTotalIncomeInput('');
                    setOverrides({});
                    localStorage.setItem('jff_draft_income_v6', '');
                    localStorage.setItem('jff_draft_overrides_v6', '{}');
                    localStorage.setItem('jff_last_date_v6', todayStr);
                } else if (!lastActiveDate) {
                    localStorage.setItem('jff_last_date_v6', todayStr);
                }
            }, [nowDate, currentTimezone]);

            const [undoStack, setUndoStack] = useState([]);
            const [redoStack, setRedoStack] = useState([]);

            const getCurrentStateSnapshot = useCallback((description) => {
                return {
                    workspaces: JSON.parse(JSON.stringify(workspaces)),
                    activeWsId,
                    overrides: { ...overrides },
                    totalIncomeInput,
                    incomeNote,
                    description
                };
            }, [workspaces, activeWsId, overrides, totalIncomeInput, incomeNote]);

            const saveSnapshotForUndo = (description) => {
                const snapshot = getCurrentStateSnapshot(description);
                setUndoStack(prev => [...prev.slice(-9), snapshot]);
                setRedoStack([]);
            };

            const handleUndo = () => {
                if (undoStack.length === 0) return;
                const lastState = undoStack[undoStack.length - 1];
                const currentState = getCurrentStateSnapshot('Trước hoàn tác');

                setUndoStack(prev => prev.slice(0, -1));
                setRedoStack(prev => [...prev.slice(-9), currentState]);

                setWorkspaces(lastState.workspaces);
                setActiveWsId(lastState.activeWsId);
                setOverrides(lastState.overrides);
                setTotalIncomeInput(lastState.totalIncomeInput);
                setIncomeNote(lastState.incomeNote || '');
                showToast(`Đã hoàn tác: ${lastState.description}`, 'success');
            };

            const handleRedo = () => {
                if (redoStack.length === 0) return;
                const nextState = redoStack[redoStack.length - 1];
                const currentState = getCurrentStateSnapshot('Trước khôi phục');

                setRedoStack(prev => prev.slice(0, -1));
                setUndoStack(prev => [...prev.slice(-9), currentState]);

                setWorkspaces(nextState.workspaces);
                setActiveWsId(nextState.activeWsId);
                setOverrides(nextState.overrides);
                setTotalIncomeInput(nextState.totalIncomeInput);
                setIncomeNote(nextState.incomeNote || '');
                showToast(`Đã khôi phục: ${nextState.description}`, 'success');
            };

            useEffect(() => {
                if (imageToAdjust) {
                    const img = new Image();
                    img.onload = () => {
                        setImgNaturalSize({ w: img.width, h: img.height });
                    };
                    img.src = imageToAdjust;
                }
            }, [imageToAdjust]);

            const handleFileSelect = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('Vui lòng chọn file hình ảnh hợp lệ!', 'warning');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    setZoom(1);
                    setPosition({ x: 0, y: 0 });
                    setImageToAdjust(dataUrl);
                    setIsDrawerOpen(false);
                    e.target.value = '';
                };
                reader.readAsDataURL(file);
            };

            const handleMouseDown = (e) => {
                e.preventDefault();
                setIsDragging(true);
                setDragStart({
                    x: e.clientX - position.x,
                    y: e.clientY - position.y
                });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                setPosition({
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleTouchStart = (e) => {
                if (e.touches.length === 1) {
                    setIsDragging(true);
                    setDragStart({
                        x: e.touches[0].clientX - position.x,
                        y: e.touches[0].clientY - position.y
                    });
                }
            };

            const handleTouchMove = (e) => {
                if (isDragging && e.touches.length === 1) {
                    setPosition({
                        x: e.touches[0].clientX - dragStart.x,
                        y: e.touches[0].clientY - dragStart.y
                    });
                }
            };

            const handleTouchEnd = () => {
                setIsDragging(false);
            };

            const applyCroppedImage = () => {
                if (!imageToAdjust) return;
                
                saveSnapshotForUndo('Thay đổi hình nền từ thư viện');
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const targetWidth = 1080;
                    const targetHeight = 1920;
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;

                    ctx.fillStyle = '#0b0f19';
                    ctx.fillRect(0, 0, targetWidth, targetHeight);

                    const containerW = cropContainerRef.current ? cropContainerRef.current.clientWidth : 280;
                    const containerH = cropContainerRef.current ? cropContainerRef.current.clientHeight : 460;

                    const scaleRatio = targetWidth / containerW;

                    const imgAspect = img.width / img.height;
                    const containerAspect = containerW / containerH;
                    let drawW, drawH;
                    if (imgAspect > containerAspect) {
                        drawH = containerH;
                        drawW = containerH * imgAspect;
                    } else {
                        drawW = containerW;
                        drawH = containerW / imgAspect;
                    }

                    const drawW_target = drawW * scaleRatio;
                    const drawH_target = drawH * scaleRatio;

                    ctx.save();
                    ctx.translate(targetWidth / 2 + position.x * scaleRatio, targetHeight / 2 + position.y * scaleRatio);
                    ctx.scale(zoom, zoom);
                    ctx.drawImage(img, -drawW_target / 2, -drawH_target / 2, drawW_target, drawH_target);
                    ctx.restore();

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                    setBgImage(dataUrl);
                    setImageToAdjust(null);
                    showToast('Đã áp dụng hình nền mới thành công!', 'success');
                };
                img.src = imageToAdjust;
            };

            useEffect(() => {
                if (currentBgImage) {
                    document.body.style.backgroundImage = `url("${currentBgImage}")`;
                } else {
                    document.body.style.backgroundImage = 'none';
                    document.body.style.backgroundColor = '#0b0f19';
                }
            }, [currentBgImage]);

            useEffect(() => {
                localStorage.setItem('jff_workspaces_v6', JSON.stringify(workspaces));
            }, [workspaces]);

            useEffect(() => {
                localStorage.setItem('jff_active_ws_v6', activeWsId);
            }, [activeWsId]);

            const [startDate, setStartDate] = useState(() => getFirstDayOfMonthStrInTZ(currentTimezone));
            const [endDate, setEndDate] = useState(() => getDateStrInTZ(currentTimezone));
            const [historySearch, setHistorySearch] = useState('');
            const [expandedHistoryId, setExpandedHistoryId] = useState(null);

            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 2500);
            };

            const updateCurrentWorkspaceData = (updaterFn) => {
                setWorkspaces(prev => prev.map(ws => {
                    if (ws.id === activeWsId) {
                        return updaterFn(ws);
                    }
                    return ws;
                }));
            };

            const setFunds = (newFunds) => {
                updateCurrentWorkspaceData(ws => ({ ...ws, funds: typeof newFunds === 'function' ? newFunds(ws.funds) : newFunds }));
            };

            const setHistory = (newHistory) => {
                updateCurrentWorkspaceData(ws => ({ ...ws, history: typeof newHistory === 'function' ? newHistory(ws.history) : newHistory }));
            };

            const setTimezone = (tz) => {
                saveSnapshotForUndo('Đổi múi giờ sang ' + tz);
                updateCurrentWorkspaceData(ws => ({ ...ws, timezone: tz }));
                setStartDate(getFirstDayOfMonthStrInTZ(tz));
                setEndDate(getDateStrInTZ(tz));
                showToast('Đã đổi múi giờ sang: ' + tz);
            };

            const setBgImage = (imgUrl) => {
                saveSnapshotForUndo('Thay đổi hình nền');
                updateCurrentWorkspaceData(ws => ({ ...ws, bgImage: imgUrl }));
                showToast('Đã cập nhật hình nền!');
            };

            // Workspace Management
            const [newWsNameInput, setNewWsNameInput] = useState('');
            const [showNewWsModal, setShowNewWsModal] = useState(false);

            const handleCreateWorkspace = () => {
                if (!newWsNameInput.trim()) return;
                saveSnapshotForUndo('Tạo Workspace mới');
                const newId = 'ws_' + Date.now();
                const newWs = {
                    id: newId,
                    name: newWsNameInput.trim(),
                    funds: DEFAULT_FUNDS,
                    history: [],
                    bgImage: currentBgImage,
                    timezone: currentTimezone
                };
                setWorkspaces(prev => [...prev, newWs]);
                setActiveWsId(newId);
                setNewWsNameInput('');
                setShowNewWsModal(false);
                showToast(`Đã chuyển sang Workspace: ${newWs.name}`, 'success');
            };

            const handleDeleteWorkspace = (wsId) => {
                if (workspaces.length <= 1) {
                    showToast('Cần giữ lại ít nhất 1 Workspace!', 'warning');
                    return;
                }
                saveSnapshotForUndo('Xóa Workspace');
                setWorkspaces(prev => prev.filter(w => w.id !== wsId));
                if (activeWsId === wsId) {
                    const remaining = workspaces.filter(w => w.id !== wsId);
                    setActiveWsId(remaining[0].id);
                }
                showToast('Đã xóa Workspace thành công!');
            };

            const parsedTotalIncome = useMemo(() => parseVNDInput(totalIncomeInput), [totalIncomeInput]);

            const totalPercentSum = useMemo(() => {
                return funds.reduce((sum, f) => f.type === 'percent' ? sum + (Number(f.percent) || 0) : sum, 0);
            }, [funds]);

            const calculatedAllocations = useMemo(() => {
                const income = parsedTotalIncome;

                let defaultVndSum = 0;
                funds.forEach(f => {
                    if (f.type === 'vnd') {
                        defaultVndSum += (Number(f.vndAmount) || 0);
                    }
                });

                const remainingForPercent = Math.max(0, income - defaultVndSum);

                return funds.map(fund => {
                    let baseAllocated = 0;
                    if (income > 0) {
                        if (fund.type === 'vnd') {
                            baseAllocated = Number(fund.vndAmount) || 0;
                        } else {
                            baseAllocated = Math.round((remainingForPercent * (Number(fund.percent) || 0)) / 100);
                        }
                    }

                    const isOverridden = overrides[fund.id] !== undefined;
                    const finalAmount = isOverridden ? overrides[fund.id] : baseAllocated;

                    return {
                        ...fund,
                        baseAllocated,
                        finalAmount,
                        isOverridden
                    };
                });
            }, [funds, parsedTotalIncome, overrides]);

            const [editingFundOverride, setEditingFundOverride] = useState(null);
            const [overrideInputValue, setOverrideInputValue] = useState('');

            const openFundOverrideModal = (fund, currentFinalAmount) => {
                setEditingFundOverride(fund);
                setOverrideInputValue(formatVNDPlain(currentFinalAmount));
            };

            const applyFundOverride = () => {
                if (!editingFundOverride) return;
                saveSnapshotForUndo('Chốt thủ công quỹ ' + editingFundOverride.name);
                const numVal = parseVNDInput(overrideInputValue);
                setOverrides(prev => ({
                    ...prev,
                    [editingFundOverride.id]: numVal
                }));
                setEditingFundOverride(null);
                showToast(`Đã chốt ${editingFundOverride.name}: ${formatVND(numVal)}`, 'success');
            };

            const resetFundOverride = (fundId, fundName) => {
                saveSnapshotForUndo('Bỏ chốt thủ công ' + fundName);
                setOverrides(prev => {
                    const next = { ...prev };
                    delete next[fundId];
                    return next;
                });
                showToast(`Đã đặt lại tự động cho ${fundName}`);
            };

            const handleCopyBankInfo = (info, fundName) => {
                if (!info) return;
                if (copyToClipboard(info)) {
                    showToast(`Đã chép STK [${fundName}]: ${info}`, 'success');
                } else {
                    showToast(`Không thể tự động chép: ${info}`, 'warning');
                }
            };

            const handleRecordAllocation = () => {
                if (parsedTotalIncome <= 0) {
                    showToast('Vui lòng nhập Tổng Thu Nhập > 0', 'warning');
                    return;
                }

                saveSnapshotForUndo('Ghi nhận thu nhập');

                const dateStr = getDateStrInTZ(currentTimezone, nowDate);
                const timeStr = getTimeStrInTZ(currentTimezone, nowDate);

                const record = {
                    id: 'rec_' + Date.now(),
                    date: dateStr,
                    timestamp: `${dateStr} ${timeStr}`,
                    totalIncome: parsedTotalIncome,
                    note: incomeNote.trim() || 'Thu nhập',
                    allocations: calculatedAllocations.map(a => ({
                        fundId: a.id,
                        fundName: a.name,
                        bankInfo: a.bankInfo,
                        amount: a.finalAmount
                    }))
                };

                setHistory(prev => [record, ...prev]);
                showToast('Đã lưu lịch sử phân bổ thành công!', 'success');
            };

            const handleDeleteHistoryItem = (recId) => {
                saveSnapshotForUndo('Xóa lịch sử ghi nhận');
                setHistory(prev => prev.filter(item => item.id !== recId));
                showToast('Đã xóa 1 bản ghi lịch sử');
            };

            const [showBackupModal, setShowBackupModal] = useState(false);
            const [jsonBackupText, setJsonBackupText] = useState('');

            const getFullBackupData = () => {
                return {
                    version: 'v6_all',
                    exportDate: new Date().toISOString(),
                    workspaces,
                    activeWsId
                };
            };

            const handleOpenBackupModal = () => {
                setJsonBackupText(JSON.stringify(getFullBackupData(), null, 2));
                setShowBackupModal(true);
            };

            const handleDownloadJsonFile = () => {
                try {
                    const data = getFullBackupData();
                    const jsonString = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonString], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = getDateStrInTZ(currentTimezone);
                    a.href = url;
                    a.download = `JFF_Backup_${dateStr}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Đã tải xuống file JSON thành công!', 'success');
                } catch (e) {
                    showToast('Lỗi khi tải xuống file JSON!', 'warning');
                }
            };

            const handleJsonFileUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && Array.isArray(parsed.workspaces)) {
                            saveSnapshotForUndo('Nhập dữ liệu từ file JSON');
                            setWorkspaces(parsed.workspaces);
                            if (parsed.activeWsId) setActiveWsId(parsed.activeWsId);
                            setShowBackupModal(false);
                            showToast('Đã nhập thành công tất cả Workspaces từ file JSON!', 'success');
                        } else if (parsed && Array.isArray(parsed.funds)) {
                            saveSnapshotForUndo('Nhập dữ liệu Workspace từ file JSON');
                            updateCurrentWorkspaceData(ws => ({
                                ...ws,
                                funds: parsed.funds,
                                history: Array.isArray(parsed.history) ? parsed.history : ws.history
                            }));
                            setShowBackupModal(false);
                            showToast('Đã nhập dữ liệu cho Workspace hiện tại từ file JSON!', 'success');
                        } else {
                            showToast('Cấu trúc file JSON không hợp lệ!', 'warning');
                        }
                    } catch (err) {
                        showToast('Không thể đọc file JSON, vui lòng kiểm tra định dạng!', 'warning');
                    }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleImportDataFromText = () => {
                try {
                    const parsed = JSON.parse(jsonBackupText);
                    if (parsed && Array.isArray(parsed.workspaces)) {
                        saveSnapshotForUndo('Khôi phục dữ liệu từ chuỗi văn bản JSON');
                        setWorkspaces(parsed.workspaces);
                        if (parsed.activeWsId) setActiveWsId(parsed.activeWsId);
                        setShowBackupModal(false);
                        showToast('Đã khôi phục toàn bộ dữ liệu thành công!', 'success');
                    } else if (parsed && Array.isArray(parsed.funds)) {
                        saveSnapshotForUndo('Khôi phục dữ liệu Workspace từ văn bản JSON');
                        updateCurrentWorkspaceData(ws => ({
                            ...ws,
                            funds: parsed.funds,
                            history: Array.isArray(parsed.history) ? parsed.history : ws.history
                        }));
                        setShowBackupModal(false);
                        showToast('Đã khôi phục dữ liệu cho Workspace hiện tại!', 'success');
                    } else {
                        showToast('Cấu trúc chuỗi JSON không hợp lệ!', 'warning');
                    }
                } catch (e) {
                    showToast('Định dạng JSON bị lỗi, vui lòng kiểm tra!', 'warning');
                }
            };

            const filteredHistory = useMemo(() => {
                return history.filter(item => {
                    const itemDate = item.date;
                    if (startDate && itemDate < startDate) return false;
                    if (endDate && itemDate > endDate) return false;
                    
                    if (historySearch.trim()) {
                        const term = historySearch.toLowerCase();
                        const matchNote = (item.note || '').toLowerCase().includes(term);
                        const matchFunds = item.allocations?.some(a => a.fundName.toLowerCase().includes(term));
                        if (!matchNote && !matchFunds) return false;
                    }

                    return true;
                });
            }, [history, startDate, endDate, historySearch]);

            const historyAggregatedData = useMemo(() => {
                let grandTotalIncome = 0;
                
                const fundTotalsMap = {};
                funds.forEach(f => {
                    fundTotalsMap[f.id] = {
                        id: f.id,
                        name: f.name,
                        bankInfo: f.bankInfo,
                        color: f.color,
                        totalAmount: 0
                    };
                });

                let legacyTotal = 0;

                filteredHistory.forEach(rec => {
                    grandTotalIncome += (Number(rec.totalIncome) || 0);
                    if (Array.isArray(rec.allocations)) {
                        rec.allocations.forEach(alloc => {
                            const allocAmt = Number(alloc.amount) || 0;
                            if (fundTotalsMap[alloc.fundId]) {
                                fundTotalsMap[alloc.fundId].totalAmount += allocAmt;
                            } else {
                                const matched = funds.find(f => f.name.trim().toLowerCase() === (alloc.fundName || '').trim().toLowerCase());
                                if (matched && fundTotalsMap[matched.id]) {
                                    fundTotalsMap[matched.id].totalAmount += allocAmt;
                                } else {
                                    legacyTotal += allocAmt;
                                }
                            }
                        });
                    }
                });

                const activeFundList = funds.map(f => fundTotalsMap[f.id]);

                if (legacyTotal > 0) {
                    activeFundList.push({
                        id: 'legacy_other',
                        name: 'Khác (Quỹ cũ)',
                        bankInfo: 'Dữ liệu cũ',
                        color: '#6b7280',
                        totalAmount: legacyTotal
                    });
                }

                return {
                    grandTotalIncome,
                    count: filteredHistory.length,
                    activeFundList
                };
            }, [filteredHistory, funds]);

            const moveFundOrder = (index, direction) => {
                saveSnapshotForUndo('Thay đổi thứ tự quỹ');
                const newFunds = [...funds];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newFunds.length) return;
                const temp = newFunds[index];
                newFunds[index] = newFunds[targetIndex];
                newFunds[targetIndex] = temp;
                setFunds(newFunds);
            };

            const handleUpdateFundConfig = (id, field, value) => {
                saveSnapshotForUndo('Cập nhật cài đặt quỹ');
                setFunds(prev => prev.map(f => f.id === id ? { ...f, [field]: value } : f));
            };

            const handleAddNewFund = () => {
                saveSnapshotForUndo('Thêm quỹ mới');
                const newFund = {
                    id: 'f_' + Date.now(),
                    name: 'Quỹ Mới',
                    bankInfo: 'Thông tin TK',
                    type: 'percent',
                    percent: 10,
                    vndAmount: 100000,
                    color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')
                };
                setFunds(prev => [...prev, newFund]);
                showToast('Đã thêm quỹ mới!');
            };

            const handleDeleteFund = (id) => {
                if (funds.length <= 1) {
                    showToast('Phải giữ lại ít nhất 1 quỹ!', 'warning');
                    return;
                }
                saveSnapshotForUndo('Xóa quỹ');
                setFunds(prev => prev.filter(f => f.id !== id));
                showToast('Đã xóa quỹ!');
            };

            return (
                <div className="max-w-md mx-auto w-full pb-28 pt-4 px-4 min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Header Bar */}
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2.5">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 flex items-center justify-center text-cyan-400 font-bold shadow-lg transition-all active:scale-95"
                                    title="Mở menu quản lý Workspace / Cài đặt"
                                >
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>

                                <div>
                                    <div className="flex items-center gap-1.5">
                                        <h1 className="font-black text-base text-white tracking-tight">Jiro Financial</h1>
                                        <span className="text-[10px] bg-cyan-950/90 border border-cyan-800/80 text-cyan-300 font-bold px-2 py-0.2 rounded-full">
                                            {currentWs.name}
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-cyan-400 font-medium">Tự Do Tài Chính</p>
                                </div>
                            </div>

                            <div className="text-right">
                                <div className="inline-flex flex-col items-end px-2.5 py-1 rounded-xl bg-slate-900/90 border border-slate-800">
                                    <span className="text-xs font-black text-cyan-400 font-mono tracking-wide">
                                        {getTimeStrInTZ(currentTimezone, nowDate)}
                                    </span>
                                    <span className="text-[9px] text-slate-400 font-medium">
                                        {getDateStrInTZ(currentTimezone, nowDate)}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Toast Notification */}
                        {toastMessage && (
                            <div className={`mb-4 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all animate-bounce shadow-xl ${
                                toastMessage.type === 'warning' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                toastMessage.type === 'success' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                                'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                            }`}>
                                <i className="fa-solid fa-circle-info"></i>
                                <span>{toastMessage.msg}</span>
                            </div>
                        )}

                        {}
                        {activeTab === 'input' && (
                            <div className="space-y-4 animate-fadeIn">
                                {/* Income Card */}
                                <div className="glass-panel p-4 rounded-2xl relative overflow-hidden glow-effect space-y-3">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                    
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-bold text-cyan-300 uppercase tracking-wider">
                                            Nhập Tổng Thu Nhập
                                        </label>
                                        {parsedTotalIncome > 0 && (
                                            <button 
                                                onClick={() => setTotalIncomeInput('')}
                                                className="text-[11px] text-slate-400 hover:text-rose-400"
                                            >
                                                Xóa số tiền
                                            </button>
                                        )}
                                    </div>

                                    <div className="relative flex items-center">
                                        <input 
                                            type="text"
                                            inputMode="numeric"
                                            placeholder="0"
                                            value={totalIncomeInput}
                                            onChange={(e) => {
                                                const rawVal = e.target.value.replace(/[^\d]/g, '');
                                                if (!rawVal) {
                                                    setTotalIncomeInput('');
                                                    return;
                                                }
                                                setTotalIncomeInput(formatVNDPlain(parseInt(rawVal, 10)));
                                            }}
                                            className="w-full bg-slate-900/90 text-2xl font-black text-cyan-400 px-4 py-2.5 rounded-xl border border-cyan-500/30 focus:border-cyan-400 focus:outline-none transition-all placeholder-slate-600"
                                        />
                                        <span className="absolute right-4 text-cyan-500 font-bold text-lg">₫</span>
                                    </div>

                                    <div>
                                        <label className="text-[10px] text-slate-400 font-semibold uppercase block mb-1">
                                            Ghi chú / Nguồn thu (Không bắt buộc)
                                        </label>
                                        <input 
                                            type="text"
                                            placeholder="Lương, Thưởng, Chuyển khoản..."
                                            value={incomeNote}
                                            onChange={(e) => setIncomeNote(e.target.value)}
                                            className="w-full bg-slate-900/80 text-xs text-slate-200 px-3 py-1.5 rounded-lg border border-slate-800 focus:border-cyan-500/50 focus:outline-none"
                                        />
                                    </div>

                                    {parsedTotalIncome > 0 && (
                                        <div className="space-y-1.5 pt-1">
                                            <div className="flex justify-between text-[10px] text-slate-400">
                                                <span>Tỷ lệ phân bổ thực tế</span>
                                                <span>100%</span>
                                            </div>
                                            <div className="h-2.5 w-full bg-slate-900 rounded-full overflow-hidden flex">
                                                {calculatedAllocations.map(f => {
                                                    const pct = parsedTotalIncome > 0 ? (f.finalAmount / parsedTotalIncome) * 100 : 0;
                                                    if (pct <= 0) return null;
                                                    return (
                                                        <div 
                                                            key={f.id} 
                                                            style={{ width: `${pct}%`, backgroundColor: f.color }}
                                                            title={`${f.name}: ${pct.toFixed(1)}%`}
                                                            className="h-full transition-all"
                                                        />
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs text-slate-400">
                                        <span>Đang phân bổ cho: <strong className="text-white">{funds.length} quỹ</strong></span>
                                        {Object.keys(overrides).length > 0 && (
                                            <button 
                                                onClick={() => {
                                                    saveSnapshotForUndo('Xóa tất cả chốt thủ công');
                                                    setOverrides({});
                                                    showToast('Đã xóa tất cả chốt thủ công');
                                                }}
                                                className="text-amber-400 hover:text-amber-300 font-medium text-[11px] underline"
                                            >
                                                Đặt lại tất cả tự động
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {}
                                <div className="space-y-2.5">
                                    <div className="flex justify-between items-center text-xs font-semibold text-slate-400 px-1">
                                        <span>DANH SÁCH QUỸ</span>
                                        <span className="text-[11px] text-slate-500">Bấm số tiền để chốt | STK để Copy</span>
                                    </div>

                                    {calculatedAllocations.map((fund, idx) => (
                                        <div 
                                            key={fund.id}
                                            className="glass-card p-3 rounded-xl flex items-center justify-between gap-3 hover:border-slate-600 transition-all group relative overflow-hidden"
                                            style={{ borderLeft: `4px solid ${fund.color}` }}
                                        >
                                            <div className="flex flex-col gap-1 text-slate-500 text-xs">
                                                <button 
                                                    onClick={() => moveFundOrder(idx, -1)}
                                                    disabled={idx === 0}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển lên"
                                                >
                                                    <i className="fa-solid fa-chevron-up"></i>
                                                </button>
                                                <button 
                                                    onClick={() => moveFundOrder(idx, 1)}
                                                    disabled={idx === funds.length - 1}
                                                    className="hover:text-cyan-400 disabled:opacity-20 p-0.5"
                                                    title="Di chuyển xuống"
                                                >
                                                    <i className="fa-solid fa-chevron-down"></i>
                                                </button>
                                            </div>

                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-slate-100 truncate">{fund.name}</span>
                                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700/50">
                                                        {fund.type === 'vnd' ? `${formatVNDPlain(fund.vndAmount)}đ` : `${fund.percent}%`}
                                                    </span>
                                                </div>
                                                <button 
                                                    onClick={() => handleCopyBankInfo(fund.bankInfo, fund.name)}
                                                    className="text-xs text-slate-400 hover:text-cyan-300 truncate mt-0.5 flex items-center gap-1.5 text-left group-hover:underline"
                                                    title="Bấm để sao chép thông tin tài khoản"
                                                >
                                                    <span>{fund.bankInfo || 'Chưa có STK'}</span>
                                                    <i className="fa-regular fa-copy text-[10px] opacity-60"></i>
                                                </button>
                                            </div>

                                            <div className="text-right cursor-pointer" onClick={() => openFundOverrideModal(fund, fund.finalAmount)}>
                                                <div className="font-extrabold text-sm text-emerald-400">
                                                    {formatVND(fund.finalAmount)}
                                                </div>
                                                {fund.isOverridden ? (
                                                    <div className="flex items-center justify-end gap-1 mt-0.5">
                                                        <span className="text-[10px] font-bold text-amber-400 bg-amber-400/10 px-1.5 py-0.2 rounded border border-amber-400/30">
                                                            Đã chốt
                                                        </span>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                resetFundOverride(fund.id, fund.name);
                                                            }}
                                                            className="text-[10px] text-slate-400 hover:text-rose-400 p-0.5"
                                                            title="Bỏ chốt"
                                                        >
                                                            <i className="fa-solid fa-xmark"></i>
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <span className="text-[10px] text-slate-500">Tự động</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'config' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="flex justify-between items-center mb-1">
                                    <div>
                                        <h2 className="text-base font-bold text-white">Cấu Hình Quỹ ({currentWs.name})</h2>
                                        <p className="text-xs text-slate-400">Tổng tỷ lệ % hiện tại: <strong className={totalPercentSum === 100 ? "text-emerald-400" : "text-amber-400"}>{totalPercentSum}%</strong></p>
                                    </div>
                                    <button 
                                        onClick={handleAddNewFund}
                                        className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-md shadow-cyan-600/30"
                                    >
                                        <i className="fa-solid fa-plus"></i> Thêm Quỹ
                                    </button>
                                </div>

                                {totalPercentSum !== 100 && (
                                    <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                        <span>Tổng các quỹ theo % đang là <strong>{totalPercentSum}%</strong> (Khuyến nghị 100%).</span>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {funds.map((f, i) => (
                                        <div key={f.id} className="glass-panel p-3.5 rounded-xl space-y-3">
                                            <div className="flex items-center justify-between gap-2">
                                                <div className="flex items-center gap-2 flex-1">
                                                    <input 
                                                        type="color" 
                                                        value={f.color || '#3b82f6'} 
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'color', e.target.value)}
                                                        className="w-6 h-6 rounded border-0 bg-transparent cursor-pointer"
                                                    />
                                                    <input 
                                                        type="text" 
                                                        value={f.name}
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'name', e.target.value)}
                                                        className="bg-slate-900 border border-slate-700 text-white font-bold text-sm px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500"
                                                        placeholder="Tên quỹ"
                                                    />
                                                </div>

                                                <button 
                                                    onClick={() => handleDeleteFund(f.id)}
                                                    className="text-slate-500 hover:text-rose-400 p-1 text-sm"
                                                    title="Xóa quỹ"
                                                >
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2 text-xs">
                                                <div>
                                                    <label className="text-slate-400 text-[10px] block mb-1">Thông tin TK / Ghi chú</label>
                                                    <input 
                                                        type="text" 
                                                        value={f.bankInfo}
                                                        onChange={(e) => handleUpdateFundConfig(f.id, 'bankInfo', e.target.value)}
                                                        className="bg-slate-900 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500"
                                                        placeholder="Ví dụ: MBB 0001"
                                                    />
                                                </div>

                                                <div>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <label className="text-slate-400 text-[10px]">Đơn vị tính</label>
                                                        <div className="flex text-[10px] border border-slate-700 rounded overflow-hidden">
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleUpdateFundConfig(f.id, 'type', 'percent')}
                                                                className={`px-1.5 py-0.5 ${f.type === 'percent' ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400'}`}
                                                            >
                                                                %
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleUpdateFundConfig(f.id, 'type', 'vnd')}
                                                                className={`px-1.5 py-0.5 ${f.type === 'vnd' ? 'bg-cyan-600 text-white font-bold' : 'bg-slate-800 text-slate-400'}`}
                                                            >
                                                                ₫
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {f.type === 'percent' ? (
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="number" 
                                                                value={f.percent}
                                                                onChange={(e) => handleUpdateFundConfig(f.id, 'percent', Number(e.target.value) || 0)}
                                                                className="bg-slate-900 border border-slate-700 text-cyan-400 font-bold text-xs px-2.5 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500 pr-6"
                                                            />
                                                            <span className="absolute right-2 text-slate-500 text-xs">%</span>
                                                        </div>
                                                    ) : (
                                                        <div className="relative flex items-center">
                                                            <input 
                                                                type="text" 
                                                                value={formatVNDPlain(f.vndAmount)}
                                                                onChange={(e) => handleUpdateFundConfig(f.id, 'vndAmount', parseVNDInput(e.target.value))}
                                                                className="bg-slate-900 border border-slate-700 text-cyan-400 font-bold text-xs px-2 py-1 rounded-lg w-full focus:outline-none focus:border-cyan-500 pr-5"
                                                            />
                                                            <span className="absolute right-1.5 text-slate-500 text-[10px]">₫</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'history' && (
                            <div className="space-y-4 animate-fadeIn">
                                <div className="glass-panel p-3.5 rounded-xl space-y-3">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-semibold text-slate-300 mb-1 block uppercase">Từ ngày</label>
                                            <input 
                                                type="date" 
                                                value={startDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-semibold text-slate-300 mb-1 block uppercase">Đến ngày</label>
                                            <input 
                                                type="date" 
                                                value={endDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 text-white text-xs px-2.5 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="relative flex items-center">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3 text-slate-500 text-xs"></i>
                                        <input 
                                            type="text"
                                            placeholder="Tìm kiếm theo ghi chú hoặc tên quỹ..."
                                            value={historySearch}
                                            onChange={(e) => setHistorySearch(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs pl-8 pr-3 py-1.5 rounded-lg focus:outline-none focus:border-cyan-500"
                                        />
                                        {historySearch && (
                                            <button 
                                                onClick={() => setHistorySearch('')}
                                                className="absolute right-2.5 text-slate-500 hover:text-white text-xs"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        )}
                                    </div>

                                    <div className="flex gap-2 pt-1">
                                        <button 
                                            onClick={() => {
                                                setStartDate(getFirstDayOfMonthStrInTZ(currentTimezone));
                                                setEndDate(getDateStrInTZ(currentTimezone));
                                                setHistorySearch('');
                                                showToast('Đã tra cứu theo Tháng Hiện Tại');
                                            }}
                                            className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg flex items-center justify-center gap-1"
                                        >
                                            <i className="fa-solid fa-calendar-day text-cyan-400"></i> Tháng này
                                        </button>
                                        <button 
                                            onClick={() => showToast(`Tìm thấy ${filteredHistory.length} bản ghi`)}
                                            className="flex-1 py-1.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-bold rounded-lg shadow-md shadow-cyan-600/20 flex items-center justify-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-filter"></i> Lọc Kết Quả
                                        </button>
                                    </div>
                                </div>

                                <div className="glass-panel p-4 rounded-xl border border-cyan-500/20 space-y-3">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">THỐNG KÊ TỔNG HỢP TRONG KHOẢNG THỜI GIAN</p>
                                        <div className="flex items-baseline justify-between mt-1">
                                            <h3 className="text-xl font-black text-cyan-400">
                                                {formatVND(historyAggregatedData.grandTotalIncome)}
                                            </h3>
                                            <span className="text-xs bg-cyan-950/80 border border-cyan-800/50 text-cyan-300 px-2 py-0.5 rounded-full font-medium">
                                                {historyAggregatedData.count} lần ghi nhận
                                            </span>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-2">TỔNG SỐ TIỀN CHI TIẾT CỦA TỪNG QUỸ:</p>
                                        <div className="grid grid-cols-3 gap-1.5">
                                            {historyAggregatedData.activeFundList.map(fund => (
                                                <div 
                                                    key={fund.id} 
                                                    className="bg-slate-900/90 p-2 rounded-lg border border-slate-800/80 text-left min-w-0"
                                                    style={{ borderTop: `2px solid ${fund.color}` }}
                                                >
                                                    <p className="text-[10px] text-slate-400 font-semibold truncate" title={fund.name}>
                                                        {fund.name}
                                                    </p>
                                                    <p className="text-[11px] font-extrabold text-white truncate mt-0.5" title={formatVND(fund.totalAmount)}>
                                                        {formatVND(fund.totalAmount)}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-slate-400 px-1 uppercase">CHI TIẾT CÁC NGÀY GHI NHẬN ({filteredHistory.length})</p>
                                    
                                    {filteredHistory.length === 0 ? (
                                        <div className="text-center py-8 glass-panel rounded-xl text-slate-500 text-xs">
                                            Không có lịch sử phân bổ nào trong khoảng thời gian này.
                                        </div>
                                    ) : (
                                        filteredHistory.map(rec => {
                                            const isExpanded = expandedHistoryId === rec.id;
                                            return (
                                                <div key={rec.id} className="glass-card rounded-xl overflow-hidden border border-slate-800">
                                                    <div 
                                                        onClick={() => setExpandedHistoryId(isExpanded ? null : rec.id)}
                                                        className="p-3 flex items-center justify-between cursor-pointer hover:bg-slate-800/50 transition-colors"
                                                    >
                                                        <div className="flex items-center gap-2.5 min-w-0">
                                                            <button className="text-slate-400 text-xs p-1">
                                                                <i className={`fa-solid ${isExpanded ? 'fa-chevron-up text-cyan-400' : 'fa-chevron-down'}`}></i>
                                                            </button>
                                                            <div className="min-w-0">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-bold text-xs text-slate-200">{rec.date}</span>
                                                                    <span className="text-[10px] text-slate-500">{rec.timestamp.split(' ')[1] || ''}</span>
                                                                    {rec.note && (
                                                                        <span className="text-[10px] bg-slate-800 text-cyan-300 px-1.5 py-0.2 rounded border border-slate-700 truncate max-w-[100px]">
                                                                            {rec.note}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <p className="text-xs font-bold text-emerald-400 mt-0.5">
                                                                    Tổng thu: {formatVND(rec.totalIncome)}
                                                                </p>
                                                            </div>
                                                        </div>

                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDeleteHistoryItem(rec.id);
                                                            }}
                                                            className="text-slate-500 hover:text-rose-400 p-2 text-xs"
                                                            title="Xóa bản ghi này"
                                                        >
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    </div>

                                                    {isExpanded && (
                                                        <div className="bg-slate-950/70 p-3 border-t border-slate-800/80 space-y-1.5 animate-fadeIn">
                                                            {rec.allocations.map((alloc, idx) => (
                                                                <div key={idx} className="flex justify-between items-center text-xs py-1 border-b border-slate-800/40 last:border-0">
                                                                    <div className="flex flex-col">
                                                                        <span className="text-slate-300 font-medium">{alloc.fundName}</span>
                                                                        {alloc.bankInfo && <span className="text-[10px] text-slate-500">{alloc.bankInfo}</span>}
                                                                    </div>
                                                                    <span className="text-emerald-400 font-bold">{formatVND(alloc.amount)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {}
                    {isDrawerOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div 
                                onClick={() => setIsDrawerOpen(false)}
                                className="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity"
                            ></div>

                            <div className="relative w-4/5 max-w-xs bg-slate-900 border-r border-slate-800 text-slate-200 h-full p-4 overflow-y-auto space-y-6 shadow-2xl z-10 animate-slideInLeft flex flex-col justify-between">
                                <div className="space-y-5">
                                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                                        <div className="flex items-center gap-2">
                                            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-sm">
                                                J
                                            </div>
                                            <div>
                                                <h2 className="font-bold text-sm text-white">Menu Quản Lý</h2>
                                                <p className="text-[10px] text-slate-400">Jiro Financial Freedom</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setIsDrawerOpen(false)}
                                            className="text-slate-400 hover:text-white p-1"
                                        >
                                            <i className="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    <div className="space-y-2">
