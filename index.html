<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF - Jiro Financial Freedom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- CropperJS CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Default initial profile
        const DEFAULT_PROFILES = [
            {
                id: 'default-6-jars',
                name: 'Giao Diện 1 (6 Quỹ Mặc Định)',
                funds: [
                    { id: '1', name: 'Nhu cầu thiết yếu (NEC)', percent: 55, color: '#ef4444' },
                    { id: '2', name: 'Tự do tài chính (FFA)', percent: 10, color: '#3b82f6' },
                    { id: '3', name: 'Tiết kiệm dài hạn (LTSS)', percent: 10, color: '#10b981' },
                    { id: '4', name: 'Học tập & Phát triển (EDU)', percent: 10, color: '#f59e0b' },
                    { id: '5', name: 'Hưởng thụ (PLAY)', percent: 10, color: '#ec4899' },
                    { id: '6', name: 'Cho đi (GIVE)', percent: 5, color: '#8b5cf6' }
                ]
            }
        ];

        const DEFAULT_RULES = [
            { id: '1', title: '1. Kỷ luật nhất quán', content: 'Ngay khi nhận được bất kỳ nguồn thu nhập nào (lương, thưởng, kinh doanh), hãy chia ngay lập tức theo đúng tỷ lệ % các quỹ.', color: '#3b82f6' },
            { id: '2', title: '2. Quỹ tự do tài chính (FFA) là con gà đẻ trứng vàng', content: 'Tuyệt đối không dùng quỹ FFA cho các mục đích chi tiêu sinh hoạt. Quỹ này chỉ dùng để đầu tư sinh lời và tích lũy tài sản.', color: '#10b981' },
            { id: '3', title: '3. Hưởng thụ không tội lỗi (PLAY)', content: 'Quỹ PLAY giúp tinh thần bạn luôn thoải mái. Hãy tiêu hết tiền quỹ PLAY mỗi tháng hoặc mỗi quý cho các hoạt động nâng cao chất lượng sống.', color: '#ec4899' }
        ];

        // Preset theme colors
        const COLOR_PRESETS = [
            { name: 'Xanh Lam', hex: '#3b82f6' },
            { name: 'Xanh Lục', hex: '#10b981' },
            { name: 'Tím Huyền Bí', hex: '#8b5cf6' },
            { name: 'Hồng Rạng Rỡ', hex: '#ec4899' },
            { name: 'Cam Năng Lượng', hex: '#f97316' },
            { name: 'Đỏ Đam Mê', hex: '#ef4444' },
            { name: 'Vàng Hoàng Kim', hex: '#eab308' },
            { name: 'Xanh Cổ Vịt', hex: '#06b6d4' }
        ];

        const GMT_OPTIONS = [];
        for (let i = -12; i <= 14; i++) {
            const sign = i > 0 ? '+' : '';
            GMT_OPTIONS.push({ value: i, label: `GMT ${sign}${i}` });
        }

        // Format VND helper
        const formatVND = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return '0 ₫';
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        };

        const getTZDate = (offset) => {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * offset));
        };

        const formatTZDate = (tzDate) => {
            const year = tzDate.getFullYear();
            const month = String(tzDate.getMonth() + 1).padStart(2, '0');
            const day = String(tzDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatTZTime = (tzDate) => {
            return tzDate.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        };

        // Hàm định dạng số có dấu chấm ngắt nghìn và cho phép số âm
        const formatVNDInput = (val) => {
            if (val === undefined || val === null) return '';
            let strVal = String(val);
            let isNegative = strVal.startsWith('-');
            let digitsOnly = strVal.replace(/[^\d]/g, '');
            if (digitsOnly === '') return isNegative ? '-' : '';
            digitsOnly = digitsOnly.replace(/^0+/, '');
            if (digitsOnly === '') digitsOnly = '0';
            let formatted = digitsOnly.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return isNegative ? '-' + formatted : formatted;
        };

        // Hàm parse chuỗi định dạng về lại số nguyên để tính toán
        const parseFormattedNumber = (val) => {
            if (!val) return 0;
            return Number(String(val).replace(/[^\d-]/g, '')) || 0;
        };

        function App() {
            const [profiles, setProfiles] = useState(() => {
                const saved = localStorage.getItem('jff_profiles_v3');
                return saved ? JSON.parse(saved) : DEFAULT_PROFILES;
            });

            const [activeProfileId, setActiveProfileId] = useState(() => {
                const saved = localStorage.getItem('jff_active_profile_id_v3');
                return saved || DEFAULT_PROFILES[0].id;
            });

            const [historyData, setHistoryData] = useState(() => {
                const saved = localStorage.getItem('jff_history_v3');
                return saved ? JSON.parse(saved) : [];
            });

            const [rules, setRules] = useState(() => {
                const saved = localStorage.getItem('jff_rules_v3');
                return saved ? JSON.parse(saved) : DEFAULT_RULES;
            });

            const [themeColor, setThemeColor] = useState(() => {
                return localStorage.getItem('jff_theme_color_v3') || '#3b82f6';
            });

            const [glassOpacity, setGlassOpacity] = useState(() => {
                return Number(localStorage.getItem('jff_glass_opacity_v3')) || 25;
            });

            const [glassBlur, setGlassBlur] = useState(() => {
                return Number(localStorage.getItem('jff_glass_blur_v3')) || 12;
            });

            const [bgImage, setBgImage] = useState(() => {
                return localStorage.getItem('jff_bg_image_v3') || '';
            });

            // Tự động nhận diện GMT mặc định của trình duyệt hoặc lấy dữ liệu đã lưu
            const [gmtOffset, setGmtOffset] = useState(() => {
                const saved = localStorage.getItem('jff_gmt_offset_v3');
                return saved !== null ? Number(saved) : (-(new Date().getTimezoneOffset() / 60));
            });

            const [currentTZDate, setCurrentTZDate] = useState(() => {
                return localStorage.getItem('jff_last_date_v3') || '';
            });

            const [realTime, setRealTime] = useState('--:--:--');

            // Navigation & Modal States
            const [activeTab, setActiveTab] = useState('input');
            const [incomeInput, setIncomeInput] = useState(() => {
                const saved = localStorage.getItem('jff_current_income_v3') || '';
                return saved ? formatVNDInput(saved) : '';
            });
            const [showSettings, setShowSettings] = useState(false);
            const [showNewProfileModal, setShowNewProfileModal] = useState(false);
            const [showSwitchProfileModal, setShowSwitchProfileModal] = useState(false);
            const [showColorPickerModal, setShowColorPickerModal] = useState(false);
            const [tempCustomColor, setTempCustomColor] = useState('#3b82f6');
            const [newProfileName, setNewProfileName] = useState('');
            const [toast, setToast] = useState(null);

            // Manual Fund Additions
            const [fundAdditions, setFundAdditions] = useState(() => {
                const saved = localStorage.getItem('jff_fund_additions_v3');
                return saved ? JSON.parse(saved) : {};
            });
            const [activeFundForManual, setActiveFundForManual] = useState(null);
            const [manualAmountInput, setManualAmountInput] = useState('');

            // States for Editing Rules & Deleting Profile
            const [editingRuleId, setEditingRuleId] = useState(null);
            const [tempRule, setTempRule] = useState(null);
            const [profileToDelete, setProfileToDelete] = useState(null);

            // History Date Range Filters (Default to today)
            const [fromDate, setFromDate] = useState(() => {
                const savedGmt = localStorage.getItem('jff_gmt_offset_v3');
                const gmt = savedGmt !== null ? Number(savedGmt) : (-(new Date().getTimezoneOffset() / 60));
                return formatTZDate(getTZDate(gmt));
            });
            const [toDate, setToDate] = useState(() => {
                const savedGmt = localStorage.getItem('jff_gmt_offset_v3');
                const gmt = savedGmt !== null ? Number(savedGmt) : (-(new Date().getTimezoneOffset() / 60));
                return formatTZDate(getTZDate(gmt));
            });

            // Expanded history record items
            const [expandedRecordIds, setExpandedRecordIds] = useState({});

            // Image Cropper States
            const [tempImage, setTempImage] = useState(null);
            const [cropAspectRatio, setCropAspectRatio] = useState(NaN);
            const imageRef = useRef(null);
            const cropperRef = useRef(null);

            // Refs để giữ state mới nhất cho hàm chạy ngầm (tránh stale closures)
            const incomeRef = useRef(incomeInput);
            const profileRef = useRef(activeProfileId);
            const profilesRef = useRef(profiles);
            const dateRef = useRef(currentTZDate);
            const additionsRef = useRef(fundAdditions);
            
            useEffect(() => { incomeRef.current = incomeInput; }, [incomeInput]);
            useEffect(() => { profileRef.current = activeProfileId; }, [activeProfileId]);
            useEffect(() => { profilesRef.current = profiles; }, [profiles]);
            useEffect(() => { dateRef.current = currentTZDate; }, [currentTZDate]);
            useEffect(() => { additionsRef.current = fundAdditions; }, [fundAdditions]);

            useEffect(() => {
                localStorage.setItem('jff_profiles_v3', JSON.stringify(profiles));
            }, [profiles]);

            useEffect(() => {
                localStorage.setItem('jff_active_profile_id_v3', activeProfileId);
            }, [activeProfileId]);

            useEffect(() => {
                localStorage.setItem('jff_history_v3', JSON.stringify(historyData));
            }, [historyData]);

            useEffect(() => {
                localStorage.setItem('jff_rules_v3', JSON.stringify(rules));
            }, [rules]);

            useEffect(() => {
                localStorage.setItem('jff_theme_color_v3', themeColor);
            }, [themeColor]);

            useEffect(() => {
                localStorage.setItem('jff_glass_opacity_v3', glassOpacity.toString());
            }, [glassOpacity]);

            useEffect(() => {
                localStorage.setItem('jff_glass_blur_v3', glassBlur.toString());
            }, [glassBlur]);

            useEffect(() => {
                localStorage.setItem('jff_bg_image_v3', bgImage);
            }, [bgImage]);

            useEffect(() => {
                localStorage.setItem('jff_current_income_v3', incomeInput);
            }, [incomeInput]);

            useEffect(() => {
                localStorage.setItem('jff_fund_additions_v3', JSON.stringify(fundAdditions));
            }, [fundAdditions]);

            useEffect(() => {
                localStorage.setItem('jff_gmt_offset_v3', gmtOffset.toString());
            }, [gmtOffset]);

            // Logic Cập nhật Giờ Thực Tế & Tự Động Lưu khi sang ngày mới
            useEffect(() => {
                const checkBootAutoSave = () => {
                    const savedDate = localStorage.getItem('jff_last_date_v3');
                    const savedIncomeStr = localStorage.getItem('jff_current_income_v3') || '';
                    const savedIncome = parseFormattedNumber(savedIncomeStr);
                    const savedAdditionsStr = localStorage.getItem('jff_fund_additions_v3');
                    const savedAdditions = savedAdditionsStr ? JSON.parse(savedAdditionsStr) : {};
                    const hasAdditions = Object.values(savedAdditions).some(v => v !== 0);
                    
                    const tzDateObj = getTZDate(gmtOffset);
                    const todayStr = formatTZDate(tzDateObj);

                    if (savedDate && savedDate !== todayStr && (savedIncome !== 0 || hasAdditions)) {
                        let totalSaved = savedIncome;
                        const activeProf = profilesRef.current.find(p => p.id === profileRef.current) || DEFAULT_PROFILES[0];
                        const allocations = activeProf.funds.map(f => {
                            const base = Math.round((savedIncome * (f.percent || 0)) / 100);
                            const extra = savedAdditions[f.id] || 0;
                            totalSaved += extra;
                            return {
                                fundName: f.name,
                                percent: f.percent,
                                amount: base + extra
                            };
                        });

                        const newRecord = {
                            id: Date.now().toString(),
                            date: savedDate,
                            time: "23:59:59",
                            totalIncome: totalSaved,
                            profileId: activeProf.id,
                            profileName: activeProf.name,
                            allocations: allocations
                        };

                        setHistoryData(prev => [newRecord, ...prev]);
                        setIncomeInput('');
                        setFundAdditions({});
                        showToast(`Đã tự động lưu phân bổ ngày ${savedDate} khi mở lại app`);
                    }
                    
                    setCurrentTZDate(todayStr);
                    localStorage.setItem('jff_last_date_v3', todayStr);
                };

                checkBootAutoSave();

                const interval = setInterval(() => {
                    const tzDateObj = getTZDate(gmtOffset);
                    const newDateStr = formatTZDate(tzDateObj);
                    const newTimeStr = formatTZTime(tzDateObj);
                    
                    setRealTime(newTimeStr);

                    if (dateRef.current && newDateStr !== dateRef.current) {
                        const income = parseFormattedNumber(incomeRef.current);
                        const additions = additionsRef.current || {};
                        const hasAdditions = Object.values(additions).some(v => v !== 0);

                        if (income !== 0 || hasAdditions) {
                            let totalIncomeRecord = income;
                            const activeProf = profilesRef.current.find(p => p.id === profileRef.current) || DEFAULT_PROFILES[0];
                            const allocations = activeProf.funds.map(f => {
                                const base = Math.round((income * (f.percent || 0)) / 100);
                                const extra = additions[f.id] || 0;
                                totalIncomeRecord += extra;
                                return {
                                    fundName: f.name,
                                    percent: f.percent,
                                    amount: base + extra
                                };
                            });

                            const newRecord = {
                                id: Date.now().toString(),
                                date: dateRef.current,
                                time: "23:59:59",
                                totalIncome: totalIncomeRecord,
                                profileId: activeProf.id,
                                profileName: activeProf.name,
                                allocations: allocations
                            };

                            setHistoryData(prev => [newRecord, ...prev]);
                            setIncomeInput('');
                            setFundAdditions({});
                            showToast(`Đã tự động lưu phân bổ cho ngày ${dateRef.current}`);
                        }
                        setCurrentTZDate(newDateStr);
                        localStorage.setItem('jff_last_date_v3', newDateStr);
                    } else if (!dateRef.current) {
                        setCurrentTZDate(newDateStr);
                        localStorage.setItem('jff_last_date_v3', newDateStr);
                    }
                }, 1000);
                
                return () => clearInterval(interval);
            }, [gmtOffset]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => {
                    setToast(null);
                }, 3000);
            };

            const activeProfile = useMemo(() => {
                return profiles.find(p => p.id === activeProfileId) || profiles[0] || DEFAULT_PROFILES[0];
            }, [profiles, activeProfileId]);

            const totalPercent = useMemo(() => {
                if (!activeProfile || !activeProfile.funds) return 0;
                return activeProfile.funds.reduce((sum, f) => sum + (Number(f.percent) || 0), 0);
            }, [activeProfile]);

            // Filtered history by selected date range
            const filteredHistory = useMemo(() => {
                return historyData.filter(record => {
                    if (fromDate && record.date < fromDate) return false;
                    if (toDate && record.date > toDate) return false;
                    return true;
                });
            }, [historyData, fromDate, toDate]);

            // Aggregated sum for date range
            const historyTotals = useMemo(() => {
                let grandTotal = 0;
                const fundTotals = {};

                filteredHistory.forEach(record => {
                    grandTotal += (Number(record.totalIncome) || 0);
                    if (record.allocations && Array.isArray(record.allocations)) {
                        record.allocations.forEach(alloc => {
                            const name = alloc.fundName || 'Khác';
                            fundTotals[name] = (fundTotals[name] || 0) + (Number(alloc.amount) || 0);
                        });
                    }
                });

                return { grandTotal, fundTotals };
            }, [filteredHistory]);

            useEffect(() => {
                if (tempImage && imageRef.current) {
                    if (cropperRef.current) {
                        cropperRef.current.destroy();
                    }
                    cropperRef.current = new Cropper(imageRef.current, {
                        aspectRatio: cropAspectRatio,
                        viewMode: 1,
                        background: false,
                        autoCropArea: 0.9,
                        responsive: true,
                    });
                }
                return () => {
                    if (cropperRef.current) {
                        cropperRef.current.destroy();
                        cropperRef.current = null;
                    }
                };
            }, [tempImage, cropAspectRatio]);

            const handleDeleteHistory = (id) => {
                setHistoryData(historyData.filter(h => h.id !== id));
                showToast('Đã xóa bản ghi lịch sử');
            };

            const handleCreateProfile = () => {
                if (!newProfileName.trim()) {
                    showToast('Vui lòng nhập tên giao diện!');
                    return;
                }
                const newProf = {
                    id: 'profile-' + Date.now(),
                    name: newProfileName.trim(),
                    funds: [
                        { id: Date.now().toString(), name: 'Quỹ Chi Tiêu Chính', percent: 100, color: themeColor }
                    ]
                };
                setProfiles([...profiles, newProf]);
                setActiveProfileId(newProf.id);
                setNewProfileName('');
                setShowNewProfileModal(false);
                showToast(`Đã tạo và chuyển sang: ${newProf.name}`);
            };

            const handleUpdateFund = (fundId, field, value) => {
                const updatedFunds = activeProfile.funds.map(f => {
                    if (f.id === fundId) {
                        return { ...f, [field]: value };
                    }
                    return f;
                });
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
            };

            const handleAddFundToProfile = () => {
                const newFund = {
                    id: Date.now().toString(),
                    name: `Quỹ mới ${activeProfile.funds.length + 1}`,
                    percent: 0,
                    color: COLOR_PRESETS[activeProfile.funds.length % COLOR_PRESETS.length].hex
                };
                const updatedFunds = [...activeProfile.funds, newFund];
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
                showToast('Đã thêm ô quỹ mới');
            };

            const handleDeleteFundFromProfile = (fundId) => {
                if (activeProfile.funds.length <= 1) {
                    showToast('Giao diện phải có ít nhất 1 ô quỹ!');
                    return;
                }
                const updatedFunds = activeProfile.funds.filter(f => f.id !== fundId);
                setProfiles(profiles.map(p => p.id === activeProfile.id ? { ...p, funds: updatedFunds } : p));
                showToast('Đã xóa ô quỹ');
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        setTempImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleApplyCrop = () => {
                if (cropperRef.current) {
                    const croppedCanvas = cropperRef.current.getCroppedCanvas({
                        maxWidth: 1920,
                        maxHeight: 1080,
                    });
                    if (croppedCanvas) {
                        const croppedDataUrl = croppedCanvas.toDataURL('image/jpeg', 0.85);
                        setBgImage(croppedDataUrl);
                        setTempImage(null);
                        showToast('Đã áp dụng ảnh nền thành công!');
                    }
                }
            };

            const handleExportData = () => {
                const data = { profiles, historyData, themeColor, glassOpacity, glassBlur, rules };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `JFF_Financial_Backup_${currentTZDate}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Đã tải xuống tệp sao lưu dữ liệu!');
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.profiles) setProfiles(imported.profiles);
                        if (imported.historyData) setHistoryData(imported.historyData);
                        if (imported.themeColor) setThemeColor(imported.themeColor);
                        if (imported.glassOpacity) setGlassOpacity(imported.glassOpacity);
                        if (imported.glassBlur) setGlassBlur(imported.glassBlur);
                        if (imported.rules) setRules(imported.rules);
                        showToast('Đã khôi phục dữ liệu thành công!');
                    } catch (err) {
                        showToast('Tệp sao lưu không đúng định dạng!');
                    }
                };
                reader.readAsText(file);
            };

            const handleAddRule = () => {
                const newRule = {
                    id: Date.now().toString(),
                    title: 'Tiêu đề quy tắc mới',
                    content: 'Nội dung chi tiết của quy tắc...',
                    color: COLOR_PRESETS[rules.length % COLOR_PRESETS.length].hex
                };
                setRules([...rules, newRule]);
                setEditingRuleId(newRule.id);
                setTempRule(newRule);
            };

            const handleEditRule = (rule) => {
                setEditingRuleId(rule.id);
                setTempRule(rule);
            };

            const handleSaveRule = () => {
                setRules(rules.map(r => r.id === tempRule.id ? tempRule : r));
                setEditingRuleId(null);
                setTempRule(null);
                showToast('Đã lưu quy tắc');
            };

            const handleDeleteRule = (id) => {
                setRules(rules.filter(r => r.id !== id));
                showToast('Đã xóa quy tắc');
            };

            return (
                <div 
                    className="min-h-screen relative pb-28 text-slate-100"
                    style={{
                        backgroundImage: bgImage ? `url(${bgImage})` : 'none',
                        backgroundSize: 'cover',
                        backgroundPosition: 'center',
                        backgroundAttachment: 'fixed',
                    }}
                >
                    <style>{`
                        .glass-card {
                            background-color: rgba(15, 23, 42, ${glassOpacity / 100});
                            backdrop-filter: blur(${glassBlur}px);
                            -webkit-backdrop-filter: blur(${glassBlur}px);
                            border: 1px solid rgba(255, 255, 255, 0.12);
                        }
                    `}</style>

                    {bgImage && <div className="fixed inset-0 bg-slate-950/50 pointer-events-none z-0" />}

                    {/* App Header */}
                    <header className="relative z-10 sticky top-0 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-4 py-3 shadow-lg">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div 
                                    className="w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl shadow-lg transition-transform hover:scale-105 shrink-0"
                                    style={{ backgroundColor: themeColor }}
                                >
                                    J
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-base tracking-wide text-white flex items-center gap-2">
                                        JFF <span className="text-xs px-2 py-0.5 rounded-full bg-white/10 border border-white/10 font-medium text-slate-300 hidden sm:inline-block">Tự Do Tài Chính</span>
                                    </h1>
                                    <div className="flex items-center gap-2 mt-0.5">
                                        <p className="text-[11px] text-slate-400 truncate max-w-[120px] sm:max-w-xs">{activeProfile.name}</p>
                                        <span className="text-[10px] text-slate-300 bg-slate-800/80 px-1.5 py-0.5 rounded border border-white/10 font-mono tracking-wider">{realTime}</span>
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={() => setShowSettings(true)}
                                className="p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white transition-all active:scale-95 shadow-md"
                                title="Cài Đặt"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <main className="relative z-10 max-w-5xl mx-auto px-4 mt-4 space-y-5">
                        <div className="flex bg-slate-900/80 p-1.5 rounded-2xl border border-white/10 shadow-lg backdrop-blur-md overflow-x-auto">
                            <button
                                onClick={() => setActiveTab('input')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center ${
                                    activeTab === 'input' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'input' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>Nhập Liệu</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('config')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center ${
                                    activeTab === 'config' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'config' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>Cấu Hình Quỹ</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('history')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center ${
                                    activeTab === 'history' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'history' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>Lịch Sử</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('rules')}
                                className={`flex-1 min-w-[90px] py-2.5 px-3 rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center ${
                                    activeTab === 'rules' ? 'text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'
                                }`}
                                style={activeTab === 'rules' ? { backgroundColor: themeColor } : {}}
                            >
                                <span>Quy Tắc</span>
                            </button>
                        </div>

                        {/* TAB 1: INPUT & ALLOCATION CALCULATOR */}
                        {activeTab === 'input' && (
                            <div className="space-y-6">
                                <div className="glass-card rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h2 className="font-extrabold text-base text-white">
                                            Nhập Số Tiền Thu Nhập Mới
                                        </h2>
                                        <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/10 text-slate-300 border border-white/10">
                                            {activeProfile.name}
                                        </span>
                                    </div>

                                    <div className="relative">
                                        <input
                                            type="text"
                                            inputMode="text"
                                            value={incomeInput}
                                            onChange={(e) => setIncomeInput(formatVNDInput(e.target.value))}
                                            placeholder=""
                                            className="w-full bg-slate-900/90 text-white font-extrabold text-lg sm:text-2xl px-4 py-3.5 rounded-2xl border border-white/15 focus:outline-none focus:border-blue-500 transition-all placeholder:text-slate-500"
                                        />
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 bg-white/5 px-2.5 py-1 rounded-lg border border-white/10">
                                            VND
                                        </div>
                                    </div>

                                    {(incomeInput || Object.values(fundAdditions).some(v => v !== 0)) && (
                                        <div className="flex justify-end pt-1">
                                            <button
                                                onClick={() => { setIncomeInput(''); setFundAdditions({}); }}
                                                className="py-1.5 px-3 rounded-xl bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs font-bold transition-all"
                                            >
                                                Xóa nhập liệu
                                            </button>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-center p-3 rounded-xl bg-slate-900/50 border border-white/5">
                                        <p className="text-[11px] font-medium text-slate-400 text-center leading-relaxed">
                                            Số tiền này sẽ được tự động chia và <strong className="text-blue-400">lưu vào lịch sử khi qua 0:00 sáng</strong> ngày hôm sau. Không cần phải thao tác thủ công.
                                        </p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <h3 className="font-extrabold text-xs uppercase text-slate-300 tracking-wider">
                                            Phân Bổ Thu Nhập
                                        </h3>
                                        <span className={`text-xs font-bold ${totalPercent === 100 ? 'text-emerald-400' : 'text-amber-400'}`}>
                                            Tổng: {totalPercent}%
                                        </span>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                                        {activeProfile.funds.map((fund) => {
                                            const income = parseFormattedNumber(incomeInput);
                                            const baseAllocated = Math.round((income * (fund.percent || 0)) / 100);
                                            const manualAdd = fundAdditions[fund.id] || 0;
                                            const totalAllocated = baseAllocated + manualAdd;

                                            return (
                                                <div 
                                                    key={fund.id} 
                                                    onClick={() => {
                                                        setActiveFundForManual(fund);
                                                        setManualAmountInput(manualAdd !== 0 ? formatVNDInput(manualAdd.toString()) : '');
                                                    }}
                                                    className="glass-card rounded-2xl p-3.5 transition-all hover:border-white/40 cursor-pointer hover:shadow-lg hover:-translate-y-0.5 flex flex-col justify-center gap-1.5 group relative"
                                                    style={{ borderLeft: `4px solid ${fund.color || themeColor}` }}
                                                >
                                                    <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-400"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                                    </div>

                                                    <div className="flex justify-between items-center gap-2 pr-4">
                                                        <h4 className="font-extrabold text-sm text-white truncate">{fund.name}</h4>
                                                        <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-white/10 text-slate-200 shrink-0">
                                                            {fund.percent}%
                                                        </span>
                                                    </div>

                                                    <div className="flex justify-between items-end mt-1">
                                                        <span className="text-[10px] text-slate-400 font-medium opacity-60 group-hover:opacity-100 transition-opacity">Nhấn để nhập thủ công</span>
                                                        <div className="text-right">
                                                            {manualAdd !== 0 && (
                                                                <span className={`text-[10px] font-bold block mb-0.5 ${manualAdd > 0 ? 'text-amber-400' : 'text-red-400'}`}>
                                                                    {manualAdd > 0 ? '+' : ''}{formatVND(manualAdd)} (thủ công)
                                                                </span>
                                                            )}
                                                            <span className="text-base font-black text-emerald-400">
                                                                {formatVND(totalAllocated)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: FUND CONFIGURATION */}
                        {activeTab === 'config' && (
                            <div className="space-y-6">
                                <div className="glass-card rounded-3xl p-5 shadow-2xl space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                        <div>
                                            <h2 className="font-extrabold text-base text-white">Cấu Hình Ô Quỹ & Tỷ Lệ %</h2>
                                            <p className="text-xs text-slate-400">Tùy chỉnh tên và số % của từng ô quỹ</p>
                                        </div>
                                        <div className={`px-3 py-1 rounded-xl font-bold text-xs border ${
                                            totalPercent === 100 ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                                        }`}>
                                            Tổng tỷ lệ: {totalPercent} / 100%
                                        </div>
                                    </div>

                                    {totalPercent !== 100 && (
                                        <div className="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-xs text-amber-300 font-medium">
                                            Cảnh báo: Tổng phần trăm hiện tại là <strong>{totalPercent}%</strong>. Hãy điều chỉnh để tổng vừa đủ <strong>100%</strong> nhé!
                                        </div>
                                    )}

                                    <div className="space-y-3 pt-2">
                                        {activeProfile.funds.map((fund, index) => (
                                            <div key={fund.id} className="bg-slate-900/80 p-3.5 rounded-2xl border border-white/10">
                                                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center">
                                                    <div className="sm:col-span-6">
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tên ô quỹ #{index + 1}</label>
                                                        <input
                                                            type="text"
                                                            value={fund.name}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'name', e.target.value)}
                                                            className="w-full bg-slate-950 text-white font-bold text-xs px-3 py-2 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-3">
                                                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Tỷ lệ (%)</label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            max="100"
                                                            value={fund.percent}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'percent', Number(e.target.value))}
                                                            className="w-full bg-slate-950 text-white font-black text-xs px-3 py-2 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-3 flex items-center space-x-2 pt-2 sm:pt-4">
                                                        <input
                                                            type="color"
                                                            value={fund.color || themeColor}
                                                            onChange={(e) => handleUpdateFund(fund.id, 'color', e.target.value)}
                                                            className="w-9 h-9 rounded-xl bg-slate-950 border border-white/10 cursor-pointer p-0.5"
                                                            title="Đổi màu viền ô quỹ"
                                                        />
                                                        <button
                                                            onClick={() => handleDeleteFundFromProfile(fund.id)}
                                                            className="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl border border-red-500/20 transition-all text-xs font-bold"
                                                            title="Xóa ô quỹ này"
                                                        >
                                                            Xóa
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <button
                                        onClick={handleAddFundToProfile}
                                        className="w-full py-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-dashed border-white/20 text-slate-200 font-bold text-xs uppercase transition-all flex items-center justify-center"
                                    >
                                        <span>+ Thêm Ô Quỹ Mới</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: HISTORY & DATE RANGE SEARCH */}
                        {activeTab === 'history' && (
                            <div className="space-y-6">
                                <div className="glass-card rounded-3xl p-5 shadow-2xl space-y-4">
                                    <div>
                                        <h2 className="font-extrabold text-base text-white">Lịch Sử Phân Bổ Tài Chính</h2>
                                        <p className="text-xs text-slate-400">Tra cứu chi tiết và tổng hợp số tiền theo khoảng thời gian</p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2 border-t border-white/10 items-end">
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-300 uppercase block mb-1">Từ ngày</label>
                                            <input
                                                type="date"
                                                value={fromDate}
                                                onChange={(e) => setFromDate(e.target.value)}
                                                className="w-full bg-slate-900/90 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-300 uppercase block mb-1">Đến ngày</label>
                                            <input
                                                type="date"
                                                value={toDate}
                                                onChange={(e) => setToDate(e.target.value)}
                                                className="w-full bg-slate-900/90 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <button 
                                                onClick={() => {
                                                    showToast('Đã tra cứu dữ liệu theo khoảng thời gian!');
                                                }}
                                                className="flex-1 py-2.5 px-4 text-xs font-bold text-white rounded-xl shadow-lg transition-all"
                                                style={{ backgroundColor: themeColor }}
                                            >
                                                Tra Cứu
                                            </button>
                                            {(fromDate || toDate) && (
                                                <button 
                                                    onClick={() => { 
                                                        const tzDateObj = getTZDate(gmtOffset);
                                                        const todayStr = formatTZDate(tzDateObj);
                                                        setFromDate(todayStr); 
                                                        setToDate(todayStr); 
                                                    }}
                                                    className="py-2.5 px-3 text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl border border-red-500/20 transition-all"
                                                    title="Đặt lại về ngày hiện tại"
                                                >
                                                    Hôm nay
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {/* Aggregated Summary for Date Range */}
                                {filteredHistory.length > 0 && (
                                    <div className="glass-card rounded-3xl p-5 shadow-xl space-y-4 border border-blue-500/20 bg-blue-950/20">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-white/10 pb-3 gap-2">
                                            <div>
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-0.5">Thống kê tổng hợp trong khoảng thời gian</span>
                                                <h3 className="font-extrabold text-lg text-white">
                                                    Tổng Thu Nhập Tất Cả Các Quỹ: <span className="text-emerald-400 font-black">{formatVND(historyTotals.grandTotal)}</span>
                                                </h3>
                                            </div>
                                            <span className="text-xs font-bold px-3 py-1 rounded-xl bg-white/10 text-slate-300 border border-white/10">
                                                {filteredHistory.length} lần ghi nhận
                                            </span>
                                        </div>

                                        <div>
                                            <h4 className="text-xs font-bold text-slate-300 uppercase mb-2">Tổng số tiền chi tiết của từng quỹ:</h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                                                {Object.entries(historyTotals.fundTotals).map(([fundName, totalAmount]) => (
                                                    <div key={fundName} className="bg-slate-900/90 p-3 rounded-2xl border border-white/10 space-y-1 shadow-md">
                                                        <span className="text-[11px] font-bold text-slate-400 truncate block">{fundName}</span>
                                                        <span className="text-sm font-black block" style={{ color: themeColor }}>
                                                            {formatVND(totalAmount)}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* History Records List with Accordion / Dropdown Arrow */}
                                {historyData.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-12 text-center text-slate-400 space-y-3">
                                        <p className="font-bold text-sm">Chưa có lịch sử phân bổ nào được lưu</p>
                                        <p className="text-xs text-slate-500">Hệ thống sẽ tự động lưu vào 0h hàng ngày khi bạn có nhập liệu.</p>
                                    </div>
                                ) : filteredHistory.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-8 text-center text-slate-400 space-y-2">
                                        <p className="font-bold text-sm">Không tìm thấy bản ghi nào trong khoảng thời gian này</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-bold uppercase text-slate-400 px-1">Chi tiết các ngày ghi nhận ({filteredHistory.length})</h3>
                                        {filteredHistory.map((record) => {
                                            const isExpanded = !!expandedRecordIds[record.id];
                                            return (
                                                <div key={record.id} className="glass-card rounded-2xl p-4 shadow-lg transition-all space-y-2">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <div className="flex items-center space-x-3">
                                                            <button
                                                                onClick={() => setExpandedRecordIds(prev => ({ ...prev, [record.id]: !isExpanded }))}
                                                                className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-300 transition-transform duration-200"
                                                                style={{ transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)' }}
                                                                title="Xổ xuống xem chi tiết"
                                                            >
                                                                ▼
                                                            </button>
                                                            <div>
                                                                <div className="flex items-center space-x-2">
                                                                    <span className="font-extrabold text-sm text-white">{record.date}</span>
                                                                    <span className="text-[10px] text-slate-400 font-mono">({record.time})</span>
                                                                </div>
                                                                <p className="text-xs text-slate-300 font-medium">
                                                                    Tổng thu: <strong className="text-emerald-400">{formatVND(record.totalIncome)}</strong>
                                                                </p>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center space-x-2">
                                                            <span className="px-2.5 py-1 rounded-lg text-[10px] font-bold bg-white/10 text-slate-300 border border-white/10 hidden sm:inline-block">
                                                                {record.profileName}
                                                            </span>
                                                            <button
                                                                onClick={() => handleDeleteHistory(record.id)}
                                                                className="p-2 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl transition-all text-xs font-bold"
                                                                title="Xóa bản ghi"
                                                            >
                                                                Xóa
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Dropdown specific allocations list */}
                                                    {isExpanded && (
                                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 pt-3 border-t border-white/10 animate-fadeIn">
                                                            {record.allocations.map((alloc, idx) => (
                                                                <div key={idx} className="bg-slate-900/80 p-2.5 rounded-xl border border-white/5 space-y-0.5">
                                                                    <span className="text-[10px] font-bold text-slate-400 truncate block">{alloc.fundName} ({alloc.percent}%)</span>
                                                                    <span className="text-xs font-black text-white block">{formatVND(alloc.amount)}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 4: RULES */}
                        {activeTab === 'rules' && (
                            <div className="glass-card rounded-3xl p-6 shadow-2xl space-y-5">
                                <h2 className="font-extrabold text-lg text-white">Quy Tắc Quản Lý Tài Chính Tự Do JFF</h2>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    Phương pháp quản lý tài chính theo quy tắc các hũ quỹ giúp bạn cân bằng giữa cuộc sống hiện tại và mục tiêu tự do tài chính dài hạn trong tương lai. Bạn có thể tự do chỉnh sửa, thêm bớt các quy tắc cho phù hợp với bản thân.
                                </p>
                                
                                <div className="space-y-4 pt-2">
                                    {rules.map((rule) => (
                                        <div key={rule.id} className="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2 relative group transition-all">
                                            {editingRuleId === rule.id ? (
                                                <div className="space-y-3">
                                                    <input 
                                                        type="text"
                                                        value={tempRule.title}
                                                        onChange={(e) => setTempRule({...tempRule, title: e.target.value})}
                                                        placeholder="Tiêu đề quy tắc..."
                                                        className="w-full bg-slate-950 text-white font-bold text-sm px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                                    />
                                                    <textarea 
                                                        value={tempRule.content}
                                                        onChange={(e) => setTempRule({...tempRule, content: e.target.value})}
                                                        placeholder="Nội dung chi tiết..."
                                                        className="w-full bg-slate-950 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 min-h-[80px] focus:outline-none focus:border-blue-500"
                                                    />
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center space-x-2">
                                                            <input 
                                                                type="color" 
                                                                value={tempRule.color} 
                                                                onChange={(e) => setTempRule({...tempRule, color: e.target.value})} 
                                                                className="w-9 h-9 rounded-xl bg-slate-950 border border-white/10 cursor-pointer p-0.5" 
                                                                title="Đổi màu tiêu đề"
                                                            />
                                                        </div>
                                                        <div className="flex space-x-2">
                                                            <button 
                                                                onClick={() => {
                                                                    if (rule.title === 'Tiêu đề quy tắc mới') {
                                                                        setRules(rules.filter(r => r.id !== rule.id));
                                                                    }
                                                                    setEditingRuleId(null); 
                                                                    setTempRule(null);
                                                                }} 
                                                                className="py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition-all"
                                                            >
                                                                Hủy
                                                            </button>
                                                            <button 
                                                                onClick={handleSaveRule} 
                                                                className="py-2 px-4 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold transition-all shadow-md"
                                                            >
                                                                Lưu Quy Tắc
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="flex justify-between items-start gap-2">
                                                        <h3 className="font-bold text-sm" style={{ color: rule.color }}>{rule.title}</h3>
                                                        <div className="flex items-center space-x-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity shrink-0 bg-slate-950/50 p-1 rounded-lg">
                                                            <button onClick={() => handleEditRule(rule)} className="p-1.5 text-slate-400 hover:text-blue-400 hover:bg-blue-500/10 rounded-md transition-all" title="Sửa quy tắc">
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                                            </button>
                                                            <button onClick={() => handleDeleteRule(rule.id)} className="p-1.5 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-md transition-all" title="Xóa quy tắc">
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <p className="text-xs text-slate-300 leading-relaxed">{rule.content}</p>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                
                                <button
                                    onClick={handleAddRule}
                                    className="w-full py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-dashed border-white/20 text-slate-200 font-bold text-xs uppercase transition-all flex items-center justify-center mt-2"
                                >
                                    <span>+ Thêm Quy Tắc Mới</span>
                                </button>
                            </div>
                        )}
                    </main>

                    {/* FLOATING ACTION BUTTONS */}
                    <div className="fixed bottom-5 right-5 z-40 flex items-center space-x-3">
                        <button
                            onClick={() => setShowSwitchProfileModal(true)}
                            className="px-4 py-3 rounded-2xl bg-slate-900/90 text-white font-extrabold text-xs border border-white/20 shadow-2xl backdrop-blur-md hover:bg-slate-800 transition-all active:scale-95"
                        >
                            Chuyển
                        </button>

                        <button
                            onClick={() => setShowNewProfileModal(true)}
                            className="w-12 h-12 rounded-2xl text-white font-black text-2xl shadow-2xl transition-all duration-200 hover:scale-110 active:scale-95 flex items-center justify-center border border-white/20"
                            style={{ backgroundColor: themeColor }}
                            title="Tạo Giao Diện Quỹ Mới"
                        >
                            +
                        </button>
                    </div>

                    {/* TOAST BANNER */}
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-slate-900/95 text-white px-5 py-3 rounded-2xl border border-white/20 shadow-2xl backdrop-blur-md text-xs font-extrabold animate-bounce">
                            {toast}
                        </div>
                    )}

                    {/* MODAL: NHẬP QUỸ THỦ CÔNG */}
                    {activeFundForManual && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-white/10 space-y-4">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Nhập Riêng: {activeFundForManual.name}</h3>
                                    <button onClick={() => setActiveFundForManual(null)} className="text-slate-400 hover:text-white p-1 font-bold">✕</button>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase">Số tiền cộng/trừ (VND)</label>
                                    <input
                                        type="text"
                                        inputMode="text"
                                        value={manualAmountInput}
                                        onChange={(e) => setManualAmountInput(formatVNDInput(e.target.value))}
                                        className="w-full bg-slate-950 text-white font-bold text-lg px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                        autoFocus
                                    />
                                    <p className="text-[10px] text-slate-500">Ghi số âm (VD: -50.000) nếu bạn chi tiêu lẹm vào quỹ này.</p>
                                </div>
                                <div className="flex justify-end">
                                    <button onClick={() => setManualAmountInput('')} className="py-1.5 px-3 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-[10px] font-bold transition-all">Về 0</button>
                                </div>
                                <div className="flex space-x-3 pt-2">
                                    <button onClick={() => setActiveFundForManual(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Hủy</button>
                                    <button 
                                        onClick={() => {
                                            const amt = parseFormattedNumber(manualAmountInput);
                                            setFundAdditions(prev => ({
                                                ...prev,
                                                [activeFundForManual.id]: amt
                                            }));
                                            setActiveFundForManual(null);
                                            showToast(`Đã cập nhật số tiền riêng cho ${activeFundForManual.name}`);
                                        }} 
                                        className="flex-1 py-2.5 rounded-xl text-white font-extrabold text-xs" 
                                        style={{ backgroundColor: activeFundForManual.color || themeColor }}
                                    >Lưu Số Tiền</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CÀI ĐẶT */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bg-slate-900 rounded-3xl p-6 w-full max-w-md shadow-2xl border border-white/10 space-y-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                                    <h3 className="font-extrabold text-white text-base">Cài Đặt Hệ Thống</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-1 font-bold">✕</button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Múi Giờ (Lưu Tự Động)</label>
                                        <select 
                                            value={gmtOffset} 
                                            onChange={(e) => setGmtOffset(Number(e.target.value))}
                                            className="w-full bg-slate-950 text-white text-xs px-3 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:border-blue-500"
                                        >
                                            {GMT_OPTIONS.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 block">Màu Giao Diện</label>
                                        <div className="flex flex-wrap gap-2">
                                            {COLOR_PRESETS.map((c, i) => (
                                                <button key={i} onClick={() => setThemeColor(c.hex)} className={`w-8 h-8 rounded-full border-2 transition-all ${themeColor === c.hex ? 'border-white scale-110 shadow-lg' : 'border-transparent'}`} style={{ backgroundColor: c.hex }} title={c.name} />
                                            ))}
                                            <button onClick={() => { setShowColorPickerModal(true); setTempCustomColor(themeColor); setShowSettings(false); }} className="px-3 h-8 rounded-full bg-white/10 text-[10px] font-bold text-slate-300 border border-white/20 hover:bg-white/20">Custom</button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[11px] font-bold text-slate-400 uppercase mb-2 flex justify-between">
                                            <span>Độ Trong Suốt (Opacity)</span>
                                            <span>{glassOpacity}%</span>
                                        </label>
                                        <input type="range" min="0" max="100" value={glassOpacity} onChange={(e) => setGlassOpacity(Number(e.target.value))} className="w-full accent-blue-500" />
