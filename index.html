<body class="selection:bg-cyan-500 selection:text-white">
    <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-[2px] pointer-events-none z-0"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // Timezone presets list
        const TIMEZONE_OPTIONS = [
            { label: 'Việt Nam (GMT+7)', zone: 'Asia/Ho_Chi_Minh' },
            { label: 'UTC / Quốc Tế (GMT+0)', zone: 'UTC' },
            { label: 'Nhật Bản / Hàn Quốc (GMT+9)', zone: 'Asia/Tokyo' },
            { label: 'Singapore / Trung Quốc (GMT+8)', zone: 'Asia/Singapore' },
            { label: 'Anh - London (GMT+0/+1)', zone: 'Europe/London' },
            { label: 'Mỹ - New York (GMT-5/-4)', zone: 'America/New_York' },
            { label: 'Mỹ - Los Angeles (GMT-8/-7)', zone: 'America/Los_Angeles' },
            { label: 'Úc - Sydney (GMT+10/+11)', zone: 'Australia/Sydney' }
        ];

        // Background presets
        const BG_PRESETS = [
            { name: 'Mặc định (Tối)', url: '' },
            { name: 'Cyber City', url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Galaxy Stars', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Abstract Blue', url: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80' },
            { name: 'Minimal Dark Mesh', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80' }
        ];

        // Default initial funds
        const DEFAULT_FUNDS = [
            { id: 'f1', name: 'Trợ', bankInfo: 'MBB 0001', type: 'vnd', percent: 0, vndAmount: 300000, color: '#3b82f6' },
            { id: 'f2', name: 'Ăn uống', bankInfo: 'MBB 0002', type: 'percent', percent: 40, vndAmount: 0, color: '#10b981' },
            { id: 'f3', name: 'Đi chơi', bankInfo: 'VCB 1001', type: 'percent', percent: 30, vndAmount: 0, color: '#8b5cf6' },
            { id: 'f4', name: 'Dự phòng', bankInfo: 'TCB 1002', type: 'percent', percent: 10, vndAmount: 0, color: '#ec4899' },
            { id: 'f5', name: 'Tiết kiệm', bankInfo: 'TCB 1003', type: 'percent', percent: 20, vndAmount: 0, color: '#f59e0b' }
        ];

        const DEFAULT_WORKSPACES = [
            {
                id: 'ws_default',
                name: 'Cá Nhân',
                funds: DEFAULT_FUNDS,
                history: [],
                bgImage: '',
                timezone: 'Asia/Ho_Chi_Minh',
                draftIncome: '',
                draftNote: '',
                draftOverrides: {},
                draftExcluded: {}
            }
        ];

        // Format date according to timezone
        const getDateStrInTZ = (tz, dateObj = new Date()) => {
            try {
                const formatter = new Intl.DateTimeFormat('en-CA', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                return formatter.format(dateObj); // YYYY-MM-DD
            } catch (e) {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }
        };

        const getFirstDayOfMonthStrInTZ = (tz) => {
            const dateStr = getDateStrInTZ(tz);
            const parts = dateStr.split('-');
            return `${parts[0]}-${parts[1]}-01`;
        };

        const getTimeStrInTZ = (tz, dateObj = new Date()) => {
            try {
                return new Intl.DateTimeFormat('vi-VN', {
                    timeZone: tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(dateObj);
            } catch (e) {
                return new Date().toLocaleTimeString('vi-VN');
            }
        };

        const formatVND = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0 ₫';
            return new Intl.NumberFormat('vi-VN').format(num) + ' ₫';
        };

        const formatVNDPlain = (num) => {
            if (num === undefined || num === null || isNaN(num)) return '0';
            return new Intl.NumberFormat('vi-VN').format(num);
        };

        const parseVNDInput = (str) => {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^\d-]/g, '');
            return parseInt(cleaned, 10) || 0;
        };

        const copyToClipboard = (text) => {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            } catch (err) {
                console.error('Copy failed', err);
                return false;
            }
        };

        // ===== Hằng số & hàm tiện ích mới =====
        const MAX_UNDO_STEPS = 50;   // số bước hoàn tác/khôi phục tối đa kể từ lúc mở app
        const MAX_CLOUD_VERSIONS = 5; // số bản đã tải lên đám mây được hiển thị
        const AUTO_VERSION_GAP_MS = 10 * 60 * 1000; // tự động lưu: tối đa 1 bản mới / 10 phút

        // Sao chép sâu nhưng dùng chung chuỗi (ảnh nền dạng data: không bị nhân bản trong bộ nhớ)
        const cloneShare = (v) => {
            if (Array.isArray(v)) return v.map(cloneShare);
            if (v && typeof v === 'object') {
                const out = {};
                Object.keys(v).forEach(k => { out[k] = cloneShare(v[k]); });
                return out;
            }
            return v;
        };
        const EMPTY_OBJ = {};
        const WEEKDAYS_VI = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];

        const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } };
        const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } };

        const fmtPct = (n) => {
            const v = Math.round((Number(n) || 0) * 10) / 10;
            return String(v).replace('.', ',');
        };

        const compactVND = (n) => {
            const v = Number(n) || 0;
            if (v >= 1000000000) return fmtPct(v / 1000000000) + ' tỷ';
            if (v >= 1000000) return fmtPct(v / 1000000) + ' tr';
            return formatVNDPlain(v);
        };

        // Khoảng ngày của 1 tháng (m = 1..12)
        const monthRange = (y, m) => {
            const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
            const mm = String(m).padStart(2, '0');
            return { start: `${y}-${mm}-01`, end: `${y}-${mm}-${String(last).padStart(2, '0')}` };
        };

        const shiftDate = (str, days) => {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d + days)).toISOString().slice(0, 10);
        };

        const weekdayOf = (str) => {
            if (!str) return '';
            const [y, m, d] = str.split('-').map(Number);
            return WEEKDAYS_VI[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
        };

        const shortDate = (str) => (str ? `${str.slice(8, 10)}/${str.slice(5, 7)}` : '...');

        /**
         * Chia tiền cho các quỹ ĐƯỢC CHỌN (quỹ nằm trong `excluded` thì bị bỏ qua).
         * 1) Quỹ tiền mặt (VND) được chia đúng số tiền đã đặt.
         * 2) Phần còn lại chia cho các quỹ % đã chọn.
         *    - Nếu tổng % của các quỹ đã chọn < 100%: nâng đều mỗi quỹ cùng một số điểm % cho đủ 100%.
         *    - Nếu tổng % > 100%: thu nhỏ theo tỷ lệ về 100%.
         * 3) Quỹ chốt thủ công (overrides) giữ nguyên số tiền đã chốt, không ảnh hưởng quỹ khác.
         */
        const computeAllocations = (funds, income, overrides, excluded) => {
            const ex = excluded || {};
            const ov = overrides || {};
            const inc = Number(income) || 0;

            const selected = funds.filter(f => !ex[f.id]);
            const vndFunds = selected.filter(f => f.type === 'vnd');
            const pctFunds = selected.filter(f => f.type !== 'vnd');

            const vndTotal = vndFunds.reduce((s, f) => s + (Number(f.vndAmount) || 0), 0);
            const remaining = Math.max(0, inc - vndTotal);
            const pctSum = pctFunds.reduce((s, f) => s + Math.max(0, Number(f.percent) || 0), 0);
            const n = pctFunds.length;

            let adjust = null;
            let delta = 0;
            let scale = 1;
            if (n > 0) {
                if (pctSum < 100 - 1e-9) {
                    adjust = 'raise';
                    delta = (100 - pctSum) / n;
                } else if (pctSum > 100 + 1e-9) {
                    adjust = 'scale';
                    scale = 100 / pctSum;
                }
            }

            const effPct = {};
            pctFunds.forEach(f => {
                const p = Math.max(0, Number(f.percent) || 0);
                effPct[f.id] = adjust === 'raise' ? p + delta : adjust === 'scale' ? p * scale : p;
            });

            const base = {};
            if (inc > 0) {
                vndFunds.forEach(f => { base[f.id] = Number(f.vndAmount) || 0; });

                // Quỹ % cuối cùng có tỷ lệ > 0 nhận phần dư làm tròn để tổng khớp chính xác
                let holderId = null;
                pctFunds.forEach(f => { if (effPct[f.id] > 0) holderId = f.id; });

                let acc = 0;
                pctFunds.forEach(f => {
                    if (f.id === holderId) return;
                    const amt = Math.round((remaining * effPct[f.id]) / 100);
                    base[f.id] = amt;
                    acc += amt;
                });
                if (holderId !== null) base[holderId] = Math.max(0, remaining - acc);
            }

            const list = funds.map(f => {
                const isSelected = !ex[f.id];
                const baseAllocated = isSelected ? (base[f.id] || 0) : 0;
                const isOverridden = isSelected && ov[f.id] !== undefined;
                const finalAmount = isSelected ? (isOverridden ? ov[f.id] : baseAllocated) : 0;
                return {
                    ...f,
                    selected: isSelected,
                    baseAllocated,
                    finalAmount,
                    isOverridden,
                    effPercent: f.type === 'vnd' ? null : (isSelected ? effPct[f.id] : null)
                };
            });

            const allocated = list.reduce((s, a) => s + (Number(a.finalAmount) || 0), 0);

            return {
                list,
                meta: {
                    selectedCount: selected.length,
                    vndTotal,
                    remaining,
                    pctSum,
                    pctCount: n,
                    adjust,
                    delta,
                    scale,
                    allocated,
                    overflow: inc > 0 && vndTotal > inc,
                    noPercentLeft: inc > 0 && n === 0 && remaining > 0
                }
            };
        };

        // ===== Giá trị âm (rút quỹ) & khoản cần bù =====
        // Số tiền âm ở 1 quỹ = quỹ đó bị rút tiền; tháng sau cần bù lại.
        const sanitizeSignedInput = (raw) => {
            const str = String(raw === undefined || raw === null ? '' : raw);
            const neg = /^\s*-/.test(str);
            const digits = str.replace(/\D/g, '');
            if (!digits) return neg ? '-' : '0';
            const f = formatVNDPlain(parseInt(digits, 10));
            return neg ? '-' + f : f;
        };

        // Giá trị ròng của 1 lần ghi nhận = thu nhập + các khoản rút (âm)
        const recordNet = (rec) => {
            const gross = Number(rec && rec.totalIncome) || 0;
            const neg = ((rec && rec.allocations) || []).reduce((s, a) => {
                const v = Number(a.amount) || 0;
                return v < 0 ? s + v : s;
            }, 0);
            return gross + neg;
        };

        // Khi chưa có thu nhập (chỉ rút quỹ) thì chỉ lưu các quỹ được chốt thủ công
        const pickRecordAllocations = (list, income) =>
            list.filter(a => a.selected && (income > 0 || a.isOverridden));

        /**
         * Khoản cần bù của từng quỹ tại tháng `monthKey` (dạng 'YYYY-MM').
         * Mỗi tháng: tiền dương vào quỹ trước tiên dùng để trả nợ cũ, sau đó khoản rút (âm) của tháng đó
         * được cộng vào nợ và bắt đầu phải bù từ tháng sau.
         */
        const computeFundDebts = (history, funds, monthKey) => {
            const byId = {};
            funds.forEach(f => { byId[f.id] = f; });
            const byName = {};
            funds.forEach(f => { byName[(f.name || '').trim().toLowerCase()] = f; });

            const agg = {}; // fundId -> month -> { pos, neg }
            (history || []).forEach(rec => {
                const month = (rec.date || '').slice(0, 7);
                if (!month) return;
                (rec.allocations || []).forEach(a => {
                    const fund = byId[a.fundId] || byName[(a.fundName || '').trim().toLowerCase()];
                    if (!fund) return;
                    const amt = Number(a.amount) || 0;
                    if (!agg[fund.id]) agg[fund.id] = {};
                    if (!agg[fund.id][month]) agg[fund.id][month] = { pos: 0, neg: 0 };
                    if (amt > 0) agg[fund.id][month].pos += amt;
                    else agg[fund.id][month].neg += -amt;
                });
            });

            const result = {};
            funds.forEach(f => {
                const months = agg[f.id] || {};
                let debt = 0;
                Object.keys(months).filter(m => m < monthKey).sort().forEach(m => {
                    const repay = Math.min(debt, months[m].pos);
                    debt = debt - repay + months[m].neg;
                });
                const cur = months[monthKey] || { pos: 0, neg: 0 };
                const repaid = Math.min(debt, cur.pos);
                result[f.id] = {
                    debtStart: debt,
                    repaid,
                    remaining: debt - repaid,
                    withdrawnThisMonth: cur.neg
                };
            });
            return result;
        };

        // ===== Supabase: cấu hình & tiện ích =====
        // Có thể điền sẵn ở đây (chỉ dùng anon/publishable key - KHÔNG dùng service_role / secret key),
        // hoặc để trống rồi nhập trong app: Menu ☰ → Tài Khoản & Đồng Bộ.
        const SUPABASE_URL_DEFAULT = 'https://knhgzahoovwgaasmlanw.supabase.co';
        const SUPABASE_KEY_DEFAULT = 'sb_publishable_VEPogBmQpV5FLTHxHswhUA_LrqDgyoi'; // publishable key: an toàn để public, quyền truy cập do RLS kiểm soát

        const getSbConfig = () => {
            const url = lsGet('jff_sb_url') || SUPABASE_URL_DEFAULT;
            const key = lsGet('jff_sb_key') || SUPABASE_KEY_DEFAULT;
            return { url: (url || '').trim().replace(/\/+$/, ''), key: (key || '').trim() };
        };

        // Đổi project Supabase: xóa dấu vết đồng bộ cũ để dữ liệu trên máy được đẩy lên project mới
        (() => {
            const cfg = getSbConfig();
            if (cfg.url && lsGet('jff_synced_project') !== cfg.url) {
                lsDel('jff_synced_user');
                lsDel('jff_cloud_rev');
                lsSet('jff_dirty', '1');
                lsSet('jff_synced_project', cfg.url);
            }
        })();

        // Chặn khóa bí mật bị dán nhầm vào frontend
        const isForbiddenKey = (key) => {
            if (!key) return false;
            if (key.indexOf('sb_secret_') === 0) return true;
            try {
                const parts = key.split('.');
                if (parts.length === 3) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                    return payload && payload.role === 'service_role';
                }
            } catch (e) { /* không phải JWT */ }
            return false;
        };

        // Ảnh nền dạng data: quá nặng, chỉ giữ trên máy, không đẩy lên đám mây
        const stripForCloud = (wsList) => wsList.map(ws => (
            ws && typeof ws.bgImage === 'string' && ws.bgImage.indexOf('data:') === 0 ? { ...ws, bgImage: '' } : ws
        ));

        const summarizeWorkspaces = (wsList) => {
            const list = Array.isArray(wsList) ? wsList : [];
            let records = 0;
            let last = '';
            list.forEach(ws => {
                (ws.history || []).forEach(r => {
                    records += 1;
                    if (r.date && r.date > last) last = r.date;
                });
            });
            return { workspaces: list.length, records, last };
        };

        const isPristineWorkspaces = (wsList) => (
            wsList.length === 1 &&
            (!wsList[0].history || wsList[0].history.length === 0) &&
            !wsList[0].draftIncome &&
            JSON.stringify(wsList[0].funds || []) === JSON.stringify(DEFAULT_FUNDS)
        );

        const translateAuthError = (msg) => {
            const m = (msg || '').toLowerCase();
            if (m.includes('invalid login')) return 'Sai email hoặc mật khẩu.';
            if (m.includes('email not confirmed')) return 'Email chưa được xác nhận. Hãy bấm liên kết trong email xác nhận.';
            if (m.includes('already registered') || m.includes('already been registered')) return 'Email này đã đăng ký. Hãy chuyển sang Đăng nhập.';
            if (m.includes('signups not allowed') || m.includes('signup is disabled') || m.includes('signups are disabled')) return 'Dự án Supabase đang tắt đăng ký. Hãy tạo user trong Supabase → Authentication → Users.';
            if (m.includes('password should be') || m.includes('weak password')) return 'Mật khẩu quá yếu (tối thiểu 6 ký tự).';
            if (m.includes('rate limit')) return 'Thử quá nhiều lần, vui lòng đợi một lát rồi thử lại.';
            if (m.includes('failed to fetch') || m.includes('network')) return 'Không kết nối được tới Supabase. Kiểm tra mạng hoặc địa chỉ Project URL.';
            return msg || 'Có lỗi xảy ra.';
        };

        const translateSyncError = (err) => {
            const msg = (err && err.message) ? err.message : String(err || '');
            const m = msg.toLowerCase();
            if ((err && err.code === 'PGRST205') || m.includes('could not find the table') || m.includes('jff_data')) {
                return 'Chưa có bảng jff_data trong Supabase. Hãy chạy file supabase_setup.sql trong SQL Editor.';
            }
            if (m.includes('failed to fetch') || m.includes('network')) return 'Mất kết nối mạng. Sẽ tự đồng bộ lại khi có mạng.';
            if (m.includes('jwt') || m.includes('not authenticated')) return 'Phiên đăng nhập hết hạn, hãy đăng nhập lại.';
            return msg;
        };
        function App() {
            // Navigation tab: 'input' | 'config' | 'history'
            const [activeTab, setActiveTab] = useState('input');

            // Workspaces & Active Workspace state with local persistence
            const [workspaces, setWorkspaces] = useState(() => {
                const saved = localStorage.getItem('jff_workspaces_v6');
                return saved ? JSON.parse(saved) : DEFAULT_WORKSPACES;
            });

            const [activeWsId, setActiveWsId] = useState(() => {
                const saved = localStorage.getItem('jff_active_ws_v6');
                return saved || 'ws_default';
            });

            // Get current workspace object
            const currentWs = useMemo(() => {
                return workspaces.find(w => w.id === activeWsId) || workspaces[0] || DEFAULT_WORKSPACES[0];
            }, [workspaces, activeWsId]);

            // Real-time clock tick state
            const [nowDate, setNowDate] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setNowDate(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Drawer Sidebar Open state
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);

            // Image Cropper & Adjuster State
            const [imageToAdjust, setImageToAdjust] = useState(null);
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [imgNaturalSize, setImgNaturalSize] = useState({ w: 0, h: 0 });
            const cropContainerRef = useRef(null);

            // Workspace funds & history shorthands
            const funds = currentWs.funds || DEFAULT_FUNDS;
            const history = currentWs.history || [];
            const currentTimezone = currentWs.timezone || 'Asia/Ho_Chi_Minh';
            const currentBgImage = currentWs.bgImage || '';

            const totalIncomeInput = currentWs.draftIncome || '';
            const incomeNote = currentWs.draftNote || '';
            const overrides = currentWs.draftOverrides || {};
            const excluded = currentWs.draftExcluded || EMPTY_OBJ;

            const setTotalIncomeInput = (val) => {
                updateCurrentWorkspaceData(ws => ({
                    ...ws,
                    draftIncome: typeof val === 'function' ? val(ws.draftIncome || '') : val
                }));
            };

            const setIncomeNote = (val) => {
                updateCurrentWorkspaceData(ws => ({
                    ...ws,
                    draftNote: typeof val === 'function' ? val(ws.draftNote || '') : val
                }));
            };

            const setOverrides = (val) => {
                updateCurrentWorkspaceData(ws => ({
                    ...ws,
                    draftOverrides: typeof val === 'function' ? val(ws.draftOverrides || {}) : val
                }));
            };

            // Check new day reset & auto-record logic
            useEffect(() => {
                const todayStr = getDateStrInTZ(currentTimezone, nowDate);
                const lastActiveDate = localStorage.getItem('jff_last_date_v6');

                if (lastActiveDate && lastActiveDate !== todayStr) {
                    setWorkspaces(prevWorkspaces => {
                        return prevWorkspaces.map(ws => {
                            const income = parseVNDInput(ws.draftIncome);
                            const hasWithdraw = Object.values(ws.draftOverrides || {}).some(v => Number(v) < 0);
                            if (income > 0 || hasWithdraw) {
                                const wsFunds = ws.funds || DEFAULT_FUNDS;
                                const allocations = pickRecordAllocations(computeAllocations(wsFunds, income, ws.draftOverrides, ws.draftExcluded).list, income)
                                    .map(a => ({
                                        fundId: a.id,
                                        fundName: a.name,
                                        bankInfo: a.bankInfo,
                                        amount: a.finalAmount
                                    }));

                                const autoRecord = {
                                    id: 'rec_auto_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                                    date: lastActiveDate,
                                    timestamp: `${lastActiveDate} 23:59:59`,
                                    totalIncome: income,
                                    note: (ws.draftNote ? ws.draftNote + ' ' : '') + '(Tự động lưu khi sang ngày mới)',
                                    allocations
                                };

                                return {
                                    ...ws,
                                    history: [autoRecord, ...(ws.history || [])],
                                    draftIncome: '',
                                    draftNote: '',
                                    draftOverrides: {},
                                    draftExcluded: {}
                                };
                            }
                            return {
                                ...ws,
                                draftIncome: '',
                                draftNote: '',
                                draftOverrides: {},
                                draftExcluded: {}
                            };
                        });
                    });

                    localStorage.setItem('jff_last_date_v6', todayStr);
                    showToast('Đã tự động chốt thu nhập ngày hôm qua vào Lịch Sử!', 'success');
                } else if (!lastActiveDate) {
                    localStorage.setItem('jff_last_date_v6', todayStr);
                }
            }, [nowDate, currentTimezone]);

            const [undoStack, setUndoStack] = useState([]);
            const [redoStack, setRedoStack] = useState([]);

            const getCurrentStateSnapshot = useCallback((description) => {
                return {
                    workspaces: cloneShare(workspaces),
                    activeWsId,
                    overrides: { ...overrides },
                    totalIncomeInput,
                    incomeNote,
                    description
                };
            }, [workspaces, activeWsId, overrides, totalIncomeInput, incomeNote]);

            const saveSnapshotForUndo = (description) => {
                const snapshot = getCurrentStateSnapshot(description);
                setUndoStack(prev => [...prev.slice(-(MAX_UNDO_STEPS - 1)), snapshot]);
                setRedoStack([]);
            };

            const handleUndo = () => {
                if (undoStack.length === 0) return;
                const lastState = undoStack[undoStack.length - 1];
                const currentState = getCurrentStateSnapshot('Trước hoàn tác');

                setUndoStack(prev => prev.slice(0, -1));
                setRedoStack(prev => [...prev.slice(-(MAX_UNDO_STEPS - 1)), currentState]);

                setWorkspaces(lastState.workspaces);
                setActiveWsId(lastState.activeWsId);
                setOverrides(lastState.overrides);
                setTotalIncomeInput(lastState.totalIncomeInput);
                setIncomeNote(lastState.incomeNote || '');
                showToast(`Đã hoàn tác: ${lastState.description}`, 'success');
            };

            const handleRedo = () => {
                if (redoStack.length === 0) return;
                const nextState = redoStack[redoStack.length - 1];
                const currentState = getCurrentStateSnapshot('Trước khôi phục');

                setRedoStack(prev => prev.slice(0, -1));
                setUndoStack(prev => [...prev.slice(-(MAX_UNDO_STEPS - 1)), currentState]);

                setWorkspaces(nextState.workspaces);
                setActiveWsId(nextState.activeWsId);
                setOverrides(nextState.overrides);
                setTotalIncomeInput(nextState.totalIncomeInput);
                setIncomeNote(nextState.incomeNote || '');
                showToast(`Đã khôi phục: ${nextState.description}`, 'success');
            };

            useEffect(() => {
                if (imageToAdjust) {
                    const img = new Image();
                    img.onload = () => {
                        setImgNaturalSize({ w: img.width, h: img.height });
                    };
                    img.src = imageToAdjust;
                }
            }, [imageToAdjust]);

            const handleFileSelect = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showToast('Vui lòng chọn file hình ảnh hợp lệ!', 'warning');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const dataUrl = event.target.result;
                    setZoom(1);
                    setPosition({ x: 0, y: 0 });
                    setImageToAdjust(dataUrl);
                    setIsDrawerOpen(false);
                    e.target.value = '';
                };
                reader.readAsDataURL(file);
            };

            const handleMouseDown = (e) => {
                e.preventDefault();
                setIsDragging(true);
                setDragStart({
                    x: e.clientX - position.x,
                    y: e.clientY - position.y
                });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                setPosition({
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleTouchStart = (e) => {
                if (e.touches.length === 1) {
                    setIsDragging(true);
                    setDragStart({
                        x: e.touches[0].clientX - position.x,
                        y: e.touches[0].clientY - position.y
                    });
                }
            };

            const handleTouchMove = (e) => {
                if (isDragging && e.touches.length === 1) {
                    setPosition({
                        x: e.touches[0].clientX - dragStart.x,
                        y: e.touches[0].clientY - dragStart.y
                    });
                }
            };

            const handleTouchEnd = () => {
                setIsDragging(false);
            };

            const applyCroppedImage = () => {
                if (!imageToAdjust) return;
                
                saveSnapshotForUndo('Thay đổi hình nền từ thư viện');
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const targetWidth = 1080;
                    const targetHeight = 1920;
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;

                    ctx.fillStyle = '#0b0f19';
                    ctx.fillRect(0, 0, targetWidth, targetHeight);

                    const containerW = cropContainerRef.current ? cropContainerRef.current.clientWidth : 280;
                    const containerH = cropContainerRef.current ? cropContainerRef.current.clientHeight : 460;

                    const scaleRatio = targetWidth / containerW;

                    const imgAspect = img.width / img.height;
                    const containerAspect = containerW / containerH;
                    let drawW, drawH;
                    if (imgAspect > containerAspect) {
                        drawH = containerH;
                        drawW = containerH * imgAspect;
                    } else {
                        drawW = containerW;
                        drawH = containerW / imgAspect;
                    }

                    const drawW_target = drawW * scaleRatio;
                    const drawH_target = drawH * scaleRatio;

                    ctx.save();
                    ctx.translate(targetWidth / 2 + position.x * scaleRatio, targetHeight / 2 + position.y * scaleRatio);
                    ctx.scale(zoom, zoom);
                    ctx.drawImage(img, -drawW_target / 2, -drawH_target / 2, drawW_target, drawH_target);
                    ctx.restore();

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                    setBgImage(dataUrl);
                    setImageToAdjust(null);
                    showToast('Đã áp dụng hình nền mới thành công!', 'success');
                };
                img.src = imageToAdjust;
            };

            useEffect(() => {
                if (currentBgImage) {
                    document.body.style.backgroundImage = `url("${currentBgImage}")`;
                } else {
                    document.body.style.backgroundImage = 'none';
                    document.body.style.backgroundColor = '#0b0f19';
                }
            }, [currentBgImage]);

            useEffect(() => {
                localStorage.setItem('jff_workspaces_v6', JSON.stringify(workspaces));
            }, [workspaces]);

            useEffect(() => {
                localStorage.setItem('jff_active_ws_v6', activeWsId);
            }, [activeWsId]);

            const [startDate, setStartDate] = useState(() => getFirstDayOfMonthStrInTZ(currentTimezone));
            const [endDate, setEndDate] = useState(() => getDateStrInTZ(currentTimezone));
            const [historySearch, setHistorySearch] = useState('');
            const [expandedHistoryId, setExpandedHistoryId] = useState(null);
            const [rangeMode, setRangeMode] = useState('month'); // 'month' | 'custom'
            const [viewMonth, setViewMonth] = useState(() => {
                const [y, m] = getDateStrInTZ(currentTimezone).split('-').map(Number);
                return { y, m };
            });

            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 2500);
            };

            const updateCurrentWorkspaceData = (updaterFn) => {
                setWorkspaces(prev => prev.map(ws => {
                    if (ws.id === activeWsId) {
                        return updaterFn(ws);
                    }
                    return ws;
                }));
            };

            const setFunds = (newFunds) => {
                updateCurrentWorkspaceData(ws => ({ ...ws, funds: typeof newFunds === 'function' ? newFunds(ws.funds) : newFunds }));
            };

            const setHistory = (newHistory) => {
                updateCurrentWorkspaceData(ws => ({ ...ws, history: typeof newHistory === 'function' ? newHistory(ws.history) : newHistory }));
            };

            const setTimezone = (tz) => {
                saveSnapshotForUndo('Đổi múi giờ sang ' + tz);
                updateCurrentWorkspaceData(ws => ({ ...ws, timezone: tz }));
                setStartDate(getFirstDayOfMonthStrInTZ(tz));
                setEndDate(getDateStrInTZ(tz));
                setRangeMode('month');
                {
                    const [tzY, tzM] = getDateStrInTZ(tz).split('-').map(Number);
                    setViewMonth({ y: tzY, m: tzM });
                }
                showToast('Đã đổi múi giờ sang: ' + tz);
            };

            const setBgImage = (imgUrl) => {
                saveSnapshotForUndo('Thay đổi hình nền');
                updateCurrentWorkspaceData(ws => ({ ...ws, bgImage: imgUrl }));
                showToast('Đã cập nhật hình nền!');
            };

            // Workspace Management
            const [newWsNameInput, setNewWsNameInput] = useState('');
            const [showNewWsModal, setShowNewWsModal] = useState(false);

            const handleCreateWorkspace = () => {
                if (!newWsNameInput.trim()) return;
                saveSnapshotForUndo('Tạo Workspace mới');
                const newId = 'ws_' + Date.now();
                const newWs = {
                    id: newId,
                    name: newWsNameInput.trim(),
                    funds: DEFAULT_FUNDS,
                    history: [],
                    bgImage: currentBgImage,
                    timezone: currentTimezone,
                    draftIncome: '',
                    draftNote: '',
                    draftOverrides: {},
                    draftExcluded: {}
                };
                setWorkspaces(prev => [...prev, newWs]);
                setActiveWsId(newId);
                setNewWsNameInput('');
                setShowNewWsModal(false);
                showToast(`Đã chuyển sang Workspace: ${newWs.name}`, 'success');
            };

            const handleDeleteWorkspace = (wsId) => {
                if (workspaces.length <= 1) {
                    showToast('Cần giữ lại ít nhất 1 Workspace!', 'warning');
                    return;
                }
                saveSnapshotForUndo('Xóa Workspace');
                setWorkspaces(prev => prev.filter(w => w.id !== wsId));
                if (activeWsId === wsId) {
                    const remaining = workspaces.filter(w => w.id !== wsId);
                    setActiveWsId(remaining[0].id);
                }
                showToast('Đã xóa Workspace thành công!');
            };

            const parsedTotalIncome = useMemo(() => parseVNDInput(totalIncomeInput), [totalIncomeInput]);

            const totalPercentSum = useMemo(() => {
                return funds.reduce((sum, f) => f.type === 'percent' ? sum + (Number(f.percent) || 0) : sum, 0);
            }, [funds]);

            const allocationPlan = useMemo(
                () => computeAllocations(funds, parsedTotalIncome, overrides, excluded),
                [funds, parsedTotalIncome, overrides, excluded]
            );
            const calculatedAllocations = allocationPlan.list;
            const planMeta = allocationPlan.meta;

            const [editingFundOverride, setEditingFundOverride] = useState(null);
            const [overrideInputValue, setOverrideInputValue] = useState('');

            const openFundOverrideModal = (fund, currentFinalAmount) => {
                setEditingFundOverride(fund);
                setOverrideInputValue(formatVNDPlain(currentFinalAmount));
            };

            const applyFundOverride = () => {
                if (!editingFundOverride) return;
                saveSnapshotForUndo('Chốt thủ công quỹ ' + editingFundOverride.name);
                const numVal = parseVNDInput(overrideInputValue);
                setOverrides(prev => ({
                    ...prev,
                    [editingFundOverride.id]: numVal
                }));
                setEditingFundOverride(null);
                showToast(`Đã chốt ${editingFundOverride.name}: ${formatVND(numVal)}`, 'success');
            };

            const resetFundOverride = (fundId, fundName) => {
                saveSnapshotForUndo('Bỏ chốt thủ công ' + fundName);
                setOverrides(prev => {
                    const next = { ...prev };
                    delete next[fundId];
                    return next;
                });
                showToast(`Đã đặt lại tự động cho ${fundName}`);
            };

            const handleCopyBankInfo = (info, fundName) => {
                if (!info) return;
                if (copyToClipboard(info)) {
                    showToast(`Đã chép STK [${fundName}]: ${info}`, 'success');
                } else {
                    showToast(`Không thể tự động chép: ${info}`, 'warning');
                }
            };

            const handleRecordAllocation = () => {
                if (parsedTotalIncome <= 0 && !calculatedAllocations.some(a => a.selected && a.isOverridden && a.finalAmount < 0)) {
                    showToast('Vui lòng nhập Tổng Thu Nhập > 0 (hoặc chốt số âm để ghi nhận rút quỹ)', 'warning');
                    return;
                }

                if (planMeta.selectedCount === 0) {
                    showToast('Hãy tích chọn ít nhất 1 quỹ để chia tiền', 'warning');
                    return;
                }
                saveSnapshotForUndo('Ghi nhận thu nhập');

                const dateStr = getDateStrInTZ(currentTimezone, nowDate);
                const timeStr = getTimeStrInTZ(currentTimezone, nowDate);

                const record = {
                    id: 'rec_' + Date.now(),
                    date: dateStr,
                    timestamp: `${dateStr} ${timeStr}`,
                    totalIncome: parsedTotalIncome,
                    note: incomeNote.trim() || (parsedTotalIncome > 0 ? 'Thu nhập' : 'Rút quỹ'),
                    allocations: pickRecordAllocations(calculatedAllocations, parsedTotalIncome).map(a => ({
                        fundId: a.id,
                        fundName: a.name,
                        bankInfo: a.bankInfo,
                        amount: a.finalAmount
                    }))
                };

                updateCurrentWorkspaceData(ws => ({
                    ...ws,
                    history: [record, ...(ws.history || [])],
                    draftIncome: '',
                    draftNote: '',
                    draftOverrides: {},
                    draftExcluded: {}
                }));
                showToast('Đã lưu lịch sử phân bổ thành công!', 'success');
            };

            const handleDeleteHistoryItem = (recId) => {
                saveSnapshotForUndo('Xóa lịch sử ghi nhận');
                setHistory(prev => prev.filter(item => item.id !== recId));
                showToast('Đã xóa 1 bản ghi lịch sử');
            };

            const [showBackupModal, setShowBackupModal] = useState(false);
            const [jsonBackupText, setJsonBackupText] = useState('');

            const getFullBackupData = () => {
                return {
                    version: 'v6_all',
                    exportDate: new Date().toISOString(),
                    workspaces,
                    activeWsId
                };
            };

            const handleOpenBackupModal = () => {
                setJsonBackupText(JSON.stringify(getFullBackupData(), null, 2));
                setShowBackupModal(true);
            };

            const handleDownloadJsonFile = () => {
                try {
                    const data = getFullBackupData();
                    const jsonString = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonString], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = getDateStrInTZ(currentTimezone);
                    a.href = url;
                    a.download = `JFF_Backup_${dateStr}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Đã tải xuống file JSON thành công!', 'success');
                } catch (e) {
                    showToast('Lỗi khi tải xuống file JSON!', 'warning');
                }
            };

            const handleJsonFileUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && Array.isArray(parsed.workspaces)) {
                            saveSnapshotForUndo('Nhập dữ liệu từ file JSON');
                            setWorkspaces(parsed.workspaces);
                            if (parsed.activeWsId) setActiveWsId(parsed.activeWsId);
                            setShowBackupModal(false);
                            showToast('Đã nhập thành công tất cả Workspaces từ file JSON!', 'success');
                        } else if (parsed && Array.isArray(parsed.funds)) {
                            saveSnapshotForUndo('Nhập dữ liệu Workspace từ file JSON');
                            updateCurrentWorkspaceData(ws => ({
                                ...ws,
                                funds: parsed.funds,
                                history: Array.isArray(parsed.history) ? parsed.history : ws.history
                            }));
                            setShowBackupModal(false);
                            showToast('Đã nhập dữ liệu cho Workspace hiện tại từ file JSON!', 'success');
                        } else {
                            showToast('Cấu trúc file JSON không hợp lệ!', 'warning');
                        }
                    } catch (err) {
                        showToast('Không thể đọc file JSON, vui lòng kiểm tra định dạng!', 'warning');
                    }
                    e.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleImportDataFromText = () => {
                try {
                    const parsed = JSON.parse(jsonBackupText);
                    if (parsed && Array.isArray(parsed.workspaces)) {
                        saveSnapshotForUndo('Khôi phục dữ liệu từ chuỗi văn bản JSON');
                        setWorkspaces(parsed.workspaces);
                        if (parsed.activeWsId) setActiveWsId(parsed.activeWsId);
                        setShowBackupModal(false);
                        showToast('Đã khôi phục toàn bộ dữ liệu thành công!', 'success');
                    } else if (parsed && Array.isArray(parsed.funds)) {
                        saveSnapshotForUndo('Khôi phục dữ liệu Workspace từ văn bản JSON');
                        updateCurrentWorkspaceData(ws => ({
                            ...ws,
                            funds: parsed.funds,
                            history: Array.isArray(parsed.history) ? parsed.history : ws.history
                        }));
                        setShowBackupModal(false);
                        showToast('Đã khôi phục dữ liệu cho Workspace hiện tại!', 'success');
                    } else {
                        showToast('Cấu trúc chuỗi JSON không hợp lệ!', 'warning');
                    }
                } catch (e) {
                    showToast('Định dạng JSON bị lỗi, vui lòng kiểm tra!', 'warning');
                }
            };

            const filteredHistory = useMemo(() => {
                return history.filter(item => {
                    const itemDate = item.date;
                    if (startDate && itemDate < startDate) return false;
                    if (endDate && itemDate > endDate) return false;
                    
                    if (historySearch.trim()) {
                        const term = historySearch.toLowerCase();
                        const matchNote = (item.note || '').toLowerCase().includes(term);
                        const matchFunds = item.allocations?.some(a => a.fundName.toLowerCase().includes(term));
                        if (!matchNote && !matchFunds) return false;
                    }

                    return true;
                });
            }, [history, startDate, endDate, historySearch]);

            const historyAggregatedData = useMemo(() => {
                let grandTotalIncome = 0;
                let withdrawTotal = 0;
                
                const fundTotalsMap = {};
                funds.forEach(f => {
                    fundTotalsMap[f.id] = {
                        id: f.id,
                        name: f.name,
                        bankInfo: f.bankInfo,
                        color: f.color,
                        totalAmount: 0
                    };
                });

                let legacyTotal = 0;

                filteredHistory.forEach(rec => {
                    grandTotalIncome += (Number(rec.totalIncome) || 0);
                    if (Array.isArray(rec.allocations)) {
                        rec.allocations.forEach(alloc => {
                            const allocAmt = Number(alloc.amount) || 0;
                            if (allocAmt < 0) withdrawTotal += allocAmt;
                            if (fundTotalsMap[alloc.fundId]) {
                                fundTotalsMap[alloc.fundId].totalAmount += allocAmt;
                            } else {
                                const matched = funds.find(f => f.name.trim().toLowerCase() === (alloc.fundName || '').trim().toLowerCase());
                                if (matched && fundTotalsMap[matched.id]) {
                                    fundTotalsMap[matched.id].totalAmount += allocAmt;
                                } else {
                                    legacyTotal += allocAmt;
                                }
                            }
                        });
                    }
                });

                const activeFundList = funds.map(f => fundTotalsMap[f.id]);

                if (legacyTotal !== 0) {
                    activeFundList.push({
                        id: 'legacy_other',
                        name: 'Khác (Quỹ cũ)',
                        bankInfo: 'Dữ liệu cũ',
                        color: '#6b7280',
                        totalAmount: legacyTotal
                    });
                }

                return {
                    grandTotalIncome,
                    withdrawTotal,
                    netTotal: grandTotalIncome + withdrawTotal,
                    count: filteredHistory.length,
                    activeFundList
                };
            }, [filteredHistory, funds]);

            // ===== Khoản cần bù (quỹ bị rút ở tháng trước) =====
            const todayMonthKey = getDateStrInTZ(currentTimezone, nowDate).slice(0, 7);
            const fundDebts = useMemo(
                () => computeFundDebts(history, funds, todayMonthKey),
                [history, funds, todayMonthKey]
            );
            const debtList = funds
                .filter(f => fundDebts[f.id] && fundDebts[f.id].debtStart > 0)
                .map(f => ({ fund: f, ...fundDebts[f.id] }));

            const debtBanner = debtList.length > 0 ? (
                <div className="glass-card rounded-xl p-3 border border-amber-500/30 bg-amber-500/5 space-y-2">
                    <p className="text-[11px] font-bold text-amber-300 flex items-center gap-1.5">
                        <i className="fa-solid fa-triangle-exclamation"></i> QUỸ CẦN BÙ LẠI (đã bị rút ở tháng trước)
                    </p>
                    {debtList.map(d => (
                        <div key={d.fund.id} className="text-[11px]">
                            <div className="flex justify-between items-center gap-2">
                                <span className="flex items-center gap-1.5 min-w-0">
                                    <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: d.fund.color }}></span>
                                    <span className="font-semibold text-slate-200 truncate">{d.fund.name}</span>
                                </span>
                                {d.remaining > 0 ? (
                                    <span className="font-extrabold text-rose-300 shrink-0">Còn thiếu {formatVND(d.remaining)}</span>
                                ) : (
                                    <span className="font-bold text-emerald-400 shrink-0"><i className="fa-solid fa-check mr-1"></i>Đã bù đủ</span>
                                )}
                            </div>
                            <div className="h-1 mt-1 rounded-full bg-slate-900 overflow-hidden">
                                <div className="h-full rounded-full bg-amber-400" style={{ width: `${Math.min(100, (d.repaid / d.debtStart) * 100)}%` }}></div>
                            </div>
                            <p className="text-[10px] text-slate-500 mt-0.5">Cần bù {formatVND(d.debtStart)} · tháng này đã bù {formatVND(d.repaid)}</p>
                        </div>
                    ))}
                </div>
            ) : null;

            // ===== Chọn quỹ để chia tiền =====
            const setExcluded = (val) => {
                updateCurrentWorkspaceData(ws => ({
                    ...ws,
                    draftExcluded: typeof val === 'function' ? val(ws.draftExcluded || {}) : val
                }));
            };

            const toggleFundSelected = (fundId) => {
                setExcluded(prev => {
                    const next = { ...prev };
                    if (next[fundId]) delete next[fundId];
                    else next[fundId] = true;
                    return next;
                });
            };

            const selectAllFunds = () => setExcluded({});

            const deselectAllFunds = () => {
                const all = {};
                funds.forEach(f => { all[f.id] = true; });
                setExcluded(all);
            };

            // ===== Tra cứu theo tháng =====
            const applyMonth = (y, m) => {
                const r = monthRange(y, m);
                setViewMonth({ y, m });
                setStartDate(r.start);
                setEndDate(r.end);
                setRangeMode('month');
            };

            const goMonth = (delta) => {
                let y = viewMonth.y;
                let m = viewMonth.m + delta;
                if (m < 1) { m = 12; y -= 1; }
                if (m > 12) { m = 1; y += 1; }
                applyMonth(y, m);
            };

            const goThisMonth = () => {
                const [y, m] = getDateStrInTZ(currentTimezone).split('-').map(Number);
                applyMonth(y, m);
                setHistorySearch('');
            };

            const goLast30Days = () => {
                const today = getDateStrInTZ(currentTimezone);
                setStartDate(shiftDate(today, -29));
                setEndDate(today);
                setRangeMode('custom');
            };

            const historySummary = useMemo(() => {
                const list = historyAggregatedData.activeFundList;
                const sumFunds = list.reduce((s, f) => s + Math.max(0, f.totalAmount), 0);
                const rows = list
                    .map(f => ({ ...f, share: sumFunds > 0 && f.totalAmount > 0 ? (f.totalAmount / sumFunds) * 100 : 0 }))
                    .sort((a, b) => b.totalAmount - a.totalAmount);
                const avg = historyAggregatedData.count > 0
                    ? Math.round(historyAggregatedData.netTotal / historyAggregatedData.count)
                    : 0;
                return { rows, sumFunds, avg };
            }, [historyAggregatedData]);

            const groupedHistory = useMemo(() => {
                const map = {};
                filteredHistory.forEach(rec => {
                    if (!map[rec.date]) map[rec.date] = { date: rec.date, total: 0, records: [] };
                    map[rec.date].total += recordNet(rec);
                    map[rec.date].records.push(rec);
                });
                return Object.values(map).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
            }, [filteredHistory]);

            const colorForAlloc = useMemo(() => {
                const byId = {};
                const byName = {};
                funds.forEach(f => {
                    byId[f.id] = f.color;
                    byName[(f.name || '').trim().toLowerCase()] = f.color;
                });
                return (a) => byId[a.fundId] || byName[(a.fundName || '').trim().toLowerCase()] || '#6b7280';
            }, [funds]);

            // ===== Supabase: đăng nhập + đồng bộ =====
            const [sbConfig, setSbConfig] = useState(getSbConfig);
            const sbKeyForbidden = isForbiddenKey(sbConfig.key);
            const sb = useMemo(() => {
                if (!sbConfig.url || !sbConfig.key || isForbiddenKey(sbConfig.key)) return null;
                if (!window.supabase || !window.supabase.createClient) return null;
                try {
                    return window.supabase.createClient(sbConfig.url, sbConfig.key, {
                        auth: { persistSession: true, autoRefreshToken: true, storageKey: 'jff-supabase-auth-v2' }
                    });
                } catch (e) {
                    return null;
                }
            }, [sbConfig]);

            const [authUser, setAuthUser] = useState(null);
            const authUserId = authUser ? authUser.id : null;
            const [syncStatus, setSyncStatus] = useState('off'); // off | syncing | pending | saved | error | conflict
            const [syncError, setSyncError] = useState('');
            const [cloudReady, setCloudReady] = useState(false);
            const [conflictRow, setConflictRow] = useState(null);
            const [showAccountModal, setShowAccountModal] = useState(false);
            const [authMode, setAuthMode] = useState('login'); // login | signup
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authBusy, setAuthBusy] = useState(false);
            const [authMessage, setAuthMessage] = useState(null);
            const [cfgUrlInput, setCfgUrlInput] = useState(sbConfig.url);
            const [cfgKeyInput, setCfgKeyInput] = useState(sbConfig.key);

            const [autoSync, setAutoSync] = useState(() => lsGet('jff_auto_sync') === '1');
            const autoSyncRef = useRef(autoSync);
            autoSyncRef.current = autoSync;
            const [versions, setVersions] = useState([]);
            const [versionsLoading, setVersionsLoading] = useState(false);
            const [versionsError, setVersionsError] = useState('');
            const [versionsTick, setVersionsTick] = useState(0);
            const pushAgainKindRef = useRef('auto');

            const workspacesRef = useRef(workspaces);
            workspacesRef.current = workspaces;
            const cloudRevRef = useRef(0);
            const lastSyncedJsonRef = useRef(null);
            const pushingRef = useRef(false);
            const pushAgainRef = useRef(false);
            const mountedRef = useRef(false);
            const pushRef = useRef(null);

            // Áp dụng dữ liệu từ đám mây vào máy
            const applyCloud = (row) => {
                const cloudWs = row && row.data && Array.isArray(row.data.workspaces) ? row.data.workspaces : null;
                if (!cloudWs || cloudWs.length === 0) {
                    setSyncStatus('error');
                    setSyncError('Dữ liệu trên đám mây rỗng hoặc sai cấu trúc.');
                    setConflictRow(null);
                    return;
                }
                const localById = {};
                workspacesRef.current.forEach(w => { localById[w.id] = w; });
                const merged = cloudWs.map(w => {
                    const local = localById[w.id];
                    if (!w.bgImage && local && typeof local.bgImage === 'string' && local.bgImage.indexOf('data:') === 0) {
                        return { ...w, bgImage: local.bgImage };
                    }
                    return w;
                });
                lastSyncedJsonRef.current = JSON.stringify(stripForCloud(merged));
                cloudRevRef.current = Number(row.rev) || 1;
                lsSet('jff_cloud_rev', String(cloudRevRef.current));
                lsSet('jff_dirty', '0');
                if (authUserId) lsSet('jff_synced_user', authUserId);
                workspacesRef.current = merged;
                setWorkspaces(merged);
                setActiveWsId(prev => (merged.some(w => w.id === prev) ? prev : merged[0].id));
                setUndoStack([]);
                setRedoStack([]);
                setConflictRow(null);
                setCloudReady(true);
                setSyncError('');
                setSyncStatus('saved');
            };

            const openConflict = async () => {
                const { data: row, error } = await sb.from('jff_data').select('data, rev').eq('user_id', authUserId).maybeSingle();
                if (error) throw error;
                if (!row) {
                    // Bản trên đám mây đã bị xóa: tạo lại từ dữ liệu máy này
                    cloudRevRef.current = 0;
                    pushAgainRef.current = true;
                    return;
                }
                setConflictRow(row);
                setSyncStatus('conflict');
            };

            // Đẩy dữ liệu máy lên đám mây (có kiểm tra phiên bản để không ghi đè nhầm thiết bị khác)
            const pushToCloud = async (kind) => {
                kind = kind === 'manual' ? 'manual' : 'auto';
                if (!sb || !authUserId) return;
                if (pushingRef.current) {
                    pushAgainRef.current = true;
                    if (kind === 'manual') pushAgainKindRef.current = 'manual';
                    return;
                }
                if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                    setSyncStatus('error');
                    setSyncError('Đang offline. Sẽ tự đồng bộ lại khi có mạng.');
                    return;
                }
                const stripped = stripForCloud(workspacesRef.current);
                const json = JSON.stringify(stripped);
                if (kind === 'manual' && json === lastSyncedJsonRef.current && versions.length > 0) {
                    setSyncStatus('saved');
                    showToast('Không có thay đổi mới để lưu', 'success');
                    return;
                }
                const payload = { version: 'v7', exportDate: new Date().toISOString(), workspaces: stripped };
                pushingRef.current = true;
                setSyncStatus('syncing');
                setSyncError('');
                try {
                    let newRev = 0;
                    if (cloudRevRef.current === 0) {
                        const { error } = await sb.from('jff_data').insert({ user_id: authUserId, data: payload, rev: 1 });
                        if (error) {
                            if (error.code === '23505') {
                                await openConflict();
                                return;
                            }
                            throw error;
                        }
                        newRev = 1;
                    } else {
                        const { data: rows, error } = await sb
                            .from('jff_data')
                            .update({ data: payload, rev: cloudRevRef.current + 1, updated_at: new Date().toISOString() })
                            .eq('user_id', authUserId)
                            .eq('rev', cloudRevRef.current)
                            .select('rev');
                        if (error) throw error;
                        if (!rows || rows.length === 0) {
                            await openConflict();
                            return;
                        }
                        newRev = rows[0].rev;
                    }
                    cloudRevRef.current = Number(newRev) || 1;
                    lastSyncedJsonRef.current = json;
                    lsSet('jff_cloud_rev', String(cloudRevRef.current));
                    lsSet('jff_synced_user', authUserId);
                    const stillSame = JSON.stringify(stripForCloud(workspacesRef.current)) === json;
                    lsSet('jff_dirty', stillSame ? '0' : '1');
                    setSyncStatus(stillSame ? 'saved' : 'pending');

                    // Lưu thêm 1 "bản đã tải lên" (đám mây chỉ giữ 5 bản mới nhất)
                    const lastVersionAt = Number(lsGet('jff_last_version_at')) || 0;
                    if (kind === 'manual' || Date.now() - lastVersionAt > AUTO_VERSION_GAP_MS) {
                        const { error: vErr } = await sb.from('jff_backups').insert({
                            user_id: authUserId,
                            kind,
                            summary: summarizeWorkspaces(stripped),
                            data: payload
                        });
                        if (!vErr) {
                            lsSet('jff_last_version_at', String(Date.now()));
                            setVersionsTick(n => n + 1);
                        } else {
                            setVersionsError(translateSyncError(vErr));
                        }
                    }
                    if (kind === 'manual') showToast('Đã lưu lên đám mây', 'success');
                } catch (err) {
                    setSyncStatus('error');
                    setSyncError(translateSyncError(err));
                } finally {
                    pushingRef.current = false;
                    if (pushAgainRef.current) {
                        pushAgainRef.current = false;
                        const again = pushAgainKindRef.current;
                        pushAgainKindRef.current = 'auto';
                        if (again === 'manual' || autoSyncRef.current) {
                            setTimeout(() => { if (pushRef.current) pushRef.current(again); }, 300);
                        }
                    }
                }
            };
            pushRef.current = pushToCloud;

            // 1) Lắng nghe trạng thái đăng nhập
            useEffect(() => {
                if (!sb) {
                    setAuthUser(null);
                    return;
                }
                let active = true;
                sb.auth.getSession().then(({ data }) => {
                    if (active) setAuthUser(data && data.session ? data.session.user : null);
                });
                const { data: sub } = sb.auth.onAuthStateChange((_event, session) => {
                    setAuthUser(session ? session.user : null);
                });
                return () => {
                    active = false;
                    sub.subscription.unsubscribe();
                };
            }, [sb]);

            // 2) Đồng bộ lần đầu sau khi đăng nhập
            useEffect(() => {
                setCloudReady(false);
                cloudRevRef.current = 0;
                if (!sb || !authUserId) {
                    setSyncStatus('off');
                    return;
                }
                let cancelled = false;
                (async () => {
                    setSyncStatus('syncing');
                    setSyncError('');
                    try {
                        const { data: row, error } = await sb.from('jff_data').select('data, rev').eq('user_id', authUserId).maybeSingle();
                        if (cancelled) return;
                        if (error) throw error;

                        const syncedUser = lsGet('jff_synced_user');
                        const sameUser = syncedUser === authUserId;
                        const dirty = lsGet('jff_dirty') === '1';
                        const localWs = workspacesRef.current;

                        if (!row) {
                            if (syncedUser && !sameUser && !isPristineWorkspaces(localWs)) {
                                const ok = window.confirm('Máy này đang giữ dữ liệu của một tài khoản khác.\n\nOK = tải dữ liệu này lên tài khoản mới\nHủy = bắt đầu với dữ liệu trống');
                                if (!ok) {
                                    workspacesRef.current = DEFAULT_WORKSPACES;
                                    setWorkspaces(DEFAULT_WORKSPACES);
                                    setActiveWsId('ws_default');
                                }
                            }
                            lsSet('jff_synced_user', authUserId);
                            cloudRevRef.current = 0;
                            lastSyncedJsonRef.current = null;
                            setCloudReady(true);
                            if (autoSyncRef.current) {
                                setTimeout(() => { if (pushRef.current) pushRef.current('auto'); }, 50);
                            } else {
                                setSyncStatus('pending');
                            }
                            return;
                        }

                        const cloudRev = Number(row.rev) || 1;

                        if (!sameUser) {
                            if (isPristineWorkspaces(localWs)) {
                                applyCloud(row);
                            } else {
                                cloudRevRef.current = cloudRev;
                                setConflictRow(row);
                                setSyncStatus('conflict');
                            }
                            return;
                        }

                        const storedRev = Number(lsGet('jff_cloud_rev')) || 0;
                        if (cloudRev === storedRev) {
                            cloudRevRef.current = cloudRev;
                            lastSyncedJsonRef.current = dirty ? null : JSON.stringify(stripForCloud(localWs));
                            setCloudReady(true);
                            if (dirty) {
                                if (autoSyncRef.current) {
                                    if (pushRef.current) pushRef.current('auto');
                                } else {
                                    setSyncStatus('pending');
                                }
                            } else {
                                setSyncStatus('saved');
                            }
                            return;
                        }

                        if (!dirty) {
                            applyCloud(row);
                        } else {
                            cloudRevRef.current = cloudRev;
                            setConflictRow(row);
                            setSyncStatus('conflict');
                        }
                    } catch (err) {
                        if (cancelled) return;
                        setSyncStatus('error');
                        setSyncError(translateSyncError(err));
                    }
                })();
                return () => { cancelled = true; };
            }, [sb, authUserId]);

            // 3) Tự động lưu lên đám mây sau khi có thay đổi (đợi 1,5 giây cho gọn)
            useEffect(() => {
                const json = JSON.stringify(stripForCloud(workspaces));
                if (!mountedRef.current) {
                    mountedRef.current = true;
                    return;
                }
                if (json === lastSyncedJsonRef.current) return;
                lsSet('jff_dirty', '1');
                if (!sb || !authUserId || !cloudReady) return;
                setSyncStatus('pending');
                if (!autoSync) return; // chế độ thủ công: chờ người dùng bấm "Lưu ngay"
                const timer = setTimeout(() => { if (pushRef.current) pushRef.current('auto'); }, 1500);
                return () => clearTimeout(timer);
            }, [workspaces, cloudReady, sb, authUserId, autoSync]);

            // 4) Khi quay lại tab / có mạng lại: kiểm tra bản mới từ thiết bị khác, đẩy bản chưa lưu
            useEffect(() => {
                if (!sb || !authUserId || !cloudReady) return;
                const onVisible = async () => {
                    if (document.visibilityState !== 'visible' || pushingRef.current) return;
                    try {
                        const { data: row, error } = await sb.from('jff_data').select('data, rev').eq('user_id', authUserId).maybeSingle();
                        if (error || !row) return;
                        if (Number(row.rev) > cloudRevRef.current) {
                            if (lsGet('jff_dirty') === '1') {
                                setConflictRow(row);
                                setSyncStatus('conflict');
                            } else {
                                applyCloud(row);
                                showToast('Đã cập nhật dữ liệu mới từ thiết bị khác', 'success');
                            }
                        }
                    } catch (e) { /* bỏ qua */ }
                };
                const onOnline = () => {
                    if (autoSyncRef.current && lsGet('jff_dirty') === '1' && pushRef.current) pushRef.current('auto');
                };
                document.addEventListener('visibilitychange', onVisible);
                window.addEventListener('online', onOnline);
                return () => {
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('online', onOnline);
                };
            }, [sb, authUserId, cloudReady]);

            const handleAuthSubmit = async (e) => {
                if (e) e.preventDefault();
                if (!sb) return;
                const email = authEmail.trim();
                if (!email || authPassword.length < 6) {
                    setAuthMessage({ type: 'warning', text: 'Nhập email và mật khẩu (tối thiểu 6 ký tự).' });
                    return;
                }
                setAuthBusy(true);
                setAuthMessage(null);
                try {
                    if (authMode === 'login') {
                        const { error } = await sb.auth.signInWithPassword({ email, password: authPassword });
                        if (error) throw error;
                        setAuthPassword('');
                        setShowAccountModal(false);
                        showToast('Đăng nhập thành công, đang đồng bộ...', 'success');
                    } else {
                        const { data, error } = await sb.auth.signUp({ email, password: authPassword });
                        if (error) throw error;
                        setAuthPassword('');
                        if (data && data.session) {
                            setShowAccountModal(false);
                            showToast('Đã tạo tài khoản và đăng nhập!', 'success');
                        } else {
                            setAuthMessage({ type: 'success', text: 'Đã gửi email xác nhận. Hãy bấm liên kết trong email rồi quay lại đăng nhập.' });
                            setAuthMode('login');
                        }
                    }
                } catch (err) {
                    setAuthMessage({ type: 'warning', text: translateAuthError(err && err.message) });
                } finally {
                    setAuthBusy(false);
                }
            };

            const handleSignOut = async () => {
                if (!sb) return;
                setAuthBusy(true);
                try {
                    if (cloudReady && lsGet('jff_dirty') === '1') {
                        if (autoSyncRef.current) {
                            await pushToCloud('auto');
                        } else if (!window.confirm('Có thay đổi chưa lưu lên đám mây. Đăng xuất vẫn giữ dữ liệu trên máy này nhưng đám mây chưa có thay đổi đó.\n\nVẫn đăng xuất?')) {
                            setAuthBusy(false);
                            return;
                        }
                    }
                    await sb.auth.signOut();
                    setShowAccountModal(false);
                    setConflictRow(null);
                    showToast('Đã đăng xuất. Dữ liệu vẫn còn trên máy này.');
                } catch (err) {
                    showToast('Không đăng xuất được: ' + (err && err.message ? err.message : ''), 'warning');
                } finally {
                    setAuthBusy(false);
                }
            };

            const handlePullNow = async () => {
                if (!sb || !authUserId) return;
                if (lsGet('jff_dirty') === '1' && !window.confirm('Máy này có thay đổi chưa lưu lên đám mây. Tải lại sẽ ghi đè các thay đổi đó. Tiếp tục?')) return;
                setAuthBusy(true);
                try {
                    const { data: row, error } = await sb.from('jff_data').select('data, rev').eq('user_id', authUserId).maybeSingle();
                    if (error) throw error;
                    if (!row) {
                        showToast('Đám mây chưa có dữ liệu', 'warning');
                    } else {
                        applyCloud(row);
                        showToast('Đã tải dữ liệu từ đám mây', 'success');
                    }
                } catch (err) {
                    showToast(translateSyncError(err), 'warning');
                } finally {
                    setAuthBusy(false);
                }
            };

            const handleSaveSbConfig = () => {
                const url = cfgUrlInput.trim().replace(/\/+$/, '');
                const key = cfgKeyInput.trim();
                if (!/^https:\/\/[^\s/]+$/i.test(url)) {
                    setAuthMessage({ type: 'warning', text: 'Project URL phải có dạng https://xxxx.supabase.co' });
                    return;
                }
                if (isForbiddenKey(key)) {
                    setAuthMessage({ type: 'warning', text: 'Đây là khóa BÍ MẬT (service_role / secret). Tuyệt đối không dán vào app. Hãy dùng anon public key hoặc publishable key.' });
                    return;
                }
                if (key.length < 20) {
                    setAuthMessage({ type: 'warning', text: 'Khóa anon/publishable quá ngắn, hãy kiểm tra lại.' });
                    return;
                }
                lsSet('jff_sb_url', url);
                lsSet('jff_sb_key', key);
                setSbConfig({ url, key });
                setAuthMessage({ type: 'success', text: 'Đã lưu cấu hình. Giờ bạn có thể đăng nhập.' });
            };

            const handleResetSbConfig = async () => {
                try { if (sb) await sb.auth.signOut(); } catch (e) { /* bỏ qua */ }
                lsDel('jff_sb_url');
                lsDel('jff_sb_key');
                const cfg = getSbConfig();
                setSbConfig(cfg);
