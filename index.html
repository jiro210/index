<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF - Jiro Financial Freedom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; transition: all 0.3s ease; }
        .phone-view { max-width: 430px; margin: 20px auto; border: 12px solid #1e293b; border-radius: 40px; height: 850px; overflow-y: auto; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .phone-view::-webkit-scrollbar { width: 0px; }
        [data-lucide] { width: 1.25rem; height: 1.25rem; }
        .settings-overlay { backdrop-filter: blur(4px); }
        
        /* CSS cho hình nền ứng dụng */
        .app-container {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .bg-overlay {
            /* Lớp phủ màu trắng đục 80% để vẫn thấy ảnh nhưng không làm khó đọc chữ */
            background-color: rgba(248, 250, 252, 0.85); 
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FUNDS = [
            { id: 'FFA', name: 'Quỹ tự do tài chính' },
            { id: 'LTSS', name: 'Quỹ tiết kiệm' },
            { id: 'EDU', name: 'Quỹ giáo dục' },
            { id: 'NEC', name: 'Quỹ nhu cầu thiết yếu' },
            { id: 'PLAY', name: 'Quỹ hưởng thụ' },
            { id: 'GIVE', name: 'Quỹ cho đi' },
        ];

        function App() {
            // State
            const [viewMode, setViewMode] = useState('desktop'); 
            const [showSettings, setShowSettings] = useState(false);
            const [gmtOffset, setGmtOffset] = useState(() => Number(localStorage.getItem('jars_gmt')) || 7);
            const [activeTab, setActiveTab] = useState('daily');
            const [expandedDate, setExpandedDate] = useState(null);
            const [currentTime, setCurrentTime] = useState('');
            
            // Background State
            const [bgImage, setBgImage] = useState(() => localStorage.getItem('jff_bg') || null);
            
            const fileInputRef = useRef(null);
            const bgInputRef = useRef(null);

            const [fundData, setFundData] = useState(() => {
                const saved = localStorage.getItem('jars_finance_data');
                return saved ? JSON.parse(saved) : {};
            });

            // Lấy ngày theo GMT đã chọn
            const getFormattedDate = (offsetDays = 0) => {
                const d = new Date();
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const targetTime = new Date(utc + (3600000 * gmtOffset));
                targetTime.setDate(targetTime.getDate() + offsetDays);
                return targetTime.toISOString().split('T')[0];
            };

            const [todayStr, setTodayStr] = useState(getFormattedDate(0));
            const [yesterdayStr, setYesterdayStr] = useState(getFormattedDate(-1));

            useEffect(() => {
                localStorage.setItem('jars_finance_data', JSON.stringify(fundData));
                localStorage.setItem('jars_gmt', gmtOffset);
            }, [fundData, gmtOffset]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                const timer = setInterval(() => {
                    const d = new Date();
                    const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                    const target = new Date(utc + (3600000 * gmtOffset));
                    setCurrentTime(target.toLocaleTimeString('vi-VN', { hour12: false }));
                    setTodayStr(getFormattedDate(0));
                    setYesterdayStr(getFormattedDate(-1));
                }, 1000);
                return () => clearInterval(timer);
            }, [gmtOffset, activeTab]);

            // Xử lý Upload Hình nền
            const handleBgUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Str = event.target.result;
                    setBgImage(base64Str);
                    localStorage.setItem('jff_bg', base64Str);
                };
                reader.readAsDataURL(file);
            };

            const removeBg = () => {
                setBgImage(null);
                localStorage.removeItem('jff_bg');
            };

            // Backup & Restore
            const exportData = () => {
                const dataStr = JSON.stringify(fundData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `backup_jff_gmt${gmtOffset}_${todayStr}.json`;
                link.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        setFundData(json);
                        alert("Khôi phục dữ liệu thành công!");
                    } catch (err) {
                        alert("File không hợp lệ!");
                    }
                };
                reader.readAsText(file);
            };

            const handleAmountChange = (date, fundId, rawValue) => {
                const numericValue = rawValue.replace(/\./g, '');
                if (numericValue === '' || /^\d+$/.test(numericValue)) {
                    const value = numericValue === '' ? 0 : parseInt(numericValue, 10);
                    setFundData(prev => ({
                        ...prev,
                        [date]: { ...prev[date], [fundId]: { ...prev[date]?.[fundId], amount: value } }
                    }));
                }
            };

            const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
            const formatInput = (val) => val ? val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";

            return (
                <div className="min-h-screen bg-slate-100 transition-all">
                    
                    {/* Thanh trượt: Đã thêm hidden md:flex để ẨN TRÊN ĐIỆN THOẠI, chỉ hiện trên máy tính */}
                    <div className="hidden md:flex fixed bottom-6 right-6 z-50 items-center bg-white p-2 rounded-2xl shadow-2xl border border-slate-200">
                        <span className="text-[10px] font-bold mr-2 text-slate-400">GIAO DIỆN PC</span>
                        <div 
                            onClick={() => setViewMode(viewMode === 'desktop' ? 'mobile' : 'desktop')}
                            className="w-12 h-6 bg-slate-200 rounded-full relative cursor-pointer p-1"
                        >
                            <div className={`w-4 h-4 bg-blue-600 rounded-full transition-all ${viewMode === 'mobile' ? 'translate-x-6' : 'translate-x-0'}`}></div>
                        </div>
                    </div>

                    <div className={viewMode === 'mobile' ? 'phone-view bg-slate-50' : 'w-full min-h-screen bg-slate-50'}
                         style={bgImage ? { backgroundImage: `url(${bgImage})` } : {}}
                         className={`app-container ${viewMode === 'mobile' ? 'phone-view' : 'w-full min-h-screen'}`}
                    >
                        {/* Lớp phủ màu để nền trong suốt 80% */}
                        <div className={`min-h-full pb-20 relative ${bgImage ? 'bg-overlay' : 'bg-slate-50'}`}>
                            
                            {/* Header */}
                            <header className={`${bgImage ? 'bg-white/90 backdrop-blur-md' : 'bg-white'} border-b sticky top-0 z-20 p-4 flex justify-between items-center shadow-sm`}>
                                <div className="flex items-center space-x-2">
                                    <div className="bg-blue-600 p-1.5 rounded-lg text-white">
                                        <i data-lucide="wallet" className="w-5 h-5"></i>
                                    </div>
                                    <h1 className="font-black text-slate-800 text-sm tracking-tighter uppercase">JFF</h1>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <div className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-md border border-blue-100">
                                        GMT{gmtOffset > 0 ? `+${gmtOffset}` : gmtOffset} | {currentTime}
                                    </div>
                                    <button onClick={() => setShowSettings(true)} className="text-slate-500 hover:text-blue-600 transition-colors p-1 bg-slate-100 rounded-full">
                                        <i data-lucide="settings"></i>
                                    </button>
                                </div>
                            </header>

                            {/* Main Content */}
                            <main className="p-4 max-w-4xl mx-auto relative z-10">
                                <div className="flex bg-slate-200/60 backdrop-blur-sm p-1 rounded-xl mb-6 w-fit">
                                    <button onClick={() => setActiveTab('daily')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'daily' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600'}`}>NHẬP LIỆU</button>
                                    <button onClick={() => setActiveTab('monthly')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'monthly' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600'}`}>LỊCH SỬ</button>
                                </div>

                                {activeTab === 'daily' ? (
                                    <div className="space-y-3">
                                        {FUNDS.map(fund => (
                                            <div key={fund.id} className={`${bgImage ? 'bg-white/80 backdrop-blur-md' : 'bg-white'} p-4 rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md`}>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-black text-slate-500 uppercase tracking-widest">{fund.name}</span>
                                                    <span className="text-[10px] text-slate-400 italic">Hôm qua: {formatCurrency(fundData[yesterdayStr]?.[fund.id]?.amount)}</span>
                                                </div>
                                                <input 
                                                    type="text" 
                                                    className="w-full text-2xl font-black text-blue-700 bg-transparent outline-none"
                                                    placeholder="0"
                                                    value={formatInput(fundData[todayStr]?.[fund.id]?.amount)}
                                                    onChange={(e) => handleAmountChange(todayStr, fund.id, e.target.value)}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {Object.keys(fundData).sort().reverse().map(date => {
                                            const isExp = expandedDate === date;
                                            const total = Object.values(fundData[date]).reduce((s, a) => s + (a.amount || 0), 0);
                                            return (
                                                <div key={date} className={`${bgImage ? 'bg-white/90 backdrop-blur-md' : 'bg-white'} rounded-xl border border-slate-200 overflow-hidden`}>
                                                    <button onClick={() => setExpandedDate(isExp ? null : date)} className="w-full p-4 flex justify-between items-center hover:bg-slate-50/50">
                                                        <span className="font-bold text-slate-700 text-sm">{date}</span>
                                                        <span className="text-emerald-600 font-black text-sm">{formatCurrency(total)}</span>
                                                    </button>
                                                    {isExp && (
                                                        <div className="px-4 pb-4 grid grid-cols-2 gap-2 border-t pt-3 bg-slate-50/50">
                                                            {FUNDS.map(f => (
                                                                <div key={f.id} className="text-[10px]">
                                                                    <p className="text-slate-400 font-bold uppercase">{f.id}</p>
                                                                    <p className="font-black text-slate-700">{formatCurrency(fundData[date]?.[f.id]?.amount)}</p>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 settings-overlay bg-slate-900/40">
                            <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <h2 className="font-black text-slate-800 uppercase tracking-tighter">Cài đặt hệ thống</h2>
                                    {/* Sử dụng SVG trực tiếp để đảm bảo hiển thị 100% không bị lỗi render */}
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-red-500 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <line x1="15" y1="9" x2="9" y2="15"></line>
                                            <line x1="9" y1="9" x2="15" y2="15"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div className="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
                                    
                                    {/* Đổi hình nền */}
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Giao diện (Background)</label>
                                        <button onClick={() => bgInputRef.current.click()} className="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white p-3 rounded-xl font-bold text-xs hover:opacity-90 transition-all shadow-sm">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                            <span>CHỌN HÌNH NỀN TỪ MÁY</span>
                                        </button>
                                        <input type="file" ref={bgInputRef} onChange={handleBgUpload} className="hidden" accept="image/*" />
                                        
                                        {bgImage && (
                                            <button onClick={removeBg} className="mt-3 text-[11px] text-red-500 font-bold w-full text-center hover:underline">
                                                Xóa hình nền hiện tại
                                            </button>
                                        )}
                                    </div>

                                    {/* Múi giờ */}
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Múi giờ hệ thống (GMT)</label>
                                        <select 
                                            value={gmtOffset} 
                                            onChange={(e) => setGmtOffset(Number(e.target.value))}
                                            className="w-full p-3 bg-slate-100 rounded-xl font-bold text-slate-700 outline-none border-2 border-transparent focus:border-blue-500"
                                        >
                                            {Array.from({length: 25}, (_, i) => i - 12).map(v => (
                                                <option key={v} value={v}>GMT {v >= 0 ? `+${v}` : v}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Backup */}
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Sao lưu dữ liệu</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={exportData} className="flex items-center justify-center space-x-2 bg-blue-600 text-white p-3 rounded-xl font-bold text-xs hover:bg-blue-700 transition-all shadow-sm">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                                <span>XUẤT FILE</span>
                                            </button>
                                            <button onClick={() => fileInputRef.current.click()} className="flex items-center justify-center space-x-2 bg-slate-800 text-white p-3 rounded-xl font-bold text-xs hover:bg-black transition-all shadow-sm">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                                <span>NHẬP FILE</span>
                                            </button>
                                            <input type="file" ref={fileInputRef} onChange={importData} className="hidden" accept=".json" />
                                        </div>
                                    </div>

                                    {/* App Info */}
                                    <div className="pt-4 border-t border-slate-200">
                                        <h3 className="text-[10px] font-black text-slate-400 uppercase mb-3">Thông tin App</h3>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs text-slate-600 space-y-2">
                                            <p className="flex justify-between"><span className="font-bold">App name:</span> <span>Jiro financial freedom</span></p>
                                            <p className="flex justify-between"><span className="font-bold">Author:</span> <span>Jiro</span></p>
                                            <p className="flex justify-between"><span className="font-bold">Version:</span> <span className="bg-blue-100 text-blue-700 px-2 rounded-md font-bold">3.6</span></p>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
