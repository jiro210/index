<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Quản lý Quỹ Tài Chính</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Lucide Icons for standalone HTML
        const Wallet = () => <i data-lucide="wallet"></i>;
        const CalendarDays = () => <i data-lucide="calendar-days"></i>;
        const ChevronDown = () => <i data-lucide="chevron-down"></i>;
        const ChevronUp = () => <i data-lucide="chevron-up"></i>;
        const Clock = () => <i data-lucide="clock"></i>;
        const LayoutDashboard = () => <i data-lucide="layout-dashboard"></i>;

        const FUNDS = [
            { id: 'FFA', name: 'Quỹ tự do tài chính' },
            { id: 'LTSS', name: 'Quỹ tiết kiệm' },
            { id: 'EDU', name: 'Quỹ giáo dục' },
            { id: 'NEC', name: 'Quỹ nhu cầu thiết yếu' },
            { id: 'PLAY', name: 'Quỹ hưởng thụ' },
            { id: 'GIVE', name: 'Quỹ cho đi' },
        ];

        const getGMT7Date = (offsetDays = 0) => {
            const d = new Date();
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const gmt7 = new Date(utc + (3600000 * 7));
            gmt7.setDate(gmt7.getDate() + offsetDays);
            const yyyy = gmt7.getFullYear();
            const mm = String(gmt7.getMonth() + 1).padStart(2, '0');
            const dd = String(gmt7.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        const formatDateVN = (dateStr) => {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        };

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
        };

        const formatInputNumber = (val) => {
            if (!val && val !== 0) return '';
            return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        function App() {
            const [activeTab, setActiveTab] = useState('daily');
            const [todayStr, setTodayStr] = useState(getGMT7Date(0));
            const [yesterdayStr, setYesterdayStr] = useState(getGMT7Date(-1));
            const [currentTime, setCurrentTime] = useState('');
            const [expandedDate, setExpandedDate] = useState(null);

            const [fundData, setFundData] = useState(() => {
                const saved = localStorage.getItem('jars_finance_data');
                return saved ? JSON.parse(saved) : {};
            });

            useEffect(() => {
                localStorage.setItem('jars_finance_data', JSON.stringify(fundData));
            }, [fundData]);

            useEffect(() => {
                lucide.createIcons();
                const timer = setInterval(() => {
                    const d = new Date();
                    const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                    const gmt7 = new Date(utc + (3600000 * 7));
                    setCurrentTime(gmt7.toLocaleTimeString('vi-VN', { hour12: false }));
                    
                    const newToday = getGMT7Date(0);
                    if (newToday !== todayStr) {
                        setTodayStr(newToday);
                        setYesterdayStr(getGMT7Date(-1));
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [todayStr, activeTab, expandedDate]);

            const handleAmountChange = (date, fundId, rawValue) => {
                const numericValue = rawValue.replace(/\./g, '');
                if (numericValue === '' || /^\d+$/.test(numericValue)) {
                    handleInputChange(date, fundId, 'amount', numericValue === '' ? 0 : parseInt(numericValue, 10));
                }
            };

            const handleInputChange = (date, fundId, field, value) => {
                setFundData(prev => {
                    const newData = { ...prev };
                    if (!newData[date]) newData[date] = {};
                    if (!newData[date][fundId]) newData[date][fundId] = { amount: 0, note: '' };
                    newData[date][fundId] = { ...newData[date][fundId], [field]: value };
                    return newData;
                });
            };

            const getFundValue = (date, fundId, field) => {
                if (fundData[date] && fundData[date][fundId]) {
                    return fundData[date][fundId][field];
                }
                return field === 'amount' ? 0 : '';
            };

            const renderDailyTab = () => (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-700">
                                    <th className="p-4 font-semibold">Tên quỹ</th>
                                    <th className="p-4 font-semibold text-center">Viết tắt</th>
                                    <th className="p-4 font-semibold text-slate-500 text-right">Hôm qua ({formatDateVN(yesterdayStr)})</th>
                                    <th className="p-4 font-semibold bg-blue-50/50 text-blue-700 text-right">Hiện tại ({formatDateVN(todayStr)})</th>
                                    <th className="p-4 font-semibold">Ghi chú</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {FUNDS.map((fund) => (
                                    <tr key={fund.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="p-4 font-medium text-slate-800">{fund.name}</td>
                                        <td className="p-4 text-center">
                                            <span className="inline-block px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-md font-bold">{fund.id}</span>
                                        </td>
                                        <td className="p-4 text-right">
                                            <div className="px-3 py-2 bg-slate-50 rounded border border-slate-100 text-slate-500 font-mono">
                                                {formatCurrency(getFundValue(yesterdayStr, fund.id, 'amount'))}
                                            </div>
                                        </td>
                                        <td className="p-4 bg-blue-50/30">
                                            <input
                                                type="text"
                                                className="w-full px-3 py-2 border border-blue-200 rounded focus:ring-2 focus:ring-blue-500 outline-none text-right font-mono font-bold text-blue-800"
                                                value={formatInputNumber(getFundValue(todayStr, fund.id, 'amount'))}
                                                onChange={(e) => handleAmountChange(todayStr, fund.id, e.target.value)}
                                            />
                                        </td>
                                        <td className="p-4">
                                            <input
                                                type="text"
                                                className="w-full px-3 py-2 border border-slate-200 rounded focus:ring-2 focus:ring-blue-500 outline-none italic text-sm"
                                                placeholder="Nhập ghi chú..."
                                                value={getFundValue(todayStr, fund.id, 'note')}
                                                onChange={(e) => handleInputChange(todayStr, fund.id, 'note', e.target.value)}
                                            />
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const renderMonthlyTab = () => {
                const currentMonthPrefix = todayStr.substring(0, 7);
                const daysInMonth = new Date(todayStr.split('-')[0], todayStr.split('-')[1], 0).getDate();
                const allDates = Array.from({ length: daysInMonth }, (_, i) => {
                    const day = String(i + 1).padStart(2, '0');
                    return `${currentMonthPrefix}-${day}`;
                }).reverse();

                return (
                    <div className="space-y-4">
                        {allDates.map(date => {
                            const dayData = fundData[date] || {};
                            const isExpanded = expandedDate === date;
                            const totalAmount = Object.values(dayData).reduce((sum, f) => sum + (f.amount || 0), 0);
                            return (
                                <div key={date} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button 
                                        onClick={() => setExpandedDate(isExpanded ? null : date)}
                                        className={`w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 ${isExpanded ? 'bg-slate-50' : ''}`}
                                    >
                                        <div className="flex items-center space-x-4">
                                            <div className={`p-2 rounded-lg flex flex-col items-center min-w-[50px] ${totalAmount > 0 ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                <span className="text-[10px] font-bold uppercase">Ngày</span>
                                                <span className="text-lg font-bold">{date.split('-')[2]}</span>
                                            </div>
                                            <div className="text-left">
                                                <h3 className="font-semibold text-slate-800">{formatDateVN(date)}</h3>
                                                <p className="text-sm font-bold text-emerald-600">{formatCurrency(totalAmount)}</p>
                                            </div>
                                        </div>
                                        <div className="text-slate-400">
                                            {isExpanded ? <i data-lucide="chevron-up"></i> : <i data-lucide="chevron-down"></i>}
                                        </div>
                                    </button>
                                    {isExpanded && (
                                        <div className="p-6 border-t border-slate-100 bg-slate-50/50 grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {FUNDS.map(fund => (
                                                <div key={fund.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-xs font-bold text-slate-500 uppercase">{fund.name}</span>
                                                    </div>
                                                    <div className="text-lg font-bold text-slate-800">{formatCurrency(dayData[fund.id]?.amount || 0)}</div>
                                                    {dayData[fund.id]?.note && <div className="text-xs text-slate-500 mt-1 italic">"{dayData[fund.id]?.note}"</div>}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 pb-12">
                    <header className="bg-white border-b p-4 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-200 text-white">
                                    <i data-lucide="wallet"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-black text-slate-800 uppercase tracking-tight leading-none">Financial Jars</h1>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase">Smart Management</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-sm font-bold text-blue-600 flex items-center">
                                    <i data-lucide="clock" className="w-4 h-4 mr-2"></i> {currentTime} — {formatDateVN(todayStr)}
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-6xl mx-auto px-4 mt-8">
                        <div className="flex space-x-2 mb-8 bg-slate-200/50 p-1 rounded-xl w-fit">
                            <button 
                                onClick={() => setActiveTab('daily')} 
                                className={`px-6 py-2 rounded-lg font-bold text-sm transition-all ${activeTab === 'daily' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}
                            >
                                Hàng ngày
                            </button>
                            <button 
                                onClick={() => setActiveTab('monthly')} 
                                className={`px-6 py-2 rounded-lg font-bold text-sm transition-all ${activeTab === 'monthly' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}
                            >
                                Thống kê tháng
                            </button>
                        </div>
                        {activeTab === 'daily' ? renderDailyTab() : renderMonthlyTab()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
